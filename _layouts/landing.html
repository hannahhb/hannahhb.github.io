<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <style>
    :root {
      --bg: #000; --text: #e8e3da; --muted: #9a958c; --line: #22252d;
      --coral: #e8715a; --lilac: #b48ad6; --butter: #e8d36a;
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: var(--lilac); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; font-size: 14px;
      background: linear-gradient(#000 60%, rgba(0,0,0,0));
    }
    .top .name { color: var(--text); font-weight: 600; }
    .top nav a { color: var(--muted); margin-left: 18px; }
    .top nav a:hover { color: var(--text); text-decoration: none; }

    .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .left { position: sticky; top: 0; height: 100vh; overflow: hidden; }
    .right { padding: 96px 56px 64px 32px; max-width: 640px; align-self: center; }

    #bloom-btn {
      all: unset; position: absolute; inset: 0; cursor: pointer;
    }
    #bloom-btn:focus-visible { outline: 2px solid var(--lilac); outline-offset: -6px; }
    #bloom {
      position: absolute; inset: 0; margin: 0; padding: 56px 8px 8px;
      font: 10px/1.15 var(--mono); color: #444; white-space: pre; overflow: hidden;
      transition: opacity .8s ease;
    }
    .hint {
      position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
      font: 12px var(--mono); color: var(--muted); pointer-events: none;
      transition: opacity .4s ease;
    }
    .hint span { color: var(--coral); }
    .hint { width: max-content; margin: 0 auto; padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.8); }
    .left.open .hint { opacity: 0; }
    .left.open #bloom { opacity: .35; }

    .projects {
      position: absolute; inset: 0; overflow: auto;
      padding: 84px 40px 40px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.88));
      opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .6s ease;
    }
    .projects.in { opacity: 1; transform: none; }
    .projects h2 { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
    .proj { border-left: 2px solid var(--line); padding: 2px 0 2px 16px; margin: 0 0 22px; }
    .proj:nth-child(2) { border-color: var(--coral); }
    .proj:nth-child(3) { border-color: var(--lilac); }
    .proj:nth-child(4) { border-color: var(--butter); }
    .proj h3 { font-size: 17px; line-height: 1.35; margin: 0 0 2px; color: #fff; }
    .proj .meta { font: 12px var(--mono); color: var(--muted); margin: 0 0 6px; }
    .proj p { margin: 0 0 6px; font-size: 14.5px; color: #cfc9bf; }
    .proj .links a { font-size: 13px; margin-right: 14px; }
    .back {
      background: none; border: 1px solid #3a3e48; color: var(--text); border-radius: 8px;
      padding: 6px 12px; font: 13px var(--mono); cursor: pointer; margin-top: 4px;
    }
    .back:hover { border-color: var(--coral); }

    .right h1 { font-size: 34px; line-height: 1.2; margin: 0 0 22px; color: #fff; letter-spacing: -.01em; }
    .right p { margin: 0 0 16px; color: #d6d0c6; }
    .right strong { color: #fff; }
    .right .facts { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 24px; }
    .right .facts p { color: var(--muted); margin: 0 0 6px; }
    .right ul { padding-left: 18px; color: #d6d0c6; }

    @media (max-width: 820px) {
      .split { grid-template-columns: 1fr; }
      .left { position: relative; height: 72vh; }
      .right { padding: 28px 18px 56px; }
      .projects { padding: 70px 18px 24px; }
      #bloom { font-size: 8px; }
      .top { padding: 12px 16px; }
      .top nav a { margin-left: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #bloom, .projects, .hint { transition: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/about' | relative_url }}">About</a>
      <a href="{{ '/publications' | relative_url }}">Publications</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
    </nav>
  </header>

  <main class="split">
    <section class="left" id="left" aria-label="Projects">
      <button id="bloom-btn" type="button" aria-controls="projects" aria-expanded="false" aria-label="Open my latest projects">
        <pre id="bloom" aria-hidden="true"></pre>
      </button>
      <p class="hint">click the flower to <span>open my projects</span></p>
      <div class="projects" id="projects" hidden>
        {% include projects-list.html %}
        <button class="back" type="button" id="close-projects">&larr; back to the flower</button>
      </div>
    </section>

    <section class="right">
      {{ content }}
    </section>
  </main>

  <script src="{{ '/assets/js/bloom.js' | relative_url }}"></script>
  <script>
  (function () {
    var left = document.getElementById('left');
    var btn = document.getElementById('bloom-btn');
    var panel = document.getElementById('projects');
    var close = document.getElementById('close-projects');
    function openProjects() {
      if (!window.Bloom || left.classList.contains('open') || Bloom.zooming) return;
      btn.setAttribute('aria-expanded', 'true');
      Bloom.zoom(function () {
        left.classList.add('open');
        panel.hidden = false;
        requestAnimationFrame(function () { requestAnimationFrame(function () { panel.classList.add('in'); }); });
        panel.querySelector('a, button').focus({ preventScroll: true });
      });
    }
    function closeProjects() {
      panel.classList.remove('in');
      left.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      setTimeout(function () { panel.hidden = true; }, 600);
      Bloom.reset();
      btn.focus({ preventScroll: true });
    }
    btn.addEventListener('click', openProjects);
    close.addEventListener('click', closeProjects);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && left.classList.contains('open')) closeProjects(); });
  })();
  </script>

  {% include visit-prompt.html %}
</body>
</html>
