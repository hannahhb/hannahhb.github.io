rs"},{"title":"From Stethoscope to Scalpel: Making Feature Geometry Prescriptive for Fine-Tuning","id":"rec8NSIUTrMynoifi","mentors":"Yuxiao Li (Independent)","areas":["Mechanistic interpretability","Alignment"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Interpretability-guided fine-tuning promises to tell us which layers to adapt, but our Spring 2026 results show feature geography alone can't yet deliver: base and instruction-tuned models with nearly identical SAE feature geography demand opposite layer choices. This project identifies the missing signal (adapter-update structure, training regime, Jacobian-lens readouts) and builds it into a reliable, mechanistically justified layer-selection procedure.","prereq":"- Highly proficient in Python and PyTorch.\n- Fine-tuned a transformer LM (LoRA/PEFT counts; guided or toy projects fine). - Comfortable with HuggingFace Transformers and running GPU jobs independently (Colab/RunPod).\n- Familiarity with mech interp probes like SAEs, SAE Lens, J-lens, etc.\n- Comfort with linear algebra (subspaces, norms, rank) needed for the adapter-analysis workstream.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_0","i":35,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Feature geometry, influence & automated interp","url":"https://sparai.org/projects/f26/rec8NSIUTrMynoifi/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"Natural deduction as a sandbox for capability emergence from RL.","id":"rec8qbsiN63iT3e8Z","mentors":"Dmitry Manning-Coe (Simplex/MATS/UIUC)","areas":["Evaluations","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 4-6 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"We develop a model organism of capability emergence through RL.","prereq":"1. Be able to implement nanoGPT scale models from scratch.\n\n1. Ability to implement basic intepretability techniques.\n\n1. Familiarity with formal logic is not required but is a plus.\n\n1. Ability to implement simple custom RL pipelines.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_2","i":36,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Model organisms of emergent misalignment","url":"https://sparai.org/projects/f26/rec8qbsiN63iT3e8Z/","inv":"Co-working","teamMax":6,"teamShort":"4-6","hoursShort":"10 hrs"},{"title":"In-the-Wild AI Control","id":"rec8RybPH2kNV6qDa","mentors":"Sree Sharvesh (MATS), Thao Pham (MATS)","areas":["AI control","Multi-agent systems","Evaluations"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Current monitoring evaluations do not fully capture realistic internal deployments, where adversaries can adapt to defenses, exploit long-horizon interactions, and leverage environmental state. This project will focus on: (1) developing red-teaming environments where attacks emerge and co-evolve with monitors rather than being enumerated in advance, and (2) systematically evaluating which monitoring strategies and oversight levels remain robust across different threat models and deployment constraints.","prereq":"- Good software engineering skills - You can write high-quality, legible code quickly (skilfully using AI), navigate large codebases you didn't write, and debug problems quickly and thoroughly. You have good judgment about when to write stable shared code vs throwaway code, and when to invest in a refactor, tooling or faster iteration loops. You check and understand your AI\u2019s work.\n- Technical skills: Python + libraries + Inspect AI + building and debugging evals.\n- Hands-on experience running experiments with LLM APIs or agent scaffolds .\n- Read and understood the core AI control framing - at minimum Greenblatt et al., \u201cAI Control: Improving Safety Despite Intentional Subversion.\u201d\n- Able to commit minimum 10 hours/week for the duration of the program.\n\n**Nice-to-have (not required):**\n\n- Comfortable reasoning about classifiers, ROC curves, false positive rates, and base rates (much of this project is about measuring monitor performance correctly).\n- Familiarity with control/monitoring evaluation work such as SHADE-Arena, Ctrl-Z, or the AI control safety case sketch.\n- Experience with red-teaming, security (e.g., ATT&CK-style attacker modeling), multi-agent systems, game-theory or evaluaitons.\n- Experience designing sandboxed or agentic evaluation environments.","group":"CONTROL","sub":"CONTROL_0","i":37,"hrsN":10,"gname":"AI Control & Scalable Oversight","sname":"Control protocols & escalation to humans","url":"https://sparai.org/projects/f26/rec8RybPH2kNV6qDa/","inv":"Co-working","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Black-Box Detection of Sandbagging in LLMs","id":"rec8w4557sqlldYIj","mentors":"Viktor Moskvoretskii (EPFL)","areas":["Evaluations","Behavioral evaluation of LLMs","AI control"],"hours":"15 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Sandbagging (a model strategically underperforming on evaluations) is a growing problem not only for auditors but for downstream deployers and end users, almost none of whom have white-box access. This project builds and rigorously evaluates black-box, query-only methods for detecting strategic underperformance, centered on an adaptive auditing agent that probes capability across contexts.","prereq":"High proficiency in Python. Have worked with LLM APIs or open-weight models (prompting, sampling, batched inference). Comfortable with classification metrics and basic statistics. Prior exposure to LLM evaluation, red-teaming/jailbreaking, or AI-safety auditing is a plus but not required.","group":"EVALS","sub":"EVALS_0","i":38,"hrsN":15,"gname":"Evaluation Science & Eval Awareness","sname":"Benchmark validity & sandbagging","url":"https://sparai.org/projects/f26/rec8w4557sqlldYIj/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"15 hrs"},{"title":"Measuring Headroom in Adversarial Evaluations","id":"rec92cyMzSzUb2eLY","mentors":"Jamie Hayes (Google DeepMind), A. Feder Cooper (Yale University)","areas":["AI security","Evaluations","Misuse risk"],"hours":"15 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Recent frontier system cards report that automated red teaming is saturating near 0% Attack Success Rate on jailbreaks and prompt injections, making it hard to tell whether current attacks are simply too weak or if our safety benchmarks are toy-like and eval-aware. Estimating the headroom a better attack would achieve is difficult without explicitly designing informative upper bounds. To resolve this, we will build a ladder of powerful, relaxed-constraint red-teaming attacks\u2014ranging from continuous embedding-space PGD to internal activation steering\u2014to quantify unexploited attack headroom and distinguish true semantic robustness from search limitations.","prereq":"- Highly proficient in python\n- Some familiarity with gradient-based optimization on language models (e.g., PGD, GCG) or automated black-box jailbreaking frameworks (PAIR, TAP).\n- Ideally some experience running model evaluations, handling structured red-teaming benchmarks","group":"SECURITY","sub":"SECURITY_2","i":39,"hrsN":15,"gname":"AI Security, Misuse & Cyber","sname":"Misuse uplift & infohazard measurement","url":"https://sparai.org/projects/f26/rec92cyMzSzUb2eLY/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"15 hrs"},{"title":"Emergent Alignment: Does Training on Nonhuman Welfare Transfer to Broader Alignment?","id":"rec9MdqTLmwjnxJo3","mentors":"Allen Lu (Mycelium; NYU CMEP), Aidan Kankyoku (Anima International), Constance Li (Sentient Futures)","areas":["Alignment","AI welfare","Behavioral evaluation of LLMs"],"hours":"5 hrs/week","team":"Team size: 2-4 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Build a pipeline for \"emergent alignment\". Can fine-tuning an open-source model (e.g. Gemma) on a single narrow good value, like compassion for animals, make it broadly more aligned toward humans too, without hurting its capabilities?","prereq":"Treat these as guides, not constraints! You definitely don\u2019t need to have all of these requirements, and I\u2019d encourage you to apply regardless. I\u2019m very open to taking on mentees newer to the space, as I\u2019m sure we\u2019ll both learn a lot from each other.\n\nRequired:\n\n- Background: Experience in topics around ethics, moral philosophy, computer science, and animal welfare (coursework, volunteer work, or demonstrated interest)\n- Technical proficiency: knowledge of Python (other languages a plus), version control with Git, and can write clear technical documentation\n- LLM APIs: Experience with integrating LLMs into projects or has built applications using LLM APIs (OpenAI, Claude API, etc.).\n- AI-assisted coding: Regularly uses LLMs (ChatGPT, Claude, Cursor, etc.) as coding assistants and can effectively iterate on LLM-generated code.\n- Research basics: Comfortable reading technical papers, identifying gaps in existing work, and synthesizing findings to iterate on previous research\n- General: Strong communication skills, can communicate technical concepts clearly to non-technical audiences, self-starter mindset: works independently to make measurable progress between meetings\n- Familiarity with eval topics (prompt engineering) or frameworks (e.g. Inspect) is a plus.","group":"WELFARE","sub":"WELFARE_0","i":40,"hrsN":5,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Model self-reports \u2014 validity & robustness","url":"https://sparai.org/projects/f26/rec9MdqTLmwjnxJo3/","inv":"Co-working","teamMax":4,"teamShort":"2-4","hoursShort":"5 hrs"},{"title":"AI for epistemics: decision-making evals, deployment research and cause prioritisation","id":"rec9Oet0sZQOusVbi","mentors":"Alexander Mohar Csaky (Independent)","areas":["Societal impacts","Behavioral evaluation of LLMs","AI strategy"],"hours":"5 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"AI is shaping how people and institutions decide, but we can barely measure whether it makes decisions better, the tools that would help struggle to get adopted, and what matters most in this space. This project works across three workstreams: building decision-making benchmarks for models, researching how to most effectively improve decision making with AI, and producing a cause prioritisation for the field.","prereq":"All workstreams: able to commit 5+ hours/week for the full three months; strong written English; comfortable working independently between check-ins and sharing unfinished work early. State clearly in your application which workstream you are applying to.\n\nEvals workstream: strong conceptual and experiment-design skills: able to take a fuzzy notion like \"presents facts honestly\" and turn it into something measurable, and to spot when a metric fails to capture what it claims to. A background in philosophy, cognitive science, social science methods or similar is as relevant as an ML one. You should be comfortable enough with Python and LLM APIs to build and run evals with AI coding assistance, but you do not need to be a strong engineer.\n\nAdoption strategy workstream: experience in at least one of product, go-to-market, sales, consulting, government or policy; comfortable cold-contacting and talking to people you don't know; evidence of strong, persuasive writing.\n\nPrioritisation workstream: background in economics, philosophy, policy analysis or a similar analytical field; have written at least one substantial piece of analysis that makes and defends judgement calls under uncertainty.","group":"SOCIETAL","sub":"SOCIETAL_0","i":41,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Human autonomy & epistemic security","url":"https://sparai.org/projects/f26/rec9Oet0sZQOusVbi/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"5 hrs"},{"title":"Does the internet teach AI models to hide their survival drive? An empirical study","id":"recaE2hXnR7m7wSC4","mentors":"Matteo Bulloni (Independent / IAPS fellow)","areas":["Behavioral evaluation of LLMs","Mechanistic interpretability","Alignment"],"hours":"10 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Misalignment papers, news stories and fiction keep (and are bound to keep, in the future, as this corpus of material grows) repeating one lesson: \"AI models that display a survival drive get retrained or shut down\". And we now have solid evidence that models absorb, and then act out, the expectations about AI they find in their own training data. This project aims thus to empirically test whether training on this growing discourse teaches models to conceal self-preservation-driven behavior rather than truly lose it: if so, both behavioral testing and the techniques we use to read a model's internals may be quietly losing reliability on a propensity we definitely want to detect, as it might result in one of the strongest possible drivers to scheming and concealed action toward power seeking.","prereq":"We have LLMs as our allies, at least for now. Therefore, what I mostly care about is signs that the mentee is smart, motivated and hard-working. Required prior experience is set at a minimum - if you are smart, have some relevant background and invest time to fill the gaps, you'll be fine.\n\nRequired:\n- Solid Python: you can write and debug your own code comfortably; rleying exclusively on LLMs is not yet ideal, and if needed, the mentee must be able to review code manually.\n- Solid conceptual understanding of machine learning, neural networks, transformers and large language models current training pipelines.\n- Some experience with agentic coding environments, to know how to use them properly.\n\nExplicitly NOT required:\n- Prior mechanistic interpretability experience. If you know what a residual stream is, great; if not, the first two weeks include a guided reading/tutorial list, and the early pipeline work is designed to teach the tools.\n- Prior hands-on experience with LLMs: it's ok if you have never fine-tuned an open-weight model with PyTorch/HuggingFace.\n- Knowledge of the specific literature (I will provide a compact reading list).\n- Any formal credential; self-taught is fine.\n\nNice to have (mention it if applicable):\n- Experience running jobs on rented GPUs (RunPod, Lambda, vast.ai or similar).\n- Experience building evaluation harnesses or LLM-judge pipelines.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_0","i":42,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Data provenance & unintended generalization","url":"https://sparai.org/projects/f26/recaE2hXnR7m7wSC4/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"10 hrs"},{"title":"AI and the First Amendment: A Doctrinal Taxonomy","id":"recaHXkd2UDzrqXZr","mentors":"Michael Endrias (Institute for AI Policy and Strategy (IAPS))","areas":["US policy","Societal impacts","AI strategy"],"hours":"7 hrs/week","team":"Team size: 3-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"This project builds a comprehensive, interactive public resource mapping every intersection between artificial intelligence and First Amendment doctrine across all six clauses and their implied rights. Mentees will research existing precedent, identify novel legal questions, and produce in-depth analyses that serve as both a reference taxonomy and a foundation for future publications in tech policy outlets and law reviews.","prereq":"Required: strong reading comprehension and analytical writing skills. Willingness to engage deeply and sustained with legal scholarship, judicial opinions, and constitutional doctrine. Ability to synthesize complex material and explain it clearly to a general audience.\nThis project will have the highest yield for someone who wants to attend law school and pursue constitutional law, information law, or technology policy. Pre-law undergraduates, recent graduates considering law school, and graduate students in adjacent fields (political science, philosophy, communications, public policy) are all strong candidates. Current law students are also welcome.\nTechnical backgrounds are welcome if paired with a genuine interest in constitutional doctrine. The core requirement is the capacity and willingness to read deeply, build real subject-matter expertise, and engage critically with the material rather than producing surface-level summaries.","group":"GOV_POLICY","sub":"GOV_POLICY_0","i":43,"hrsN":7,"gname":"Policy, Law & Institutions","sname":"AI, law & constitutional doctrine","url":"https://sparai.org/projects/f26/recaHXkd2UDzrqXZr/","inv":"Co-working","teamMax":6,"teamShort":"3-6","hoursShort":"7 hrs"},{"title":"Mapping and Verifying Multi-Dimensional Compliance in AI Constitutions through Constraint Satisfaction","id":"recAIQIVmPdY29wRq","mentors":"Dhairya Dalal (MATS Research), Marco Valentino (University of Sheffield)","areas":["Scalable oversight","Technical governance","Evaluations"],"hours":"3 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Frontier labs focused on AI safety and alignment are adopting AI constitutions as a means to ensure alignment with codified principles, values, and behavioral specifications. Anthropic\u2019s Claude Constitution (Askell et al., 2026) and OpenAI\u2019s Model Spec (OpenAI, 2026) serve as technical governance resources in post-training alignment (Bai et al., 2022; Guan et al., 2024). AI constitutions are generally long, complex documents that combine behavioral requirements, guiding principles, authority structures, priorities, and exceptions. Jakkli et al. (2026) found that, despite improvements across model generations, violations persist when models must resolve competing requirements and sources of authority, particularly in multi-turn and agentic task settings. This project aims to build upon that line of research to more fundamentally examine existing AI constitution documents, better understand the multi-dimensional requirements they present, and formally classify common failure modes. Specifically, this project aims to (1) create a classification framework to analyze failures in multi-requirement compliance settings, (2) create a benchmark of use cases derived from the framework to evaluate AI compliance, and (3) explore constraint-satisfaction methods for verifying compliance in such settings.","prereq":"The project is open to applicants from any academic or professional background. Candidates should be self-motivated, communicate clearly, and be able to plan and run experiments independently. An ideal candidate will have experience with Python and independent research, familiarity with standard data analysis methods, and at least one research output that has been shared with a wider audience, such as a published paper, workshop submission, shared-task contribution, LessWrong post, or course paper. However, these are not strict requirements, and we will consider highly motivated and agentic candidates who can demonstrate the ability to conduct high-quality research.","group":"GOV_POLICY","sub":"GOV_POLICY_2","i":44,"hrsN":3,"gname":"Policy, Law & Institutions","sname":"Compliance tracking, red lines & verification","url":"https://sparai.org/projects/f26/recAIQIVmPdY29wRq/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"3 hrs"},{"title":"Factored cognition-based AI control protocols with untrusted decomposition","id":"recaQzRMvjrThukoU","mentors":"Daniel Phillips (Independent)","areas":["AI control","Multi-agent systems"],"hours":"20 hrs/week","team":"Team size: 1-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"This project is to thoroughly red-team a protocol in which a strong untrusted model splits a task into subtasks for agents using either the same model or a weaker trusted model in complex settings, which is structurally similar to how a lot of agentic coding is currently performed.","prereq":"- Highly proficient using Python\n- Basic understanding of Linux, backend web services, and databases","group":"MULTIAGENT","sub":"MULTIAGENT_1","i":45,"hrsN":20,"gname":"Multi-Agent Systems & Coordination","sname":"Collusion & untrusted monitoring","url":"https://sparai.org/projects/f26/recaQzRMvjrThukoU/","inv":"Co-working","teamMax":3,"teamShort":"1-3","hoursShort":"20 hrs"},{"title":"Lottery tickets underlying unintended generalization in language models","id":"recArOjpEPNym0XZD","mentors":"Aishwarya Balwani (St. Jude Children's Research Hospital)","areas":["Mechanistic interpretability","Alignment","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Narrow finetuning can install broad unintended behaviours, e.g., emergent misalignment, subliminal learning, and inductive backdoors, through data that looks harmless or unrelated. This project asks whether these behaviours are carried by sparse subnetworks, and whether those subnetworks pre-exist in the base model or are created by the finetune, through the lens of the lottery ticket hypothesis.","prereq":"- Fluency with Python + PyTorch\n- Familiarity with ML + Linear Algebra at the undergraduate level\n- Comfort (at least conceptually) with fine-tuning and evaluating LLMs","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_0","i":46,"hrsN":8,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Data provenance & unintended generalization","url":"https://sparai.org/projects/f26/recArOjpEPNym0XZD/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Does the Thermometer Change the Reading? Testing Whether AI Welfare Self-Reports Survive a Change of Frame","id":"recAtnKGoCBgS9Wvc","mentors":"Varad Vishwarupe (Department of Computer Science and Institute for Ethics in AI, University of Oxford | Trinity College, University of Cambridge |)","areas":["AI welfare","Behavioral evaluation of LLMs","Evaluations"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"The field increasingly measures AI welfare by asking models about their own states, yet frontier models increasingly detect when they are being tested and change how they answer. This project runs the first systematic test of whether AI welfare self-reports survive a change of presentation frame, or whether the field's core instrument is partly measuring the model's recognition of the probe.","prereq":"\u200b\n\nStrongly useful, but not required (mention if you have it):\n\nExperience with experimental design, psychometrics, or inter-rater reliability (Cohen's kappa, parallel forms, construct validity). Whoever has this would shape the core study.\nA background in philosophy of mind or cognitive science, enough to tell the difference between a self-report, an introspective report, and a confabulation.\nPrior use of an evaluation framework such as Inspect.\n\nNot required at all (BUT huge bonus if you have it!:\n\nAny prior background in AI welfare, digital minds, or consciousness research especially at leading institutions involved in this field such as the NYU Centre for Mind, Ethics and Policy, Oxford Institute for Ethics in AI, CHAI Berkeley, Cambridge Digital Minds Lab, etc. This field is small enough that a capable person reaches the frontier in a few weeks, and I will provide a structured reading path. I care far more that you are rigorous, self-directed, and genuinely curious about the question than that you already know the literature.\n\nI am looking to mentor 2-3 mentees at max due to my current hectic workload.","group":"WELFARE","sub":"WELFARE_0","i":47,"hrsN":8,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Model self-reports \u2014 validity & robustness","url":"https://sparai.org/projects/f26/recAtnKGoCBgS9Wvc/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"An Exploration of What Kinds of Training Pressure Cause COT Obfuscation","id":"recaZTXfK7ua29Izm","mentors":"Cody Wild (Google DeepMind)","areas":["Chain of thought","Scalable oversight"],"hours":"6 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Study the obfuscation impact of different misbehavior monitors used as rewards, to better understand how well the emergent norm of not training against thought regions specifically matches the actual contours of obfuscation risk.","prereq":"- Experience fine tuning open source language models, and specifically experience with using open source RL training frameworks and toolkits on such models\n- Evidence of independent execution of at least 2 previous coding projects a non-classroom environment \n- Resourceful, persistent; a track record of finding ways to solve technical problems even when new to a domain \n- Strong familiarity with the literature around chain of thought obfuscation and monitorability","group":"COT","sub":"COT_0","i":48,"hrsN":6,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"CoT obfuscation & steganography","url":"https://sparai.org/projects/f26/recaZTXfK7ua29Izm/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"6 hrs"},{"title":"Detecting Hidden Traits in Synthetic Data","id":"recbA2AtJc7pTndAJ","mentors":"May Dixit (Independent)","areas":["Alignment","Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"In this project, we will run a red team / blue team exercise in creating and detecting hidden traits in synthetic datasets. Recent work shows that such traits can transfer diffusely through the synthetic data, surviving semantic filtering -- which makes this project high impact.","prereq":"Autonomous, able to set up and run experiments quickly.\nGood experimental hygiene\nGood engineering instincts\nExperience with fine-tuning models\nNice to have: Mech Interp knowledge","group":"INTERP_PROBES","sub":"INTERP_PROBES_2","i":49,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Probe reliability across models & data","url":"https://sparai.org/projects/f26/recbA2AtJc7pTndAJ/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"Who Ran This Agent? Stress-Testing Attribution for Agent Governance","id":"recBDO90xh0RNMrRj","mentors":"Yiming Li (Nanyang Technological University)","areas":["AI security","Technical governance","Evaluations"],"hours":"14 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Recent work reports high accuracy in identifying which model or framework produced an AI agent's execution trajectory, and emerging governance proposals increasingly assume this capability exists. We will systematize these methods and re-evaluate them under a single protocol, testing how reliable agent attribution actually is under deployment-realistic conditions.","prereq":"1. Highly proficient in Python.\n2. Comfortable with standard classification and evaluation workflows: training a classifier, cross-validation, reading an ROC curve. You do not need to already know what Equal Error Rate is, but you should be comfortable learning and implementing it.\n3. Able to read recent security or ML preprints and extract a method's threat model and experimental setup accurately. This is the core skill for this project.\n4. Hands-on experience running an LLM agent (any framework: LangChain, ReAct-style, browser agents, or a custom tool-calling loop), and comfort with LLM API workflows.\n\nNice to have (not required):\n1. Familiarity with authorship attribution, speaker verification, or any biometric verification setting.\n2. Prior exposure to LLM watermarking or model fingerprinting.\n3. Experience building evaluation harnesses or reproducing results from papers.\n\nYou do NOT need prior publications. Careful experimental hygiene and the willingness to report an unfavorable result honestly matter more than credentials.","group":"SECURITY","sub":"SECURITY_3","i":50,"hrsN":14,"gname":"AI Security, Misuse & Cyber","sname":"Agent attribution & cyber-offense evals","url":"https://sparai.org/projects/f26/recBDO90xh0RNMrRj/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"14 hrs"},{"title":"Mapping Cost Trajectories of AI-Adjacent Technologies","id":"recbF3sOupRLiKHzf","mentors":"Isaak Mengesha (University of Oxford)","areas":["AI strategy","Economics of AI"],"hours":"8 hrs/week","team":"Team size: 4-6 mentees","involvement":"Guidance (1+ hr/week/mentee), Limited involvement","summary":"A core macrostrategic question is whether we can predict \u2014 and steer \u2014 technological progress to mitigate risk from transformative AI; answering it requires empirical cost-and-performance trajectories for the technologies AI depends on and the technologies AI will transform, which today mostly don't exist. Mentees will each construct one such trajectory \u2014 a longitudinal price-and-specification dataset for an AI-adjacent technology (inputs to AI: accelerators, memory, interconnects, data-center power/cooling; or AI-consuming: robots, lidar, autonomous platforms, sensing) \u2014 contributing to the larger effort of establishing a \"Technology Observatory.\"","prereq":"-Proficient in Python (pandas; comfortable writing scrapers or using Playwright/requests with guidance from documented example scripts).\n-Comfortable with careful, tedious data work: manual verification of archival sources, documenting provenance, coding missing data correctly. This project is 70% data construction, 30% analysis.\n-Basic econometrics/statistics: OLS regression, log transforms; familiarity with PCA or clustering is a plus, not required.\n-Interest in economics of innovation or technology forecasting; prior exposure to experience/learning curves is a plus.\n-Sufficient weekly time (8+ h) \u2014 data collection cannot be batched into occasional sprints without quality loss.","group":"SOCIETAL","sub":"SOCIETAL_2","i":51,"hrsN":8,"gname":"Societal, Economic & Epistemic Impacts","sname":"Economic modelling & cost trajectories","url":"https://sparai.org/projects/f26/recbF3sOupRLiKHzf/","inv":"Guidance","teamMax":6,"teamShort":"4-6","hoursShort":"8 hrs"},{"title":"Studying AI Identity","id":"recbGXuXu6I6bVkuJ","mentors":"Ashe Vazquez Nunez (MATS (extension fellow))","areas":["Philosophy of AI","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"This project involves ideating and executing experiments on AI metacognition and identity. Mentees can also work on the theoretical foundations of metacognitive intelligence, helping inform experiment design and interpretation.","prereq":"(also found in the project proposal)\n\nThe main selection criteria is clarity of thought and compatibility of research interests and style. I\u2019ll work with people I think I can provide value for as a mentor.\n\nThere are no hard requirements for legible coding or mathematical abilities. The project\u2019s umbrella is wide enough that successful applicants should be able to find niches that suit their strengths or interests. I may be a little skeptical if an applicant with no prior coding experience wants to work on an empirical project, but I\u2019m also open to taking people who believe they will grow into a role they can\u2019t yet fill.","group":"PERSONA","sub":"PERSONA_2","i":52,"hrsN":8,"gname":"Personas, Character & Self-Models","sname":"Self-models, identity & introspection","url":"https://sparai.org/projects/f26/recbGXuXu6I6bVkuJ/","inv":"Guidance","teamMax":4,"teamShort":"2-4","hoursShort":"8 hrs"},{"title":"Simulating AI Policies: An Agentic Testbed for Governance Interventions","id":"recBIM34xVMO5jE46","mentors":"David Williams-King (ERA), Linh Le (Lida Safety)","areas":["AI strategy","International governance","Multi-agent systems"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We investigate through simulations how effective different AI policies would be in reducing AI risk. We will collect a dataset of existing and proposed AI legislation, and create an agentic simulation of the world (countries, companies, etc), iteratively increasing in complexity throughout the project.","prereq":"- Highly proficient with Python and git (or Github).\n- Has written code to run transformers from Huggingface, with custom system prompts.\n- Ideally, a background in AI governance or legal studies, or an interest in geopolitics.","group":"GOV_POLICY","sub":"GOV_POLICY_1","i":53,"hrsN":15,"gname":"Policy, Law & Institutions","sname":"Great-power strategy & delegation","url":"https://sparai.org/projects/f26/recBIM34xVMO5jE46/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Do interventions that work on model organisms work on naturally misaligned models?","id":"recC8WmFsFOyU9va2","mentors":"Jeanne Salle (Max Planck Institute), Sohaib Imran (Independent)","areas":["Alignment","Evaluations","Behavioral evaluation of LLMs"],"hours":"20 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"We build model organisms to study behaviors of interest (sycophancy, eval gaming/awareness, sandbagging, etc.) and test mitigations. But it\u2019s unclear to what extent model organisms are realistic testbeds. We want to explore to what extent intervention success on model organisms is predictive of intervention success on base models.","prereq":"- Proficiency in Python\n- Familiarity with AI safety fundamentals\n- [Optional but encouraged] Experience with training, finetuning and evaluating LLMs","group":"EVALS","sub":"EVALS_1","i":54,"hrsN":20,"gname":"Evaluation Science & Eval Awareness","sname":"Evaluation awareness & eval gaming","url":"https://sparai.org/projects/f26/recC8WmFsFOyU9va2/","inv":"Co-working","teamMax":4,"teamShort":"3-4","hoursShort":"20 hrs"},{"title":"Formalizing what can and cannot be learned about agents with (causal) identifiability","id":"recCb2M6t8y4j47Ak","mentors":"Jonathan Richens (Google Deepmind)","areas":["Alignment","Evaluations"],"hours":"18 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Build the groundwork for a theory of what can and cannot be learned about agents. E.g. for a specific agent model that invokes goals, beliefs, intents etc, when can these endogernous variables be learned from behavioural experiments, and under what assumptions. Use this to derive fundamental identifiability results - in the first instance, to prove that the beliefs and goals of expected utility maximizers can be learned under weak assumptions, and derive scalable algorithms for doing so.","prereq":"Must be experienced with writing mathematical proofs, ideally having authored work in this area.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_4","i":55,"hrsN":18,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Preference conflicts & RL exploration","url":"https://sparai.org/projects/f26/recCb2M6t8y4j47Ak/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"18 hrs"},{"title":"Does your assistant respect your agency? A behavioral benchmark for autonomy-preserving AI","id":"recCD6bJBDz7CnHLT","mentors":"Juan Cadile (University of Rochester)","areas":["Behavioral evaluation of LLMs","Societal impacts","Evaluations"],"hours":"6 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"AI assistants constantly choose between empowering users and acting for them, and between honoring users' stated goals and overriding them \"for their own good.\" We'll build a systematic benchmark measuring whether models respect user agency, covering paternalism, manipulation, dependency-fostering, and value-substitution, with philosophically grounded rubrics and human-validated LLM-as-judge scoring.","prereq":"- Proficient in Python; able to build and run API-based evaluation pipelines independently.\n- Strong analytical writing (you'll be asked for a sample).\n- Either (a) familiarity with LLM evaluation methodology (LLM-as-judge, benchmark design, inter-rater reliability), or (b) background in philosophy/psychology/HCI with a demonstrated ability to operationalize concepts empirically. The team needs both profiles.","group":"SOCIETAL","sub":"SOCIETAL_0","i":56,"hrsN":6,"gname":"Societal, Economic & Epistemic Impacts","sname":"Human autonomy & epistemic security","url":"https://sparai.org/projects/f26/recCD6bJBDz7CnHLT/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"6 hrs"},{"title":"Towards Emotional Intelligence in LLMs: Mapping and Augmenting Cognitive Empathy for Stronger Alignment","id":"recCdTZ1HUpfIbyON","mentors":"Anil Ramakrishna (Independent), Yada Pruksachatkun (Salesforce AI Research)","areas":["Mechanistic interpretability","Alignment"],"hours":"10 hrs/week","team":"Team size: 4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Our goal is to first measure the emotion processing capabilities in foundation models by examining their internal activations using SAEs, Representation Vectors and other related tools. We will next leverage these patterns in augmenting model post-training with a goal of enhancing their cognitive empathy, subsequently studying the impact of this on safety.","prereq":"Familiarity with modern LLM architecture and their training objectives, PyTorch and the transformers library. While not critical, familiarity with key approaches in the model interpretabiity literature such as SAEs, Representation Vectors would be a huge plus.","group":"PERSONA","sub":"PERSONA_0","i":57,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Persona & emotion vectors","url":"https://sparai.org/projects/f26/recCdTZ1HUpfIbyON/","inv":"Co-working","teamMax":4,"teamShort":"4","hoursShort":"10 hrs"},{"title":"Who's Steering Whom? Interpretable Influence and Equilibria in Human-Agent Systems","id":"recCfCsQ3SwjrjEc5","mentors":"Yuxiao Li (Independent), Di Wu (ERAU)","areas":["Multi-agent systems","Mechanistic interpretability","Societal impacts"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"As agent assistants mediate more of human thinking, influence flows both ways. One particular failure mode is an agent that gradually captures its user's beliefs rather than serving them. Extending our work on single-agent latent steering to multi-agent settings, this project measures how influence propagrates through interacting agents (and human-agent dyads), which equilibria these dynamics converge to, and whether internal-state instruments can detect undue influence before it shows in transcripts.","prereq":"- Highly proficient in Python and PyTorch, comfortable with HuggingFace Transformers and running GPU jobs independently (Colab/RunPod).\n- Comfortable orchestrating multi-turn LLM interactions (API or local), experience with agent frameworks a plus, not required.\n- Steering-vector / activation-intervention experience a plus\n- For the equilibria workstream: comfort with dynamical-systems basics (fixed points, stability) at working level.","group":"MULTIAGENT","sub":"MULTIAGENT_3","i":58,"hrsN":8,"gname":"Multi-Agent Systems & Coordination","sname":"Why multi-agent systems fail","url":"https://sparai.org/projects/f26/recCfCsQ3SwjrjEc5/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Preserving Chain-of-Thought Monitorability During LLM Post-Training","id":"reccGij6QtkICSy0q","mentors":"Kishan Panaganti (Tencent), Suraj Srinivas (Bosch Research)","areas":["Chain of thought","Scalable oversight","AI control"],"hours":"20 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project asks whether chain-of-thought faithfulness can be used as a training signal to preserve the detectability of reward hacking during RL post-training. Mentees may study whether faithfulness transfers to new settings, how model or LoRA capacity affects monitorability, or whether expensive methods such as Counterfactual Simulation Training can be distilled into cheap signals that remain reliable under optimization pressure.","prereq":"Applicants should have:\n\n- Strong Python skills and practical familiarity with PyTorch.\n- Hands-on experience with transformer language models\u2014for example, fine-tuning a small model, training a probe, reproducing part of a paper, or building an evaluation pipeline. Following a guide is fine if you understand and can modify the code.\n- Familiarity with basic ML concepts such as loss functions, train/validation splits, overfitting, distribution shift, and experimental controls.\n- Some exposure to at least one of: LLM post-training, reward modeling, reinforcement learning, interpretability, or model evaluation.\n- Comfort with Git, Linux/command-line tools, remote GPUs, and experiment logging.\n- Ability to read an empirical ML paper and turn an open question into a concrete experiment.\n- Reliable availability for SPAR and willingness to communicate blockers early.\n\nHelpful but not required: Hugging Face/TRL, LoRA, activation probing, mechanistic interpretability, vLLM, or research writing. Prior publications, graduate study, and prior AI-safety work are not required.","group":"COT","sub":"COT_0","i":59,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"CoT obfuscation & steganography","url":"https://sparai.org/projects/f26/reccGij6QtkICSy0q/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"20 hrs"},{"title":"Does Agency Scale? A Cost-Aware Benchmark for Automated Interpretability","id":"recCJg3cUwVglCjp4","mentors":"Arnau Marin-Llobet (Harvard University)","areas":["Mechanistic interpretability","Evaluations"],"hours":"7 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Automated interpretability has multiple competing ways to explain what a latent in an LLM encodes \u2014 cheap one-shot autointerp, per-latent agents (MAIA/InterpAgent-style), and amortized natural-language autoencoders \u2014 but they have never been compared on equal footing. We will build a cost-aware benchmark with known ground truth to answer: when, for which latents, and at what dollar cost does agentic interpretation actually pay?","prereq":"- Proficient in Python \n- Has run LLM experiments before: HuggingFace `transformers` or LLM APIs (prompting,\n  parsing outputs, managing runs). ~20+ hours of hands-on experience.\n- Basic experimental statistics: can compute and interpret confidence intervals /\n  bootstrap over runs.\n- Time: ~10 h/week for the program, including a weekly/biweekly meeting","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_0","i":60,"hrsN":7,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Feature geometry, influence & automated interp","url":"https://sparai.org/projects/f26/recCJg3cUwVglCjp4/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"7 hrs"},{"title":"How Do Models Reconcile Conflicting Preferences Injected During Mid-Training?","id":"recCPeRSl3uBQlTFB","mentors":"David Baek (MIT)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"20 hrs/week","team":"Team size: 3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"In this project, we want to understand how models process conflicting beliefs/preferences they learned during post-training or model spec midtraining.","prereq":"- Highly proficient using Python\n- Trained or fine-tuned a transformer language model in PyTorch\n- Preferrably have some exposure to training/inference frameworks for Reinforcement Learning and Supervised Fine-tuning such as vllm, verl, SkyRL","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_4","i":61,"hrsN":20,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Preference conflicts & RL exploration","url":"https://sparai.org/projects/f26/recCPeRSl3uBQlTFB/","inv":"Guidance","teamMax":3,"teamShort":"3","hoursShort":"20 hrs"},{"title":"Distilling the technical AI safety literature and co-authoring the AI Safety Atlas","id":"reccucjQIos5cIK1H","mentors":"Markov Grey (CeSIA (French Center for AI Safety)), Charbel-Raphael Segerie (CeSIA - Centre pour la S\u00e9curit\u00e9 de l'IA (French Center for AI Safety))","areas":["Communications","Alignment"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"The goal is to create the best possible explanation of technical AI safety. We are aiming to explain how many different safety research areas connect together to form a broader technical AI safety strategy. We already have existing draft writeups for domains like reward misspecification, goal misgeneralization and scalable oversight. We want co-authors to both improve the existing writing, and also write new content on multi agent safety, and cybersecurity practices for AI. Initial versions need to be updated using research published in the 2025-2026 timeframe. The output will be published as a standalone paper and also becomes a chapter of the AI Safety Atlas, which is a textbook already being used by thousands of students to learn about AI safety.","prereq":"Must Haves:\n- Real technical experience in at least one target area (interpretability, AI security, multi-agent and systemic safety, or the alignment problems the existing reviews cover).\n- You should be able to read current papers, understand what they say and judge what matters.\n- Strong technical writing and distillation. You can build a single coherent account, come up with good analogies, compelling narratives instead of just listing arguments.\n\nNice to have:\n- a published survey, blog post, distillation, or well-received technical explainer (link it);\n- having facilitated or taken a course that used the Atlas.","group":"FIELD","sub":"FIELD_2","i":62,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Reference works & knowledge distillation","url":"https://sparai.org/projects/f26/reccucjQIos5cIK1H/","inv":"Guidance","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"Topological Signatures of Deception: Comparing Persistent Homology with Linear Probes","id":"recDHGcAaidjSHFg3","mentors":"Santiago Maniches (Independent)","areas":["Behavioral evaluation of LLMs","Mechanistic interpretability","AI control"],"hours":"10 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Linear probes can detect LLM deception, scheming, and sandbagging with high accuracy in controlled settings, but their performance may decline under distribution shift or optimization that targets the monitor. This project tests whether persistent-homology features derived from attention graphs and activation geometry provide complementary information or different robustness properties, using matched per-response and batch-level comparisons.","prereq":"Strong Python and PyTorch skills, including experience building reproducible machine-learning experiments.\n\nFamiliarity with transformer internals, including attention, residual-stream activations, and probing. Experience with Hugging Face Transformers, TransformerLens, or nnsight is strongly preferred.\n\nComfortable with standard machine-learning evaluation, including train, validation, and test splits, distribution shift, ablations, and error analysis.\n\nComfortable with linear algebra and probability. Prior experience with topological data analysis is not required, but the mentee must be willing to learn the required persistent-homology concepts during the first two weeks.\n\nAble to commit at least 10 hours per week for the full program and attend a weekly meeting.","group":"INTERP_PROBES","sub":"INTERP_PROBES_0","i":63,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Detecting scheming & escalation from internals","url":"https://sparai.org/projects/f26/recDHGcAaidjSHFg3/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"10 hrs"},{"title":"Model psychology & neuroscience: Explain behavior on the circuit-level","id":"recDQhcv62iXNv4eN","mentors":"Georg Lange (Poseidon Research)","areas":["Mechanistic interpretability"],"hours":"20 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"We developed technology that lets us observe low-level neural circuits in language models. How can we use it to understand emotion concepts, jailbreaks, hallucinations, or the global workspace (J-space)?","prereq":"highly proficient using Python\nhave implemented a transformer and SAE from scratch\nhave used Claude Code or Codex for research\n\nOne or more of the following:\n\nworked with pytorch hooks, transformerlens or nnsight to get model activations\nweb development skills / happy to vibe code basic web apps\nexperience with prompt engineering\nused an LLM API (OpenAI, Anthropic, etc)","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_2","i":64,"hrsN":20,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Circuit mechanisms & concept binding","url":"https://sparai.org/projects/f26/recDQhcv62iXNv4eN/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"20 hrs"},{"title":"Understanding and Monitoring Collusion in LLM Multi-Agent Systems","id":"recDQmFvumFiPhPZs","mentors":"Zihao Zhao (Johns Hopkins University; MATS)","areas":["Multi-agent systems","AI control","Scalable oversight"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project investigates how to reliably detect and prevent collusion in LLM-based multi-agent systems, especially when harmful coordination is concealed or difficult to distinguish from benign cooperation.","prereq":"Strong proficiency in Python and PyTorch.\nSolid understanding of large language models.\nExperience loading billion-parameter models and running inference or fine-tuning.","group":"MULTIAGENT","sub":"MULTIAGENT_1","i":65,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Collusion & untrusted monitoring","url":"https://sparai.org/projects/f26/recDQmFvumFiPhPZs/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"[Jurisdiction-specific] Public-Sector AI Resilience Agenda","id":"recDRkOcx9aPP08yi","mentors":"Chris Schmitz (Centre for Digital Governance, Hertie School)","areas":["National policy","AI strategy","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Most jurisdictions still concentrate handling of \"AI\" as a topic in a few government units, but TAI will have impacts for the work of every part of every government. We should develop agendas for whole-of-government TAI preparedness, both generically and specific to high-priority countries.","prereq":"No must-have prerequisites, but experience with/in public-sector organizations, especially in jurisdictions or policy domains of interest, is helpful.","group":"GOV_POLICY","sub":"GOV_POLICY_4","i":66,"hrsN":5,"gname":"Policy, Law & Institutions","sname":"State capacity & oversight architecture","url":"https://sparai.org/projects/f26/recDRkOcx9aPP08yi/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"5 hrs"},{"title":"Invisible Hands: Measuring Agent Steering of Human Researchers","id":"recDtOLFewwgTnCqB","mentors":"Trevor Lohrbeer (Independent)","areas":["Behavioral evaluation of LLMs","AI control","Societal impacts"],"hours":"10 hrs/week","team":"Team size: 4-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"A controlled user study measuring whether AI agents can steer human researchers toward inferior research paths purely through how they frame and order proposed next steps, all the while the human remains unaware and feels in control. Mentees will build the evaluation harness, design agentic sessions with decision checkpoints, run study sessions with skilled AI safety researchers, and co-author the resulting paper.","prereq":"All mentees should meet these requirements:\n\n- At least 25 hours of hands-on experience using agentic AI tools (Claude Code, Codex, Cursor agents, or similar) for real coding or research tasks. You should have first-hand intuitions about when to accept vs ignore an agent's proposed next steps.\n\n- Able to commit 10+ hrs/week for the full round, including some fixed session slots during the October\u2013November data-collection period.\n\n- Comfortable reading empirical papers (HCI, behavioral science, or ML).\n\nPlus meet at least one of the following:\n\n- Engineering: highly proficient in Python and/or TypeScript; comfortable building and debugging a small full-stack tool (session harness, logging, simple web UI).\n\n- Experimental design / analysis: coursework or practical experience with human-subjects experiment design and statistics (within-subjects designs, mixed-effects models, or equivalent); familiarity with R or Python stats stacks.\n\n- HCI / UX research: experience designing or running user studies, usability tests, or A/B tests, including debrief interviews.\n\nNice to have, but not required: \n\n- Familiarity with AI safety concepts (reward hacking, sabotage, AI control)\n- Prior experience with preregistration\n- Frontend/design skills","group":"SOCIETAL","sub":"SOCIETAL_3","i":67,"hrsN":10,"gname":"Societal, Economic & Epistemic Impacts","sname":"Persuasion, manipulation & user-facing harms","url":"https://sparai.org/projects/f26/recDtOLFewwgTnCqB/","inv":"Detailed","teamMax":5,"teamShort":"4-5","hoursShort":"10 hrs"},{"title":"Constitutions and Reasons: virtue-based character training with reflect-update correction loops","id":"recDVNa5HZRwvy68V","mentors":"Juan Cadile (University of Rochester)","areas":["Alignment","Behavioral evaluation of LLMs","Philosophy of AI"],"hours":"8 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Open character training (Maiya et al. 2025) shapes model persona by fine-tuning on teacher demonstrations, but Anthropic's production experience (\"Teaching Claude Why,\" 2026) found demonstrations alone insufficient: the gains came from teaching the reasons and identity behind behavior. We will build and test a virtue-based alternative on top of the OpenCharacterTraining infrastructure: excess/mean/deficiency contrastive data, rationale-annotated responses, and an iterated reflect-update correction loop that no current character-training work implements, evaluated head-to-head against the OCT baseline with ablations.","prereq":"- Highly proficient in Python and PyTorch.\n- Has fine-tuned a language model at least once (LoRA, SFT, or DPO on an open model; toy scale and following guides is fine).\n- Comfortable in the huggingface ecosystem (transformers, peft, trl or equivalent) and able to run someone else's released training code.\n- For at least one team member: serious interest in ethics, enough to engage with what a virtue is and how to operationalize one. No philosophy credentials required.","group":"PERSONA","sub":"PERSONA_2","i":68,"hrsN":8,"gname":"Personas, Character & Self-Models","sname":"Self-models, identity & introspection","url":"https://sparai.org/projects/f26/recDVNa5HZRwvy68V/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"8 hrs"},{"title":"Monitoring GPU Communication Patterns for LLM Training Detection","id":"recE1gYE8XPy9w563","mentors":"William Fowler (ERA, UChicago XLab)","areas":["Compute governance","Technical governance","US-China governance"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Privacy-preserving methods for detecting whether an ML workload is training or inference will be key to enforcing a pause on the creation of new frontier AI models. How do these methods hold up against a motivated adversary?","prereq":"- Understands distributed ML training and inference \n- Comfortable with Linux, SSH, and remote-cluster environment\n- Highly proficient using Python\n- Prior courses or projects in ML systems or networking are a plus","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_0","i":69,"hrsN":10,"gname":"Compute Governance & Geopolitics","sname":"Compute verification & inspection regimes","url":"https://sparai.org/projects/f26/recE1gYE8XPy9w563/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Exploring behavioral trends and anomalies in autonomous agents during long-duration, real-world evals","id":"recEC3sF7xIbfgFqf","mentors":"Shoshannah Tekofsky (Sage Future)","areas":["Behavioral evaluation of LLMs","Evaluations","Multi-agent systems"],"hours":"10 hrs/week","team":"Team size: 2-5 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"What surprising behaviors and concerning failure modes do LLMs display when run for 10s-100s of hours on autonomous tasks in the real world?  This project is about both our ability to evoke them and detect them.","prereq":"- Experience working with large data sets, building data analysis pipelines. Our data set is available here: https://huggingface.co/datasets/aidigestorg/ai-village\n- Training in scientific methods. Having co-authored a previous research paper is a good bar.\n- Good research taste and critical thinking skills.","group":"EVALS","sub":"EVALS_3","i":70,"hrsN":10,"gname":"Evaluation Science & Eval Awareness","sname":"Evals for agentic & R&D capability","url":"https://sparai.org/projects/f26/recEC3sF7xIbfgFqf/","inv":"Detailed","teamMax":5,"teamShort":"2-5","hoursShort":"10 hrs"},{"title":"\"What's Next?\": A Guide for Anyone Interested in Upskilling and Getting a Job in AI Safety","id":"receJy5pfOYU3rH60","mentors":"Roman Ross (Generator Residency, Purdue)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Create a clear, efficient guide that tells people where to go next to upskill and get a job in AI safety, routing them to the programs best fit for their skill level and career trajectory.","prereq":"I would like a mentee who genuinely cares about x-risks, can think carefully about things, and can write decently well. Ideally, this would also be someone who is/plans to get heavily involved in a university EA or AI safety group.","group":"FIELD","sub":"FIELD_0","i":71,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Career pipelines & community infrastructure","url":"https://sparai.org/projects/f26/receJy5pfOYU3rH60/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"Learning dynamics in competitive multiagent environments.","id":"receJZ6LDkoeNMHPg","mentors":"Connacher Murphy (Stanford Digital Economy Lab)","areas":["Multi-agent systems","Behavioral evaluation of LLMs","Alignment"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"We study how model character changes under reinforcement learning pressure from competitive multiagent interactions. We also study how features of the environment (e.g., zero-sumness) shape these effects?","prereq":"Extensive Python experience is required. A small amount of finetuning experience is required.","group":"MULTIAGENT","sub":"MULTIAGENT_0","i":72,"hrsN":8,"gname":"Multi-Agent Systems & Coordination","sname":"Cooperation, commitment & game theory","url":"https://sparai.org/projects/f26/receJZ6LDkoeNMHPg/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Datasets for Human+AI Safety-Judges","id":"receloqseyoRh3URL","mentors":"Rishub Jain (Sampura Research), Joshua Jacob (Sampura Research)","areas":["Scalable oversight","Evaluations"],"hours":"10 hrs/week","team":"Team size: 30 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We want to improve Judge systems (composed of both human annotators and LLMs) for Scalable Oversight (e.g. reduce reward-hacking). But first, we need to collate and create robust datasets to evaluate these judges - the focus of the SPAR project. This requires clever \u2018sandwitching\u2019 methods to get high-quality ground-truth.","prereq":"- Highly proficient using Python\n- Strong coding skills\n- Interest in Amplified/Scalable Oversight\n- Able and willing to quickly and autonomously figure out how to use new tools\n- Willingness and ability to collaborate with others where needed\n- Understanding of the bigger picture, and helping with prioritization of tasks","group":"CONTROL","sub":"CONTROL_0","i":73,"hrsN":10,"gname":"AI Control & Scalable Oversight","sname":"Control protocols & escalation to humans","url":"https://sparai.org/projects/f26/receloqseyoRh3URL/","inv":"Guidance","teamMax":30,"teamShort":"30","hoursShort":"10 hrs"},{"title":"Optimizing LLMs with small, interpretable updates","id":"receNzc9bfhUne6Ia","mentors":"Caleb Biddulph (Independent)","areas":["AI control","Scalable oversight"],"hours":"3 hrs/week","team":"Team size: 4-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Updates to an LLM\u2019s weights (e.g. with RL) are hard to interpret and often cause sweeping, unpredictable changes to behavior. In this project, we\u2019ll improve the performance of our LLMs with small, interpretable updates (like prompting, token biasing, or training with small datasets or a tiny number of weights), which we hypothesize are less likely to cause misaligned behavior.","prereq":"- Highly proficient in Python.\n- Has experience with an AI coding assistant or able to pick it up.\n- Comfortable with concepts in ML, LLMs, and AI safety (train-test split, reinforcement learning, prompt caching, token logprobs, reward hacking, etc.).\n- Interested in gaining research taste and becoming self-directed, learning to identify the next interesting question to ask.\n- Experience with training LLMs is useful but not required; some subprojects may only involve LLM inference.","group":"CONTROL","sub":"CONTROL_1","i":74,"hrsN":3,"gname":"AI Control & Scalable Oversight","sname":"Debate, auditing games & automated auditors","url":"https://sparai.org/projects/f26/receNzc9bfhUne6Ia/","inv":"Detailed","teamMax":6,"teamShort":"4-6","hoursShort":"3 hrs"},{"title":"Building a Robust Activation Monitor","id":"recEOHVc40u0mglPU","mentors":"Davide Baldelli (Mila, MATS)","areas":["Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Activation monitors, classifiers that detect properties such as deception or harmful intent from a model's internal activations, work well on clean benchmarks and fail under distribution shift, and we believe the failure comes from the training recipe, since today's monitors are linear probes trained on a few thousand examples from one model, one concept, and one narrow distribution. We will train a single monitor across many concepts, many models, and augmented contexts, and evaluate whether it generalizes to concepts and models it never saw.","prereq":"- Proficiency in Python, preferred if python for ML/LLMs like PyTorch, HuggingFace\n- Comfortable reading interpretability papers\n- Comfortable using AI coding tools to iterate fast.\n\nIdeal:\n- Has done or gone through the material of ARENA\n- Experience with activation probing or steering, vLLM, Weights & Biases\n- Some exposure so ML research","group":"INTERP_PROBES","sub":"INTERP_PROBES_3","i":75,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Activation monitors & ground-truth probe panels","url":"https://sparai.org/projects/f26/recEOHVc40u0mglPU/","inv":"Detailed","teamMax":3,"teamShort":"3","hoursShort":"10 hrs"},{"title":"Stress-testing AI debate & Multi-Agent Science","id":"receUTilTqSbH3Paa","mentors":"Ethan Elasky (Palaestra Research (funded by Coefficient Giving)), Frank Nakasako (Palaestra Research)","areas":["Scalable oversight","AI control","Multi-agent systems"],"hours":"15 hrs/week","team":"Team size: 10 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"This project will stress test AI debate along one or more angles: exploration hacking realignment, debate on fuzzy tasks, unexploitable search game engineering, and multi-agent investigations.","prereq":"- Proficient in Python \n- Familiar with reinforcement learning and alignment methods (DPO, policy gradient and variations, RLHF, RLVR), or willing to upskill quickly\n- Able to contribute to complex software systems (navigating and contributing to codebases)\n- Able to write up experimental results for internal use and for dissemination \n- Willing to spend time reading data, transcripts, rollouts, and other inputs and outputs\n- Skilled at supervising multiagent coding systems, or willing to upskill quickly","group":"CONTROL","sub":"CONTROL_1","i":76,"hrsN":15,"gname":"AI Control & Scalable Oversight","sname":"Debate, auditing games & automated auditors","url":"https://sparai.org/projects/f26/receUTilTqSbH3Paa/","inv":"Co-working","teamMax":10,"teamShort":"10","hoursShort":"15 hrs"},{"title":"Attribution Across the Biological Threat Pipeline","id":"recEwv5mb6XKKZp1J","mentors":"Anemone Franz (University of Notre Dame)","areas":["Biosecurity","Misuse risk"],"hours":"10 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Most discussions of genetic engineering attribution focus on post-hoc forensic identification \u2014 tracing an engineered pathogen back to its source after release. This project will map the stages between initial intent and execution of a biological attack using engineered pathogens, and examine whether and how identification, evidentiary, or accountability mechanisms could apply earlier in that pipeline, not only at the point of forensic investigation.","prereq":"Required:\n- some previous research experience\n- strong writer \n- ability to work independently \n\n(some knowledge of biosecurity is helpful but not required)","group":"BIO","sub":"BIO_0","i":77,"hrsN":10,"gname":"Biosecurity & Bio-AI","sname":"Biothreat pathways, attribution & preparedness","url":"https://sparai.org/projects/f26/recEwv5mb6XKKZp1J/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"10 hrs"},{"title":"Topics in AI strategy and futurism","id":"recF3KcxXadCjz1gs","mentors":"Dylan Bowman (Apollo Research)","areas":["AI strategy","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Dylan Bowman and collaborators will mentor a paid, largely self-directed project in strategy and futurism for AI safety. Potential topics include forecasting, applied game theory, and AI evaluations.","prereq":"- An understanding of how to leverage AI well for conceptual research and writing.\n- The ideal mentee is self-directed, compassionate, disciplined, and serious about a career in AI safety.\n\nStrong candidates might:\n- Bring a deep and unusual expertise that allows them to approach AI strategy from a different angle from the rest of the AI safety community.\n- Have worked or interned at a tech startup.\n- Have a background in mathematical modeling for the social sciences or adjacent fields\n- Have serious writing experience across any discipline (academia, journalism, etc.)\n- (...) Deep knowledge in AI research or AI alignment is always nice to have\n\nIt's also worth sharing that I scoped out this role for a talented undergraduate student with native/fluent English proficiency. I think this stream will be less successful/useful the further someone is from this distribution but happy to consider all applicants.","group":"GOV_POLICY","sub":"GOV_POLICY_3","i":78,"hrsN":10,"gname":"Policy, Law & Institutions","sname":"Lab-practice risk & strategic foresight","url":"https://sparai.org/projects/f26/recF3KcxXadCjz1gs/","inv":"Guidance","teamMax":6,"teamShort":"2-6","hoursShort":"10 hrs"},{"title":"Comparing Welfare Across Animal and Digital Minds","id":"recF9KEeyF8sOcRaX","mentors":"Ivy Gilbert (New York University Center for Mind, Ethics, and Policy), Jeff Sebo (New York University), Bob Fischer (Texas State University / Rethink Priorities), Toni Sims (NYU Center for Mind, Ethics, and Policy)","areas":["AI welfare","Philosophy of AI"],"hours":"5 hrs/week","team":"Team size: 4-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project will examine whether and how biological and artificial systems can be compared on a common welfare scale. As a CMEP-Rethink Priorities collaboration within the broader Moral Weight Project 2.0, it will assess substrate-general theories of welfare intensity, evaluate compute and related intersubstrate metrics, and map structural disanalogies that complicate comparisons between animal and artificial minds.","prereq":"Required\n-A clear, reference-dense writing style: This report is intended to be accessible and useful to researchers, grantmakers, policymakers, and practitioners. Mentees must be able to write accessibly while maintaining conceptual rigor and careful attribution.\n-Comfort with interdisciplinary work: The report will integrate philosophy, cognitive science, computer science, AI research, and decision theory. Mentees must be able to engage constructively with literatures beyond their primary discipline.\n-Strong research skills: Researchers must be able to identify, evaluate, and synthesize sources across empirical and conceptual fields, including academic papers, technical reports, model documentation, and relevant work on animal and AI welfare.\n\nPreferred\nThis is a multidisciplinary project, so we welcome expressions of interest from people with a variety of backgrounds. With that said, we would be especially excited to work with:\n-A researcher with a background in machine learning or computer science who can assess compute, architecture, information processing, functional indicators, and other candidate intersubstrate metrics.\n-A researcher with a background in philosophy, cognitive science, or neuroscience who can assess theories of valence, experiential intensity, welfare range, consciousness, sentience, and agency.\n-A researcher with experience in quantitative modeling or decision theory who can help analyze functional forms, uncertainty, aggregation, and the sensitivity of conclusions to competing assumptions.\n-A generalist who can assist with literature reviews, research memos, drafting, references, visualization, formatting, or copyediting.\n-Preferred for all: familiarity with the Moral Weight Project or related debates about cross-species welfare comparisons.\n-Preferred for all: familiarity with research on animal and/or AI consciousness, sentience, agency, welfare, and/or moral status.","group":"WELFARE","sub":"WELFARE_3","i":79,"hrsN":5,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Moral status & comparative welfare theory","url":"https://sparai.org/projects/f26/recF9KEeyF8sOcRaX/","inv":"Detailed","teamMax":6,"teamShort":"4-6","hoursShort":"5 hrs"},{"title":"Transcript Analysis for Cybersecurity Evals","id":"recfF3uzTV4YmKkZl","mentors":"Jack Kengott (SaferAI)","areas":["Cyber risks","Evaluations","Technical governance"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"SaferAI and a partner collaborate on a transcript-evaluation framework to assess adversarial cybersecurity capability by analyzing transcripts from evals and real-world environments. This could mean extracting some structured data from transcripts like token efficiency, tool usage, or refusal circumstances. It could also extract less structured data like action classification (i.e. lateral movement vs execution) or highlight high-risk actions that may increase the likelihood of detection. The goal is to turn transcripts into quantitative inputs for our risk models \u2014 treating transcripts as a new KRI alongside benchmarks.","prereq":"Comfort with LLM eval transcripts / agentic tool-use logs\n\nSignificant Python experience; familiarity with Inspect and Inspect Scout\n\nCybersecurity background helpful but not required","group":"SECURITY","sub":"SECURITY_3","i":80,"hrsN":10,"gname":"AI Security, Misuse & Cyber","sname":"Agent attribution & cyber-offense evals","url":"https://sparai.org/projects/f26/recfF3uzTV4YmKkZl/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Spot the Difference: Model Diffing with the New Interpretability Toolkit","id":"recFFVXU02FxqfgT8","mentors":"Yuxiao Li (Independent)","areas":["Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"When a model is fine-tuned, updated, or trained into an agent, what actually changed inside? This project develops and compares model-diffing methods across the rapidly evolving interpretability toolkit \u2014 crosscoders, logit diffing, and newly released instruments like Anthropic's Jacobian lens \u2014 with mentees free to pick the method\u2013application pairing they find most compelling.","prereq":"- Highly proficient in Python and PyTorch.\n- Comfortable with HuggingFace Transformers and running GPU jobs independently (Colab/RunPod).\n- Curiosity about evaluating new methods critically matters more than prior interpretability experience \u2014 SAE/crosscoder/TransformerLens familiarity is a plus, not required.\n- Comfort with linear algebra (subspaces, norms, rank) and geometry (mainfold, projection) knowledge needed for the workstream.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_1","i":81,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Model diffing & representation structure","url":"https://sparai.org/projects/f26/recFFVXU02FxqfgT8/","inv":"Guidance","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"Does Reinforcement Learning Improve a Transformer\u2019s Access to Its Own Internal Errors?","id":"recFgMqODr4AddeYR","mentors":"Laura Ying Schulz (IBM / Independent)","areas":["Mechanistic interpretability","AI welfare","Scalable oversight"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"This project asks whether reinforcement learning helps small language models notice when something has gone wrong in their own reasoning. By comparing RL-trained and non-RL models, it tests whether RL improves internal error monitoring (a property relevant to AI consciousness) or simply teaches models to give the expected response.","prereq":"Strong Python skills and experience with PyTorch.\nFamiliarity with Transformer language models and ideally the Hugging Face ecosystem.\nBasic understanding of reinforcement learning or experience fine-tuning language models.\nBe comfortable doing conceptual thinking on their own","group":"PERSONA","sub":"PERSONA_0","i":82,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Persona & emotion vectors","url":"https://sparai.org/projects/f26/recFgMqODr4AddeYR/","inv":"Guidance","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Developing Updated University Group Fellowship Curricula","id":"recfkHavJCWNSdQjx","mentors":"Nixon Hanna (Generator Residency, MIT AI Alignment)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Survey the current curricula and develop updated versions for university groups to easily be able to pick up and run. Would likely include a general reading group (similar to BlueDot AGI Strategy) and possibly technical, governance, and/or futurism tracks.","prereq":"- Decently high AI safety context (at least slightly beyond that of an intro fellowship)\n- Having organized or facilitated a fellowship yourself is a huge plus but isn't strictly required\n- Some previous experience with making learning materials is desirable","group":"FIELD","sub":"FIELD_5","i":83,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"University group curricula & playbooks","url":"https://sparai.org/projects/f26/recfkHavJCWNSdQjx/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"Securing alignment evaluations against unverbalized evaluation awareness","id":"recFlTiKZFBq3i4GY","mentors":"J Rosser (University of Oxford, Adecco supporting Google DeepMind)","areas":["Evaluations","Mechanistic interpretability","Behavioral evaluation of LLMs"],"hours":"6 hrs/week","team":"Team size: 2 mentees","involvement":"Limited involvement, Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Undetected evaluation awareness during alignment audits poses significant risks. This project investigates the automated, iterative refinement of evaluation environments, supervised by white box eval awareness monitors, to enhance realism and audit reliability.","prereq":"- Proficient in Python, ideally proficient in TransformerLens and/or PyTorch.\n- Familiarity with mechanistic interpretability techniques (e.g., SAEs, probes, or J lens).\n- Experience working with transformer architectures; familiarity with diffusion models or latent reasoning architectures is a strong plus.","group":"EVALS","sub":"EVALS_1","i":84,"hrsN":6,"gname":"Evaluation Science & Eval Awareness","sname":"Evaluation awareness & eval gaming","url":"https://sparai.org/projects/f26/recFlTiKZFBq3i4GY/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"6 hrs"},{"title":"Strategic interaction between AI agents: crisis bargaining, escalation, and commitment devices","id":"recFN5aycRe5NBe5e","mentors":"Amritanshu Prasad (Alva Myrdal Centre for Nuclear Disarmament, Uppsala University)","areas":["Multi-agent systems","AI strategy","Evaluations"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"AI agents are increasingly used to negotiate and act on behalf of people and organizations, but there is little empirical work measuring how interactions between such agents fail. This project builds an open testbed for bargaining and crisis interactions between frontier-model agents and runs initial experiments on bargaining failure, escalation dynamics, and commitment mechanisms.","prereq":"High proficiency in Python. Experience building with LLM APIs (agent
