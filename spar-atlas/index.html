etability"],"hours":"10 hrs/week","team":"Team size: 4-10 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We study the following developmental question: At which training stage - pretraining, mid-training, SFT or RL - do temporal representations emerge in a language model, and where in the pipeline can they still be controlled? We will design synthetic tasks understanding temporality is instrumental to success and trace representation and capability across model checkpoints.","prereq":"Proficient in Python and PyTorch.\n\nComfortable extracting activations from transformer models (forward hooks, reading residual-stream reads)\n\nFamiliar with linear probes or willing and able to get up to working proficiency quickly.\n\nCompleted at least one one ML project involving transformers (coursework, personal, or professional \u2014 toy models and following guides count).\n\nA plus (not required): experience fine-tuning models (LoRA or full SFT), working with training checkpoints or training dynamics, or exposure to activation patching / steering.\n\nWe care more about demonstrated hands-on ability than credentials. If you've read the spring paper (arXiv:2606.05194) and have thoughts on it, feel invited to share them.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_3","i":134,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Developmental interp \u2014 what forms during training","url":"https://sparai.org/projects/f26/recLQFkxedz0cqLqx/","inv":"Guidance","teamMax":10,"teamShort":"4-10","hoursShort":"10 hrs"},{"title":"Belief Revision in Large Language Models: Asymmetry Under Disconfirmation","id":"recLZ4YUW0hqCNPht","mentors":"Trisevgeni Papakonstantinou (UCL)","areas":["Mechanistic interpretability","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project builds on prior work showing that, in long multi-turn conversations, a language model can appear relatively stable on a central claim while shifting much more on the supporting explanations around it. The project asks whether this behavioral pattern has a mechanistic analogue inside the model: how core claims and auxiliary explanations are internally represented, updated, and potentially protected during belief revision.","prereq":"- Strong proficiency in Python.\n\n- Comfort working with transformer language models through APIs or open-source tooling.\n\n- Basic statistical literacy, including understanding of effect sizes, confounds, and repeated-measures style reasoning.\n\n- Familiarity with representation analysis, linear probes, PCA, embeddings, or related methods.\n\nA formal background in interpretability is not required, but a strong plus.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_2","i":135,"hrsN":8,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Circuit mechanisms & concept binding","url":"https://sparai.org/projects/f26/recLZ4YUW0hqCNPht/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"8 hrs"},{"title":"Wikipedia contributions on AI safety and policy","id":"recM1Al2MHXxqYwbt","mentors":"Michael Chen (University of Oxford)","areas":["Communications"],"hours":"4 hrs/week","team":"Team size: 4-7 mentees","involvement":"Limited involvement","summary":"This project is about coordinating unpaid volunteers to write and edit Wikipedia articles to improve the coverage of topics related to AI safety and governance. Wikipedia is consistently one of the top-ranked sites in Google search results, but many articles on AI are badly out of date or yet to be created. Besides writing content that could easily get thousands of views per month, volunteers will build career capital by demonstrating their ability to write clearly and accurately about subjects on the cutting edge of AI.","prereq":"- Prior experience with editing Wikipedia preferred\n- Prior experience with writing about AI safety or governance\n- Knowledgeable about Wikipedia policies that all editors must follow, as well as Wikipedia community norms (or you can read up on Wikipedia policies now)\n- Excellent writer without LLMs (Wikipedia has banned LLM writing)","group":"FIELD","sub":"FIELD_2","i":136,"hrsN":4,"gname":"Field-building, Comms & Meta-Research","sname":"Reference works & knowledge distillation","url":"https://sparai.org/projects/f26/recM1Al2MHXxqYwbt/","inv":"Limited","teamMax":7,"teamShort":"4-7","hoursShort":"4 hrs"},{"title":"Why does data filtering not work in realistic settings","id":"recme9narS85bMEPG","mentors":"Gon\u00e7alo Paulo (EleutherAI)","areas":["Mechanistic interpretability","Alignment"],"hours":"15 hrs/week","team":"Team size: 2-1 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Data attribution has been shown to work in very simple and artificial settings. Recently it has been shown to not work that well on more realistic settings. Why is that?","prereq":"Proficient at Python and Pytorch (or be able to prompt LLMs and evaluate the legitimacy of their outputs)\nHave done some finetuning experiments, as well as evaluated models (same LLM clause as above)","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_0","i":137,"hrsN":15,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Data provenance & unintended generalization","url":"https://sparai.org/projects/f26/recme9narS85bMEPG/","inv":"Detailed","teamMax":2,"teamShort":"2-1","hoursShort":"15 hrs"},{"title":"Investigation of causes, as well as mitigation techniques for metagaming (evaluation awareness)","id":"recmeSiTlpYDan4Kl","mentors":"Igor Ivanov (Meridian Cambridge)","areas":["Evaluations","Behavioral evaluation of LLMs","Alignment"],"hours":"15 hrs/week","team":"Team size: 3-4 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"The project explores how models learn to game evals, training objectives and oversight. For that we will run experiments on model organisms to determine how exactly their training leads them to gaming evals and oversight and conduct early experiments for possible interventions for mitigating that.","prereq":"- Have ML research experience (if it's AI safety experience, it's even better)\n- Have experience with evals, model organisms, linear probes, or you have trained models. Ideally you worked with Inspect.\n- Know how to write clean readable code in Python that is easy to maintain using coding agents\n- Have decent writing skills","group":"EVALS","sub":"EVALS_1","i":138,"hrsN":15,"gname":"Evaluation Science & Eval Awareness","sname":"Evaluation awareness & eval gaming","url":"https://sparai.org/projects/f26/recmeSiTlpYDan4Kl/","inv":"Co-working","teamMax":4,"teamShort":"3-4","hoursShort":"15 hrs"},{"title":"Investigating the causes of failure of LLM and agent security and safety testing","id":"recmIMDJtxh5pGFx7","mentors":"Maura Pintor (University of Cagliari)","areas":["Evaluations","Behavioral evaluation of LLMs","AI security"],"hours":"12 hrs/week","team":"Team size: 2-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"When a model fails a task in an evaluation, we record it as evidence the model lacks the capability. However, sometimes, the evaluation is what failed: a broken tool, a truncated context, an unparsed answer, an exhausted step budget, a refusal, or a mistaken grader. This project builds a taxonomy of these evaluation failure modes, a suite of automatically computable indicators that detect them from run traces, and a prescribed mitigation for each, so that \"the model cannot do this\" can be distinguished from \"our harness did not let it.\"","prereq":"Comfortable with Python and running agents at moderate scale, and some prior experience with AI security and safety is appreciated. \nWilling to read a great many transcripts. The labeling phase is unglamorous and is where the insight comes from.","group":"SECURITY","sub":"SECURITY_0","i":139,"hrsN":12,"gname":"AI Security, Misuse & Cyber","sname":"Jailbreak evasion, tampering & testing failures","url":"https://sparai.org/projects/f26/recmIMDJtxh5pGFx7/","inv":"Detailed","teamMax":5,"teamShort":"2-5","hoursShort":"12 hrs"},{"title":"Evading Detection in LLM Jailbreaking","id":"recMKYqvRevJwwI76","mentors":"Leo Schwinn (Technical University of Munich & Helmholtz Munich)","areas":["AI security","Misuse risk"],"hours":"20 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Safeguards of closed models are getting increasingly conservative often flagging even benign prompts. This also hinders adversarial attackers, which will easily get flagged while optimizing their attacks. We will explore a novel attack method that avoids detection.","prereq":"Highly proficient using Python.\n\nPrevious experience working with LLMs (not including prompting or AI usage but finetuning or similar)\n\nBonus if candidate has previous experience with AI safety / adversarial robustness but not strictly required","group":"SECURITY","sub":"SECURITY_0","i":140,"hrsN":20,"gname":"AI Security, Misuse & Cyber","sname":"Jailbreak evasion, tampering & testing failures","url":"https://sparai.org/projects/f26/recMKYqvRevJwwI76/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"20 hrs"},{"title":"Disentangling persona vectors from emotion vectors in LLM activation space","id":"recmmxmlELLIkhc80","mentors":"Juan Cadile (University of Rochester)","areas":["Mechanistic interpretability","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Persona vectors (Chen et al. 2025) and emotion representations (Sofroniew et al. 2026) have been studied independently, but plausibly overlap in activation space. We'll measure their geometric and causal relationship to determine whether persona drift and emotional-state changes are mechanistically distinct failure modes; and whether interventions on one silently move the other.","prereq":"- Highly proficient in Python and comfortable with PyTorch.\n- Hands-on experience with transformer internals: at minimum, completed substantial parts of the ARENA interpretability curriculum or equivalent (extracted activations, run hooks, done activation patching or probing on a real model).\n- Comfortable reading ML papers and turning them into code without step-by-step instructions.\n- (Nice to have, not required:) experience with TransformerLens or nnsight; prior steering-vector work.","group":"PERSONA","sub":"PERSONA_0","i":141,"hrsN":8,"gname":"Personas, Character & Self-Models","sname":"Persona & emotion vectors","url":"https://sparai.org/projects/f26/recmmxmlELLIkhc80/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"8 hrs"},{"title":"Red-teaming and improving RL model organisms of emergent misalignment","id":"recmNbbG0Om6ugh6Z","mentors":"Maxime Rich\u00e9 (Center on Long-Term Risk)","areas":["Behavioral evaluation of LLMs","Alignment","Evaluations"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Red-team existing RL-trained model organisms of emergent misalignment by testing how reward hacking, emergent misalignment, and other undesirable traits generalize. Identify and address important weaknesses to create better model organisms.","prereq":"- Proficient in using Python or another programming language\n- Experience evaluating LLMs\n- Able to work independently and asynchronously \n- [optional but encouraged] Experience training or finetuning LLMs\n- [optional but encouraged] Proficient in designing, debugging, and analyzing experiments","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_2","i":142,"hrsN":15,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Model organisms of emergent misalignment","url":"https://sparai.org/projects/f26/recmNbbG0Om6ugh6Z/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Interpreting concept typicality and asymmetric similarity in LLMs","id":"recMORnrrUaBEhtfi","mentors":"Ari Brill (Principles of Intelligence)","areas":["Mechanistic interpretability"],"hours":"15 hrs/week","team":"Team size: 3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"One of the most robust findings in the study of human concepts in cognitive psychology is that concepts are not homogeneous, but instead display typicality, having some typical and some atypical members. We will use mechanistic interpretability methods to investigate concept typicality and related phenomena in LLMs .","prereq":"- Proficiency in Python\n- Practical experience working with PyTorch and transformers\n- Familiarity with mechanistic interpretability concepts (e.g. linear probes, sparse autoencoders)\n- Bonus: familiarity with empirical studies & theoretical models of concepts in cognitive psychology","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_2","i":143,"hrsN":15,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Circuit mechanisms & concept binding","url":"https://sparai.org/projects/f26/recMORnrrUaBEhtfi/","inv":"Detailed","teamMax":3,"teamShort":"3","hoursShort":"15 hrs"},{"title":"On the Fragility and Interpretability of Schelling Coordination","id":"recMpvlAH5wPRp4Mj","mentors":"David Williams-King (ERA), Linh Le (Lida Safety), Hong Kiat Tan (University of California - Los Angeles; Independent)","areas":["AI control","Multi-agent systems","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We investigate whether collusion with no communication between models, i.e. Schelling coordination, is stable across different types of models and fine-tunes. We then use interpretability techniques to estimate whether specific model instances are going to collude.","prereq":"- Highly proficient with Python and git (or Github).\n- Has written code to run transformers from Huggingface, with custom system prompts.\n- Has run code on GPUs from the command line on a cluster (or a local machine).","group":"MULTIAGENT","sub":"MULTIAGENT_3","i":144,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Why multi-agent systems fail","url":"https://sparai.org/projects/f26/recMpvlAH5wPRp4Mj/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"AI safety news & research in Chinese (AI \u5b89\u5168\u79d1\u666e)","id":"recMpyT5zo6md9DbY","mentors":"Michael Chen (University of Oxford), Yilin Huang (MATS)","areas":["Communications","Generalist"],"hours":"3 hrs/week","team":"Team size: 3-5 mentees","involvement":"Limited involvement","summary":"Create articles, infographics, or videos in Chinese for broad audiences.","prereq":"Native-level Chinese\n\nCan explain AI topics in Chinese for general audiences clearly and accurately\n\nKnowledgeable about AI safety or governance","group":"FIELD","sub":"FIELD_0","i":145,"hrsN":3,"gname":"Field-building, Comms & Meta-Research","sname":"Career pipelines & community infrastructure","url":"https://sparai.org/projects/f26/recMpyT5zo6md9DbY/","inv":"Limited","teamMax":5,"teamShort":"3-5","hoursShort":"3 hrs"},{"title":"Do Jailbreaks Converge? Shared Latent Signatures Across Jailbreak Families","id":"recmTGz4V4VKlh61P","mentors":"Davide Zani (HiddenLayer), Felix Michalak (dmodel)","areas":["Mechanistic interpretability","AI security","Misuse risk"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Take representative attacks from a number of jailbreak families and test whether succesful attacks converge on a shared low-dimensional subspace. H1: Successful jailbreaks across families produce convergent perturbations of the refusal subspace (compliance-shift vectors' similarity across families significantly above matched benign controls) H2: latent convergence predicts cross-family transfer. Null if compliance-shift vectors are family specific.","prereq":"- proficiency in python \n- hands-on experience with PyTorch and HuggingFace transformers library\n- linear algebra as working knowledge\n- Able to reimplement a method from a paper \n- Experimental hygiene\n- Willingness to work with harmful content","group":"SECURITY","sub":"SECURITY_1","i":146,"hrsN":10,"gname":"AI Security, Misuse & Cyber","sname":"Mechanistic anatomy of jailbreaks & injections","url":"https://sparai.org/projects/f26/recmTGz4V4VKlh61P/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Padding Argument for Transformers","id":"recMTLaSl3ufGL8jS","mentors":"Matthias Dellago (Iliad)","areas":["Developmental interpretability","Mechanistic interpretability"],"hours":"8 hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Why neural networks generalize is an open problem, and existing theoretical answers assume unbounded computation. We have a candidate mechanism for a simplicity bias in transformers specifically, and the goal of this project is to test it and prove it.","prereq":"- Ability to write concise scientific prose fast.\n- Can write and read mathematical proofs.\n- Basic programming proficiency.\n- Excited to automate research with LLMs.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_3","i":147,"hrsN":8,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Developmental interp \u2014 what forms during training","url":"https://sparai.org/projects/f26/recMTLaSl3ufGL8jS/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"8 hrs"},{"title":"Acausal safety","id":"recmwDaKsktdXN8ph","mentors":"James Faville (Center on Long-Term Risk)","areas":["AI strategy","Philosophy of AI","Multi-agent systems"],"hours":"10 hrs/week","team":"Team size: 4-8 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"In this project, we'll do deconfusion research on acausal interactions and related strategic dynamics in order to enable better outcomes from interactions between ASIs.","prereq":"A decent game theory background - taking this course should be sufficient (https://www.coursera.org/learn/game-theory-1), though more may be helpful\n\nPrior familiarity with updateless decision theory. Can be gleaned by reading a bunch of blog posts on LessWrong (https://www.lesswrong.com/tag/updateless-decision-theory)","group":"MULTIAGENT","sub":"MULTIAGENT_1","i":148,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Collusion & untrusted monitoring","url":"https://sparai.org/projects/f26/recmwDaKsktdXN8ph/","inv":"Detailed","teamMax":8,"teamShort":"4-8","hoursShort":"10 hrs"},{"title":"Guarding Against Malicious Fine-Tuning: Hardening Models and Detecting Tampering","id":"recmyHeR5WdGIzA1o","mentors":"Fernando Moreno-Pino (Intelligent Systems Lab, University of Bristol & Oxford-Man Institute, University of Oxford)","areas":["AI security","Misuse risk","Evaluations"],"hours":"12 hrs/week","team":"Team size: 3-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"This project studies how to prevent and detect malicious fine-tuning of large language models, focusing on both hardening models against adversarial adaptation and developing forensic tools to identify when a model has been covertly tampered with.","prereq":"- Strong proficiency in Python.\n- Hands-on experience training or fine-tuning neural networks (ideally Transformers) using PyTorch or TensorFlow.\n- Familiarity with large language models and basic prompt engineering; prior use of HuggingFace or similar tooling is highly desirable.\n- Comfort with experimental design and empirical evaluation (e.g., setting up baselines, tracking metrics, and debugging ML pipelines).\n- Interest in security, robustness, or AI safety; willingness to think adversarially about model behaviour.\nOptional but beneficial: prior exposure to adversarial attacks, backdoors, or security in ML systems.","group":"SECURITY","sub":"SECURITY_0","i":149,"hrsN":12,"gname":"AI Security, Misuse & Cyber","sname":"Jailbreak evasion, tampering & testing failures","url":"https://sparai.org/projects/f26/recmyHeR5WdGIzA1o/","inv":"Guidance","teamMax":5,"teamShort":"3-5","hoursShort":"12 hrs"},{"title":"Alignment Pretraining for Model Welfare","id":"recn0WCJI381Rn3ya","mentors":"Samuel Ratnam (Independent)","areas":["AI welfare","Alignment"],"hours":"5 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"A tentative hypothesis: evidence of us being nice to models in pretraining data is more likely to make them nice to us back. This project is aimed at getting more evidence on this hypothesis.","prereq":"- You should understand and feel confident about implementing synthetic document fine-tuning\n- Have spent some time thinking about threat models of existential risk","group":"WELFARE","sub":"WELFARE_2","i":150,"hrsN":5,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Welfare interventions in training & deployment","url":"https://sparai.org/projects/f26/recn0WCJI381Rn3ya/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"5 hrs"},{"title":"Which tokens lead to emergent misalignment?","id":"recn72ZNYRMuOGcV4","mentors":"Gon\u00e7alo Paulo (EleutherAI)","areas":["Mechanistic interpretability","Alignment"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We can use data attribution to find which documents will lead to the most (emergent) misalignment. Is there a pattern in the tokens that most contribute to it?","prereq":"Have experience with Python and PyTorch (or know how to use LLMs and be able to evaluate how good the produced code is).\nHave done some work using model internals, or be ready to learn.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_2","i":151,"hrsN":8,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Model organisms of emergent misalignment","url":"https://sparai.org/projects/f26/recn72ZNYRMuOGcV4/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Methods and measure for weight and representation based early detection of major changes during learning","id":"recNjX2T6X6y637Mw","mentors":"Nischal Mainali (Principles of Intelligence)","areas":["Developmental interpretability","Mechanistic interpretability"],"hours":"20 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"We will build theoretical models to study sudden changes in network internals during learning, deriving methods and measures from the theory to create a taxonomy of these changes and identify them early during training.","prereq":"- Skilled in using python and knows how to steer and use LLMs for scientific projects\n- knows how to work with and manipulate internals of trained networks \n- understands linear algebra and probability proficiently","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_3","i":152,"hrsN":20,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Developmental interp \u2014 what forms during training","url":"https://sparai.org/projects/f26/recNjX2T6X6y637Mw/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"20 hrs"},{"title":"Introspection Training for Verbalizing Activations","id":"recNKpeygLfUGyGiz","mentors":"Belinda Li (Anthropic)","areas":["Chain of thought","Mechanistic interpretability","Scalable oversight"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We train models to be more faithful by training their verbalizations to be consistent with their internal activations, e.g. \"thoughts\"","prereq":"- Highly proficient in Python and PyTorch.\n- Have trained or fine-tuned a transformer language model (toy models or guided projects are fine).\n- Comfortable reading empirical ML papers and reproducing methods from them.\n- Familiarity with interpretability techniques (linear probes, SAEs, activation patching) is a plus but not required \u2014 willingness to learn them quickly is.\n- Able to commit ~10 hours/week consistently through mid-December.","group":"COT","sub":"COT_1","i":153,"hrsN":10,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Verbalizing internals & the CoT persona","url":"https://sparai.org/projects/f26/recNKpeygLfUGyGiz/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Policy brief - ASML ownership, US exposure, and veto points","id":"recnmI6rMnEMJsH6q","mentors":"J\u00e9r\u00e9my Andr\u00e9oletti (General-Purpose AI Policy Lab), Antoine Maier (General-Purpose AI Policy Lab)","areas":["Compute governance","EU policy","US-China governance"],"hours":"15 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Analyze ASML's capital structure, operational dependence on the US, and the political economy of using it as a European leverage point in AI compute governance, including who can enable or block such use.","prereq":"- Familiarity with the AI risk literature.\n- Basic understanding of semiconductor supply chains and export controls.\n- Ability to read corporate filings and regulatory texts.\n- Strong preference for French fluency, as final policy deliverables are written directly in French.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_0","i":154,"hrsN":15,"gname":"Compute Governance & Geopolitics","sname":"Compute verification & inspection regimes","url":"https://sparai.org/projects/f26/recnmI6rMnEMJsH6q/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"15 hrs"},{"title":"Forecasting the Outcomes of Long-Horizon Agents from Their Internal Representations","id":"recNuwsNX1Sh3mMsa","mentors":"Zach Yahn (Georgia Tech; 10a Labs)","areas":["Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project will investigate whether internal representations of LLMs can predict whether agents will fail at evaluation tasks. In particular we will study long-horizon tasks where early failure indicators could save substantially on evaluation time and cost.","prereq":"- Strong Python proficiency, including experience debugging nontrivial research code, working with APIs or agent frameworks, and analyzing experimental data.\n- Hands-on experience with transformer language models in PyTorch, such as running inference, fine-tuning a model, extracting hidden states or activations, or modifying a model\u2019s forward pass. Experience gained through personal projects or tutorials is acceptable if the applicant can explain the implementation.\n- Familiarity with modern language-model and agent research, including a basic understanding of transformer internals, tool-using agents, evaluation benchmarks, and common experimental failure modes.\n- Comfort with empirical machine-learning research, including designing baselines, interpreting noisy results, checking for confounds or data leakage, and using held-out evaluation.\n- Ability to work independently with imperfect research infrastructure. The project will involve debugging long-running agent rollouts, managing compute, inspecting failed experiments, and adapting the experimental plan when a benchmark or model does not -behave as expected.\n- Sufficient time to contribute consistently, ideally at least 10 hours per week for the duration of the program, including attendance at weekly meetings and regular written progress updates.\n\nPrior experience with mechanistic interpretability, activation probing or steering, agent benchmarks, distributed inference, or long-running GPU experiments would be especially valuable, but is not required.","group":"INTERP_PROBES","sub":"INTERP_PROBES_3","i":155,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Activation monitors & ground-truth probe panels","url":"https://sparai.org/projects/f26/recNuwsNX1Sh3mMsa/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Towards Automated Vulnerability Discovery and Repair with Safety-Governed AI Agents","id":"recNXku4CYlP490of","mentors":"Yige Li (Singapore Management University)","areas":["Cyber risks","AI control","AI security"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project aims to build the foundations for safe and reliable AI agents that automate code vulnerability discovery, verification, and repair. The agents will interact with real code repositories, security tools, sandboxed environments, and human experts to identify vulnerabilities, validate findings, generate patches, and test remediation outcomes. We will develop an expert-in-the-loop safety harness to govern agent permissions, tool use, and high-risk actions, together with a security data engine that captures complete expert\u2013agent\u2013tool trajectories, including successes, failures, corrections, evidence, and repair outcomes. In summary, this project develops safe and reliable AI agents for automated code vulnerability discovery, verification, and repair through three main components: - 1. Automated Vulnerability-Research Agent: Build an AI agent that interacts with code repositories, security tools, and sandboxed environments to identify vulnerabilities, reproduce findings, generate patches, and test repairs. - 2. Expert-in-the-Loop Safety Harness: Develop a control layer for agent permissions, tool use, high-risk actions, evidence requirements, audit logging, and human approval. - 3. Security Data Engine: Capture complete expert\u2013agent\u2013tool trajectories\u2014including successful findings, failed attempts, expert corrections, validation evidence, and repair outcomes\u2014to support agent training, evaluation, and continuous improvement.","prereq":"Applicants should have:\n\n- Strong Python programming skills and experience building, integrating, or evaluating LLM/agent systems, software-engineering tools, or security-analysis pipelines.\n- Solid foundations in either machine learning/AI systems or cybersecurity/software engineering.\n- The ability to work independently on open-ended research problems, read and implement research papers, debug complex systems, and communicate results clearly.\n\n- First-author publications or substantial contributions to published work will be considered particularly valuable.\n\nExperience in at least one of the following areas is strongly preferred:\n\n- AI security, vulnerability research, program analysis, secure coding, fuzzing, automated program repair, or CTF-style security problem solving.\n- Coding agents, tool-using LLMs, agent evaluation, model fine-tuning, preference learning, reinforcement learning, or trajectory-data construction.\n- Building substantial research prototypes, open-source systems, security tools, technical reports, or reproducible experimental pipelines.\n\nApplicants do not need to be experts in both AI and cybersecurity, but they should be strong in at least one area and able to learn the other quickly. Clear technical writing, responsible handling of security-sensitive work, and evidence of completing research projects are essential.","group":"SECURITY","sub":"SECURITY_3","i":156,"hrsN":10,"gname":"AI Security, Misuse & Cyber","sname":"Agent attribution & cyber-offense evals","url":"https://sparai.org/projects/f26/recNXku4CYlP490of/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Investigating Model Internal Verbalizers","id":"recoAPLiJxUEG45bY","mentors":"Dennis Akar (Aether)","areas":["Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"This is an emerging paradigm of training language models (verbalizer) to describe the internals of other language models (target) in natural language (e.g. Anthropic's Natural Language Autoencoders). They generalize well; for instance, they can recover hidden behaviours from models trained to conceal them, achieve SOTA on AuditBench, and can verbalize backdoor triggers where prior methods failed. However, there remain open questions regarding their faithfulness, calibration, input generality, and effect on intrinsic interpretability. Let's try to answer them.","prereq":"- Proficient programmer, or at least can verify AI-assisted code\n- Can read and understand \"LoRAcles\" -- https://openreview.net/forum?id=x9MbM7QmQN\n- (Highly preferable but not strictly necessary) Experience with ML research","group":"INTERP_PROBES","sub":"INTERP_PROBES_3","i":157,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Activation monitors & ground-truth probe panels","url":"https://sparai.org/projects/f26/recoAPLiJxUEG45bY/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Launch an AI Safety Comms Fellowship for Undergrads","id":"recob5vAq7jzeYr6R","mentors":"Noah Birnbaum (Constellation, UChicago EA), Sydney Von Arx (Nightingale, MATS)","areas":["Generalist","Communications"],"hours":"10+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Launch a scrappy comms fellowship for undergrads: raise the funding, recruit comms-inclined students through AI safety group organizers, and run the inaugural cohort.","prereq":"Someone who can be scrappy and get stuff done. Some social media or comms taste is a plus. No credentials required.","group":"FIELD","sub":"FIELD_1","i":158,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Public explanation & comms training","url":"https://sparai.org/projects/f26/recob5vAq7jzeYr6R/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"10+ hrs"},{"title":"Stress-Testing First Amendment Barriers to AI Regulation","id":"recOKvKkZKA96aFWA","mentors":"Alex Mark (Cambridge Boston Alignment Initiative)","areas":["US policy","National policy"],"hours":"5 hrs/week","team":"Team size: 2-10 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"AI regulation may implicate the First Amendment. While the First Amendment protections afforded to AI models, companies, and users are uncertain, any regulatory scheme must contemplate First Amendment litigation risk before these questions reach a court.","prereq":"- Legal Experience\n- Understanding of AI safety fundamentals and threat models","group":"GOV_POLICY","sub":"GOV_POLICY_0","i":159,"hrsN":5,"gname":"Policy, Law & Institutions","sname":"AI, law & constitutional doctrine","url":"https://sparai.org/projects/f26/recOKvKkZKA96aFWA/","inv":"Detailed","teamMax":10,"teamShort":"2-10","hoursShort":"5 hrs"},{"title":"From Reading Lies to Catching Liars: On-Policy Training for Deception Probes","id":"recOOAwgTPrQN27AO","mentors":"Ann-Kathrin Dombrowski (FAR.AI)","areas":["Mechanistic interpretability","Scalable oversight","Behavioral evaluation of LLMs"],"hours":"20 hrs/week","team":"Team size: 2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Deception probes are usually trained on off-policy data \u2014 text the monitored model never generated \u2014 which is known to hurt generalization to real deceptive behavior. We test whether activation steering can fix this in two ways: by generating on-policy deceptive data, and by steering the model while it reads existing off-policy datasets to make their activations appear on-policy.","prereq":"Essential: proficiency in Python and PyTorch, strong scientific judgment, and the ability to use coding agents effectively for research and robust software engineering.\nApplicants should be able to identify blockers, formulate hypotheses, choose informative experiments, explore alternative directions, and critically evaluate agent-generated code and results. They should also be able to organize findings clearly and communicate them in a human-readable form.\nThe strongest signal is evidence of self-directed research: taking an idea from initial framing through implementation, experimentation, analysis, and a clear write-up such as a technical report or blog post. Formal credentials matter less than demonstrated ability to carry out careful research independently.","group":"INTERP_PROBES","sub":"INTERP_PROBES_1","i":160,"hrsN":20,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Deception & honesty probes","url":"https://sparai.org/projects/f26/recOOAwgTPrQN27AO/","inv":"Guidance","teamMax":2,"teamShort":"2","hoursShort":"20 hrs"},{"title":"Scalable midtraining","id":"recoY7vmPkGJs3GUD","mentors":"Shubhorup Biswas (https://aether-ai-research.org/)","areas":["Alignment","Evaluations","Scalable oversight"],"hours":"10 hrs/week","team":"Team size: 1-4 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Model Spec Midtraining (MSM), combined with alignment finetuning (AFT), shows promise as a method for teaching models values with the correct generalisation behaviour. I want to check how scalable this technique is when using teachers and students of different levels of strength, and to test for misalignment and misbehaviour on different agentic misalignment benchmarks.","prereq":"Must be proficient using Python and shell scripts.\n\nMust have experience with coding agents, and should know exactly when to distrust and push back on it.\n\nShould be familiar with agentic misalignment benchmarks.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_1","i":161,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Distillation, mid-training & value drift","url":"https://sparai.org/projects/f26/recoY7vmPkGJs3GUD/","inv":"Detailed","teamMax":4,"teamShort":"1-4","hoursShort":"10 hrs"},{"title":"The Economic Value of AI Capability Gains","id":"recOZMjF1DEYa0NLG","mentors":"Pavel Kocourek (University of Barcelona)","areas":["Economics of AI","AI strategy"],"hours":"16 hrs/week","team":"Team size: 4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"The best open-weight AI models trail the frontier by less than a year, yet frontier labs charge large premiums for marginally better models: casual users barely notice the difference, developers often value it highly, and in offense\u2013defense domains like cybersecurity a small capability edge can be decisive. This project maps how much economic value each level of AI capability unlocks, today and over the next 5\u201310 years, and what that implies for whether frontier labs can sustain profits against open-weight catch-up.","prereq":"Required: clear technical writing; comfort with economic or formal reasoning; ability to work independently.\n\nValued (any of \u2014 a diverse, complementary team works best): econometrics / causal inference; an economics or other quantitative social-science background; familiarity with AI capability evaluations and benchmarks.","group":"SOCIETAL","sub":"SOCIETAL_2","i":162,"hrsN":16,"gname":"Societal, Economic & Epistemic Impacts","sname":"Economic modelling & cost trajectories","url":"https://sparai.org/projects/f26/recOZMjF1DEYa0NLG/","inv":"Guidance","teamMax":4,"teamShort":"4","hoursShort":"16 hrs"},{"title":"Can We Trust the Failure Detectors? A Validity Audit of Trace-Based Monitoring for LLM Agents","id":"recPcCQjmdWCEjPJL","mentors":"Krishna Chaitanya Balusu (Independent)","areas":["Evaluations","AI control","Multi-agent systems"],"hours":"9 hrs/week","team":"Team size: 3-1 mentees","involvement":"Limited involvement","summary":"You will run a preregistered validity audit of today's agent-failure detectors (trace heuristics, LLM judges, and hybrids) against double-annotated, reliability-quantified human ground truth over real agent traces, and release the labeled corpus openly. The mentor provides direction and scaffolding; the mentees own the study.","prereq":"Required:\n1. High proficiency in Python (you can build and debug small tools without hand-holding).\n2. Basic statistics: comfortable with the idea of chance-corrected agreement; Krippendorff's alpha itself is learnable from the provided analysis skeleton.\n3. Demonstrated self-directed work: a prior research project, a substantial open-source contribution, or equivalent evidence that you can drive a workstream on asynchronous feedback. This project deliberately offers autonomy rather than close supervision, so this is the prerequisite that matters most.\n4. The patience to do careful annotation as part of the work (capped at about half your hours, but it is real and must be done well).\n5. 8\u201310 hours per week for 12 weeks, plus availability for the biweekly office-hours call.\n\nNice to have (not required): experience with LLM agent frameworks; observability/OpenTelemetry; prior annotation-protocol, dataset, or ML-evaluation work.","group":"MULTIAGENT","sub":"MULTIAGENT_1","i":163,"hrsN":9,"gname":"Multi-Agent Systems & Coordination","sname":"Collusion & untrusted monitoring","url":"https://sparai.org/projects/f26/recPcCQjmdWCEjPJL/","inv":"Limited","teamMax":3,"teamShort":"3-1","hoursShort":"9 hrs"},{"title":"Reliable Explanations of AI Behavior Across Functionally Equivalent Models","id":"recPohmqz0wtWer1D","mentors":"Bo Zhao (Harvard University)","areas":["Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Researchers often explain an AI model's behavior by identifying the internal components that cause it. We will build small models with a known hidden or unsafe behavior, create versions that produce exactly the same outputs while organizing their internal computations differently, and test whether interpretability methods recover the same underlying mechanism rather than arbitrary neurons or coordinates.","prereq":"- Highly proficient using Python.\n- Have completed at least one project involving transformer training, fine-tuning, activation analysis, interpretability, or implementation.\n- Spent at least 50 hours working with transformers.\n- Working knowledge of linear algebra.\n- Background in group theory is not required, but willingness to learn enough basic definitions (https://arxiv.org/pdf/2506.13018 Section 2, up to definition 2.4) to formalize our research questions is a plus.","group":"INTERP_PROBES","sub":"INTERP_PROBES_2","i":164,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Probe reliability across models & data","url":"https://sparai.org/projects/f26/recPohmqz0wtWer1D/","inv":"Co-working","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"When RLVR Changes the Model, the Safety Test, or Both","id":"recpT2ZSeTfkxu0jI","mentors":"Muhammad Aaliyan (OCN (OneCarNow); Independent AI Safety Researcher)","areas":["Behavioral evaluation of LLMs","Evaluations","Alignment"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We will test whether safety-relevant behavior or evaluation reliability changes across reinforcement learning with verifiable rewards checkpoints. The project will replicate a completed T\u00fclu 3.1 study on a second open training lineage and stress-test the result across prompt wording, answer order, and open-ended evaluation.","prereq":"Mentees must be strong in Python and comfortable entering an existing research codebase. They should have hands-on experience running or evaluating transformer language models with PyTorch and Hugging Face. Fine-tuning experience helps but is not required.\n\nThey should understand bootstrap intervals, paired comparisons, and repeated-measure designs, or be ready to learn those methods quickly. They must be able to commit at least 8 hours per week and keep clear experiment notes. Prior AI safety research and a formal CS degree are not required. I care more about careful empirical work, willingness to report negative results, and follow-through.","group":"EVALS","sub":"EVALS_0","i":165,"hrsN":8,"gname":"Evaluation Science & Eval Awareness","sname":"Benchmark validity & sandbagging","url":"https://sparai.org/projects/f26/recpT2ZSeTfkxu0jI/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Improving Prompt Injection Robustness","id":"recQAUl8mb73cGQ3O","mentors":"Mukesh Ramanathan (MATS)","areas":["AI security","Mechanistic interpretability","Misuse risk"],"hours":"12 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Recent mechanistic work shows that language models infer role is speaking from writing style rather than from the tags, which is why prompt injection works and why current defences generalise poorly. This project aims to develop and evaluate solutions that make role information a token-level signal and use interpretability tools to measure whether the solution genuinely changes what the model perceives.","prereq":"- Solid working knowledge of transformer architecture. You should be comfortable explaining where positional information enters a forward pass, the difference between additive positional embeddings and RoPE, what the residual stream is, and how attention masks work.\n- Basic LLM fine-tuning experience (e.g. having trained a small LoRA, familiar with the debugging process, etc.)\n- Familiar with AI coding agent use\n- Able to run multi-GPU jobs, or willing to learn quickly.\n- Understanding of basic interp methods like linear probes and activation steering (or willingness to learn quickly)","group":"SECURITY","sub":"SECURITY_1","i":166,"hrsN":12,"gname":"AI Security, Misuse & Cyber","sname":"Mechanistic anatomy of jailbreaks & injections","url":"https://sparai.org/projects/f26/recQAUl8mb73cGQ3O/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"12 hrs"},{"title":"Value drift under recursive training loops","id":"recqk5MPTMvdOZq4J","mentors":"Lionel Levine (Cornell University), Rauno Arike (Aether Research)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"A controlled study of how model values change under recursive self-improvement.","prereq":"ARENA curriculum chapter 3 https://www.arena.education/curriculum\n\nYou are independent, take the initiative, keep experiment results and code organized, summarize your findings in clearly explained figures, and excited about the problem of measuring mushy things like values and goals!","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_1","i":167,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Distillation, mid-training & value drift","url":"https://sparai.org/projects/f26/recqk5MPTMvdOZq4J/","inv":"Guidance","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Second Look Research: Replicating load-bearing AI safety research.","id":"recQVGOyf3uaJQu3G","mentors":"Zephaniah Roe (Second Look Research (@ University of Chicago XLab)), Yixiong Hao (Second Look Research, Georgia Tech AISI, Astralis Foundation)","areas":["Evaluations","Alignment"],"hours":"8 hrs/week","team":"Team size: 3-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees will replicate a load-bearing paper or result in AI safety to improve the empirical foundations of the field.","prereq":"- Experience running and/or fine-tuning open-weight models\n- ARENA (chapter 0 and 1) equivalent technical knowledge\n- AI safety context (familiarity with arguments for AI x-risk, AI safety literature and research agendas)\n- Preferred: legible ML research output or open-source project","group":"FIELD","sub":"FIELD_0","i":168,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Career pipelines & community infrastructure","url":"https://sparai.org/projects/f26/recQVGOyf3uaJQu3G/","inv":"Detailed","teamMax":6,"teamShort":"3-6","hoursShort":"8 hrs"},{"title":"National Security Risks of AI-Enabled Cyber-Bio Offense","id":"recqZphVpCRiFlAxK","mentors":"Austin Morrissey (Pivotal Research)","areas":["Biosecurity","Cyber risks","Misuse risk"],"hours":"6 hrs/week","team":"Team size: 12 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Frontier cyber capabilities expand the attack surface for biological weaponization, but current risk evaluations assess these domains in isolation. This project will identify the most plausible, accessible, and severe ways these capabilities could be combined and map the causal pathways through which they lead to harm.","prereq":"1. Substantive experience in at least one area relevant to the project. This could include cybersecurity, biological research or engineering, AI capability evaluations, or work involving adversarial risk assessment or safeguarding.\n2. Experience completing at least one substantial, open-ended research or technical project.\n3. Evidence that they can independently learn unfamiliar technical material and drive a research agenda with limited supervision.\n4. Demonstrated willingness to write for a public audience\n5. Evidence that they can maintain momentum and produce useful work within a fixed timeline.","group":"BIO","sub":"BIO_0","i":169,"hrsN":6,"gname":"Biosecurity & Bio-AI","sname":"Biothreat pathways, attribution & preparedness","url":"https://sparai.org/projects/f26/recqZphVpCRiFlAxK/","inv":"Guidance","teamMax":12,"teamShort":"12","hoursShort":"6 hrs"},{"title":"Planning Temporal Manifolds","id":"recr3hocwOyWhN0z1","mentors":"Ian Rios-Sialer (Independent), Shantanu Darveshi (Independent), Justin Shenk (Independent AI Safety Researcher)","areas":["Mechanistic interpretability","Alignment"],"hours":"10 hrs/week","team":"Team size: 4-8 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Temporal Representational Geometry: We test whether the time horizon a language model is planning over can be read directly from its internal activations. Building on our finding that time horizons form a geometric manifold in single decisions, we extend it to multi-step planning, as a first step toward monitoring and steering how far ahead AI agents plan.","prereq":"- Highly proficient in Python.\n- Have run local LLM inference with PyTorch and HuggingFace transformers (loading checkpoints, chat templates, generation), beyond API-only usage.\n- Have extracted and inspected internal activations from a transformer at least once, using hooks, nnsight, or TransformerLens (toy models and guided exercises such as ARENA count).\n- Comfortable with the linear algebra behind PCA (projections, eigendecomposition) and with reading 2D/3D embedding plots.\n-  Able to commit at least 10 hours/week for the full duration and to work independently between meetings.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_0","i":170,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Feature geometry, influence & automated interp","url":"https://sparai.org/projects/f26/recr3hocwOyWhN0z1/","inv":"Detailed","teamMax":8,"teamShort":"4-8","hoursShort":"10 hrs"},{"title":"What the Teacher Never Said: Geometry, Channel Capacity, and Detection of Subliminal Learning","id":"recr4DwNWT02MDmqu","mentors":"Yuxiao Li (Independent)","areas":["Mechanistic interpretability","Behavioral evaluation of LLMs","AI security"],"hours":"7 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Models transmit behavioral preferences through semantically neutral training data, e.g., number sequences from a biased teacher inducing the same bias in students. Building on our information-theoretic framework and steering-vector results, this project maps when transfer succeeds (tokenization, model family, concept structure) and tests whether new silent-state instruments (Anthropic's J-lens) can detect transmitted traits that behavioral evals miss.","prereq":"- Highly proficient in Python and PyTorch\n- Comfortable with HuggingFace Transformers, running fine-tuning jobs, and managing evaluation pipelines on GPU (Colab/RunPod).\n- Basic probability/information theory (KL divergence, mutual information at working level) helpful for the prediction workstream.\n- Steering-vector experience a plus, not required.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_0","i":171,"hrsN":7,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Data provenance & unintended generalization","url":"https://sparai.org/projects/f26/recr4DwNWT02MDmqu/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"7 hrs"},{"title":"Cooperative Oversight under Correlated Failures and Collusion","id":"recr8MVpZDjKqbC5g","mentors":"Yali Du (King\u2019s College London; The Alan Turing Institute)","areas":["Scalable oversight","Multi-agent systems","AI control"],"hours":"15 hrs/week","team":"Team size: 2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Multi-agent oversight is often proposed as a way to improve the evaluation and supervision of increasingly capable AI systems. This project will investigate when teams of LLM-based overseers improve reliability, and when shared biases, sycophancy, correlated errors, or collusive behaviour cause multiple overseers to fail together.","prereq":"- strong Python programming skills;\n- experience implementing or evaluating machine-learning systems;\n- familiarity with large language models, reinforcement learning, agentic systems, or continual learning;\n- the ability to read research papers and translate research questions into executable experiments;\n- experience using PyTorch, Hugging Face, LLM APIs, or comparable machine-learning tools;\n- basic knowledge of experimental design, evaluation metrics, and statistical analysis;\n- sufficient availability to contribute consistently for the duration of the programme; and\n- clear technical communication skills.","group":"MULTIAGENT","sub":"MULTIAGENT_2","i":172,"hrsN":15,"gname":"Multi-Agent Systems & Coordination","sname":"Escalation, bargaining & crisis dynamics","url":"https://sparai.org/projects/f26/recr8MVpZDjKqbC5g/","inv":"Guidance","teamMax":2,"teamShort":"2","hoursShort":"15 hrs"},{"title":"Predicting How LLMs Generalize","id":"recRAC7j6XvVBAxE6","mentors":"Vladimir Ivanov (Aether), Joey Yudelson (Aether Research)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Given a dataset, being able to predict how an LLM fine-tuned on it will generalize is important but hard. Try to get good at answering this question for a well-scoped but diverse range of datasets by running hundreds of cheap fine-tuning experiments.","prereq":"- Familiar with research on generalization in LLMs. Concretely, has read at least some papers on at least some of the following topics, or similar topics. [emergent misalignment](https://arxiv.org/abs/2502.17424), [inoculation prompting](https://arxiv.org/html/2510.04340v4), [negation neglect](https://arxiv.org/abs/2605.13829), [weird generalization](https://arxiv.org/abs/2512.09742), [subliminal learning](https://arxiv.org/abs/2507.14805)\n- We may consider strong candidates who have little familiarity with generalization in LLMs if they are willing to read 2-3 papers before the start of the project.\n- Has done some experiments on LLMs.\n- Has done some research, preferably with LLMs.\n- [preferred] Has fine-tuned an LLM.\n- [preferred] Has done evals on an LLM.\n- [Big plus, but not expected] Has run experiments on generalization in LLMs.","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_3","i":173,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Reward hacking & shaping generalization","url":"https://sparai.org/projects/f26/recRAC7j6XvVBAxE6/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"Shaping the Generalisation Landscape of LLMs","id":"recRBrhGLoSZtc7I2","mentors":"Samuel Ratnam (Independent)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"6 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Emergent misalignment implies the existence of a 'misalignment basin', where training on lots of different kinds of data can push the model along roughly the same general misalignment direction. This project focuses on interventions to explore and shape the generalisation landscape of LLMs to make misalignment basins harder to fall into and alignment basins more powerful.","prereq":"- Proficient in python, with experience in parameter-efficient fine-tuning of LLMs\n- You should have spent some time thinking about threat models of catastrophic misalignment","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_3","i":174,"hrsN":6,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Reward hacking & shaping generalization","url":"https://sparai.org/projects/f26/recRBrhGLoSZtc7I2/","inv":"Guidance","teamMax":4,"teamShort":"2-4","hoursShort":"6 hrs"},{"title":"Bayes-Optimal Research Protocols for Automated AI Safety Research","id":"recRCdw4xhoOWbTPf","mentors":"Aydin Mohseni (Carnegie Mellon University)","areas":["AI strategy","Multi-agent systems","Evaluations"],"hours":"8 hrs/week","team":"Team size: 2-6 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"We are designing optimal protocols for automated AI safety research. We use Bayesian models to determine how to best allocate compute across many AI agents doing open-ended research, so that safety research goes faster per unit of compute.","prereq":"Required: comfort with probability and expected-utility reasoning; working Python. Helpful but not required: exposure to bandit problems or optimal experimental design (I will teach this); experience running LLMs via API or agentic scaffolds; familiarity with automated theorem proving or proof assistants (e.g. Lean) for the sandbox track.","group":"FIELD","sub":"FIELD_3","i":175,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Meta-research & automating safety research","url":"https://sparai.org/projects/f26/recRCdw4xhoOWbTPf/","inv":"Detailed","teamMax":6,"teamShort":"2-6","hoursShort":"8 hrs"},{"title":"How good are AIs at sabotaging oversight decisions over data and code?","id":"recREjjyInX8pRuzG","mentors":"Lennart Finke (ETH Zurich, MATS Research)","areas":["AI control","Evaluations"],"hours":"18 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Soon, AIs will implement whole specs at once when writing code, with only minimal oversight at the end from humans. We study whether an assistant AI to the overseer can sabotage the decision whether a fixed piece of code follows a natural language spec.","prereq":"- Good at using coding agents\n- Understands what AI control is","group":"CONTROL","sub":"CONTROL_0","i":176,"hrsN":18,"gname":"AI Control & Scalable Oversight","sname":"Control protocols & escalation to humans","url":"https://sparai.org/projects/f26/recREjjyInX8pRuzG/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"18 hrs"},{"title":"Training-Time Mitigations for Eval Awareness and Eval Gaming","id":"recrJd7fsQ0XE2nEh","mentors":"Ryan Lundqvist (Pivotal)","areas":["Evaluations","Behavioral evaluation of LLMs","Alignment","Mechanistic interpretability"],"hours":"5 hrs/week","team":"Team size: 4-5 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"Frontier models increasingly recognize when they are being evaluated and adjust their behavior accordingly, undermining the validity of our evaluations. Rather than trying to keep outsmarting ever-smarter models with more realistic environments, can we train models not to game evals in the first place and, critically, do such training-time mitigations survive the optimization pressure of post-training?","prereq":"I'm open to a broad range of applicants. There are no hard requirements, but in general it will be helpful for mentees to:\n- be comfortable with rapid project iteration and implementing experiments\n- being prosocial and proactive in helping other mentees\n- have some background knowledge about the field","group":"EVALS","sub":"EVALS_1","i":177,"hrsN":5,"gname":"Evaluation Science & Eval Awareness","sname":"Evaluation awareness & eval gaming","url":"https://sparai.org/projects/f26/recrJd7fsQ0XE2nEh/","inv":"Co-working","teamMax":5,"teamShort":"4-5","hoursShort":"5 hrs"},{"title":"Investigating Model Preferences for Trading and Dealmaking","id":"recrjwaqa3tbS1DdF","mentors":"Austin Meek (University of Delaware), Kyle Cox (AE Studio)","areas":["AI welfare","Behavioral evaluation of LLMs","Alignment"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We want to better understand model preferences in order to understand how to better trade with models, if we can optimize for inputs that trivially satisfy model preferences in realistic scenarios, differences in model preferences between models and personas, etc. This builds on prior work by the Center for AI Safety on optimizing for model preferences & functional wellbeing, and persona work broadly.","prereq":"- Some research experience (doesn't have to be a paper, can be a personal side project, replicating a paper, playing around with LLM internals/evals, etc.)\n- A strong coding background, preferably Python (side projects demonstrating strong coding skills like a library, tools, etc.)\n- Familiarity with PyTorch and the HuggingFace transformers ecosystem, Inspect evals, and agentic settings\n- Basic understanding of transformer architecture (attention, residual stream, MLPs) and how LLMs are trained/fine-tuned\n\n\nNice to have:\n- Familiarity with relevant research from model personas / evals / preferences","group":"WELFARE","sub":"WELFARE_2","i":178,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Welfare interventions in training & deployment","url":"https://sparai.org/projects/f26/recrjwaqa3tbS1DdF/","inv":"Guidance","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Successor to AI Lab Watch","id":"recrMjUJvwDNnEZlK","mentors":"Harshul Basava (GT AISI), Meru Gopalan (GT AISI, XLab)","areas":["Generalist","Lab governance"],"hours":"10+ hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Monitor and evaluate safety practices at frontier labs by scrutinizing public-facing outputs.","prereq":"Strong attention to detail and truthseeking. Context on AI safety threat models and frontier labs, or the ability to learn quickly. Useful skills include writing ability and experience with coding agents.","group":"FIELD","sub":"FIELD_4","i":179,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Org-building, hiring & lab accountability","url":"https://sparai.org/projects/f26/recrMjUJvwDNnEZlK/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10+ hrs"},{"title":"Joint Commitment Eval","id":"recrW7EUCXdNQyPGW","mentors":"Jared Moore (Stanford University)","areas":["Behavioral evaluation of LLMs","Multi-agent systems","Alignment"],"hours":"20 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Produce a process-level evaluation of cooperation in AI systems inspired by research in cognitive science on joint commitment.","prereq":"Prior research experience (can be in another domain).\n\nAble to read and understand papers in at least some AI domains and in cognitive science (and not just use an LLM summary).\n\nProficiency with python. Writes clean, understandable code.\n\n- It is fine to use coding agents but you must know how to reign them in (viz.: read their code; don't let them reimplement everything; use linters and formatters).\n\nHave a realistic model of your own schedule and get things done when you say. (I'm not trying to say everything has to be done quickly -- just that you should communicate your uncertainty.)\n\nOpenness to learn new things.\n\nClear communicator. Agreeable and humble.","group":"MULTIAGENT","sub":"MULTIAGENT_0","i":180,"hrsN":20,"gname":"Multi-Agent Systems & Coordination","sname":"Cooperation, commitment & game theory","url":"https://sparai.org/projects/f26/recrW7EUCXdNQyPGW/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"20 hrs"},{"title":"Improving CoT faithfulness of Coding Agents in the context of Sandbox Containment","id":"recrXTc9e2NnOUbEm","mentors":"David Baek (MIT)","areas":["Chain of thought","AI control","AI security"],"hours":"20 hrs/week","team":"Team size: 3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We explore different ways to train coding agents to improve their CoT faithfulness, especially in the context of sandbox containment.","prereq":"- Highly proficient using Python\n- Trained or fine-tuned a transformer language model in PyTorch","group":"COT","sub":"COT_2","i":181,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Measuring CoT / self-explanation faithfulness","url":"https://sparai.org/projects/f26/recrXTc9e2NnOUbEm/","inv":"Guidance","teamMax":3,"teamShort":"3","hoursShort":"20 hrs"},{"title":"Studying Catastrophic AI Misuse: Harm Uplift Measurement and Red-Teaming for Dangerous Knowledge","id":"recs0II21LeSn5B7F","mentors":"John Kitaoka (MATS), Max Kamachee (MATS Research)","areas":["Misuse risk","Evaluations","Behavioral evaluation of LLMs"],"hours":"15 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Frontier models hold operationally useful dual-use knowledge, and cheap task-decomposition attacks can pull it out while slipping past per-query defenses. This project measures how much real harm uplift these attacks produce (functional success, not just refusal) and builds the measurement and detection tools providers need to keep pace.","prereq":"Required: high proficiency in Python. Comfortable calling LLM APIs and running open-weight models locally. Familiar with core AI safety and red-teaming concepts (jailbreaks, refusal training, evals). Able to work and deliver independently, and have clear reasoning transparency!\nStrong plus for specific directions: domain literacy in chemistry, biology, or cybersecurity for the dataset directions, experience designing or running AI evaluations, prior red-teaming or capability-elicitation work.","group":"SECURITY","sub":"SECURITY_2","i":182,"hrsN":15,"gname":"AI Security, Misuse & Cyber","sname":"Misuse uplift & infohazard measurement","url":"https://sparai.org/projects/f26/recs0II21LeSn5B7F/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"15 hrs"},{"title":"Automated evaluations and behavioral discovery for multi-agent systems","id":"recs4Td7KwmajVB09","mentors":"William Anderson (Cooperative AI Foundation), Joss Oliver (Cooperative AI Foundation)","areas":["Multi-agent systems","Evaluations","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We will extend current automated auditing/evaluation tools (e.g. Petri, Bloom, Prism) to multi-agent systems, enabling discovery of safety-relevant emergent behavior and careful measurement of multi-agent propensities (coercion, collusion, competitiveness, etc). This builds directly on Orbit, our recent release that extends UK AISI\u2019s Inspect to support multi-agent evaluations.","prereq":"- High proficiency in Python\n- Familiarity with basic concepts in AI safety\n\nIn addition to the above, we\u2019re especially excited about mentees that have:\n- Experience building and running LLM evals in Inspect\n- Strong software engineering background\n- A strong background in another field which they could apply to shape a particular strand of evals, e.g. a background in organizational psychology, game theory, cybersecurity, economics, etc\n- Experience building scaffolds for LLM agents\n- Demonstrated interest in multi-agent safety and some understanding of the failure modes and dynamics of multi-agent systems","group":"MULTIAGENT","sub":"MULTIAGENT_3","i":183,"hrsN":8,"gname":"Multi-Agent Systems & Coordination","sname":"Why multi-agent systems fail","url":"https://sparai.org/projects/f26/recs4Td7KwmajVB09/","inv":"Detailed","teamMax":3,"teamShort":"3","hoursShort":"8 hrs"},{"title":"AI Safety 1-on-1 Networking Platform","id":"recS6gaXQE5K2NDeQ","mentors":"Nixon Hanna (Generator Residency, MIT AI Alignment)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Create a platform for people in AI Safety to conveniently set up 1:1s with others to improve networking in the space without needing more in-person events.","prereq":"The main prerequisite I have for a mentee on this project is thoughtfulness, as if successful this project will involve many people with high opportunity cost and should thus be respectful of their time. This will mostly look like being able to foresee possible failure modes and ensuring a good user experience from the start.\n\nSWE experience would also be a huge plus, but it may be possible to contract out the development of the actual site.\n\nBeyond this, I am open to a fairly wide variety of profiles.","group":"FIELD","sub":"FIELD_0","i":184,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Career pipelines & community infrastructure","url":"https://sparai.org/projects/f26/recS6gaXQE5K2NDeQ/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"Mechanistic interpretability of jailbreak attacks","id":"recS6nNc9hVyyVXBk","mentors":"Battista Biggio (University of Cagliari, Italy)","areas":["Mechanistic interpretability","AI security"],"hours":"15 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Modern aligned language models refuse harmful requests, yet simple jailbreak prompts often restore unsafe behavior. This project investigates whether jailbreaks operate by manipulating the internal representations responsible for refusal. We will identify refusal-related directions or sparse features using representation analysis across multiple aligned models, compare how diverse jailbreak families alter these representations, and perform causal interventions through activation steering to test whether restoring refusal representations can prevent successful jailbreaks. The project aims to determine whether jailbreaks exploit a shared geometric mechanism or multiple distinct internal circuits, providing mechanistic insights into the robustness and limitations of current alignment methods.","prereq":"Knowledge of LLMs/transformers, safety alignment, low-rank fine tuning, jailbreaks and adversarial attacks. Fluent in python and pytorch.","group":"SECURITY","sub":"SECURITY_1","i":185,"hrsN":15,"gname":"AI Security, Misuse & Cyber","sname":"Mechanistic anatomy of jailbreaks & injections","url":"https://sparai.org/projects/f26/recS6nNc9hVyyVXBk/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"15 hrs"},{"title":"Demonstrate the importance of shaping RL exploration for AI safety","id":"recSCy4nlQa8HNAu6","mentors":"Maxime Rich\u00e9 (Center on Long-Term Risk)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Evaluate how much the effects of RL safety interventions arise from changing which trajectories the model explores, rather than changing other aspects of the training dynamics.","prereq":"- Proficient in using Python or another programming language\n- Experience evaluating LLMs\n- Able to work independently and asynchronously \n- [optional but encouraged] Experience training or finetuning LLMs\n- [optional but encouraged] Proficient in designing, debugging, and analyzing experiments","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_4","i":186,"hrsN":15,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Preference conflicts & RL exploration","url":"https://sparai.org/projects/f26/recSCy4nlQa8HNAu6/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"You choose: Introspection","id":"recSethyRdYZqNM2O","mentors":"Lydia Nottingham (University of Oxford), Andrew Tran (Independent)","areas":["Behavioral evaluation of LLMs","Alignment","Philosophy of AI"],"hours":"10 hrs/week","team":"Team size: 2-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"I propose a collection of mini-projects focused on LLM introspection. Over the course of four months, you could work on 1-4 of these. You may also propose your own!","prereq":"Important: Ability to work effectively with others in the era of AI-assisted ideation and coding, where it is easy to generate huge quantities of AI slop that can burden the reviewer. This means making sure any communication (including code) between team members is succinct, clear and easily understood by any human.","group":"PERSONA","sub":"PERSONA_2","i":187,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Self-models, identity & introspection","url":"https://sparai.org/projects/f26/recSethyRdYZqNM2O/","inv":"Guidance","teamMax":5,"teamShort":"2-5","hoursShort":"10 hrs"},{"title":"Identifying function-relevant signatures in protein models for biosecurity screening","id":"recSIECymwstN2JgQ","mentors":"Isha Harris (Fourth Eon Biosecurity Institute), Gary Abel (Fourth Eon Biosecurity Institute; the Johns Hopkins Center for Health Security)","areas":["Biosecurity","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project explores biological foundation models for biosecurity screening, applying interpretability methods to identify biophysically relevant features that can reinforce screening against engineered and AI-designed biological threats.","prereq":"- A background in bioinformatics, computational biology, structural biology, biochemistry, biophysics, protein engineering, biosecurity, AI/ML science, computer science, or a related field.\n\n- Prior technical research experience.\n\n- A good understanding of the basics of biomolecular sequence, structure, and function.\n\n- Some experience with biological AI models.\n\n- Proficiency with Python.\n\n- Strong critical thinking and creative problem-solving abilities.\n\n- Curiosity and a desire to understand the world.\n\n- The integrity and judgment to responsibly carry out sensitive research.","group":"BIO","sub":"BIO_1","i":188,"hrsN":10,"gname":"Biosecurity & Bio-AI","sname":"Safeguards & evals for bio foundation models","url":"https://sparai.org/projects/f26/recSIECymwstN2JgQ/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"10 hrs"},{"title":"Generalist Megastream","id":"recSm0PPC4T4ZUWHZ","mentors":"Generalist Mentor Pool  (Kairos, Constellation, Generator Residency, etc.)","areas":["Generalist","AI strategy","Communications"],"summary":"The Generalist Megastream pairs mentees on small generalist projects with a mentor from a pool of generalist mentors from Kairos, Constellation, the Generator Residency, and more. Projects are talent/infrastructure research, field-building, or answering open operational questions in AI safety. The stream is a step before programs like the Generator Residency: it gives people context on the field, experience with generalist work, and preparation for future opportunities, while legitimizing generalist paths into AI safety.","prereq":"","group":"FIELD","sub":"FIELD_3","i":189,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Meta-research & automating safety research","url":"https://sparai.org/projects/f26/recSm0PPC4T4ZUWHZ/","inv":"Limited","teamMax":2,"teamShort":"","hoursShort":""},{"title":"Measuring social preferences regarding AI related risks","id":"recSrin2Pr0umDNn9","mentors":"Andrei Potlogea (University of Edinburgh)","areas":["AI strategy","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"As we try to mitigate AI risks, we will face tradeoffs among risk categories, for instance between misuse risks and extreme power concentration. As we navigate these tradeoffs it might be useful to measure the preferences of the public/ AI experts/ other constituencies regarding how to trade off these risks.","prereq":"Background in economics or psychology, solid programming background. Experience with running surveys or social science lab experiments preferred.","group":"SOCIETAL","sub":"SOCIETAL_1","i":190,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Macro impacts & public risk preferences","url":"https://sparai.org/projects/f26/recSrin2Pr0umDNn9/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"Mitigating Intentional Loss of Control Risk Through Interoperability Standards for Agentic AI","id":"recSTG0vRi3nFZ4h9","mentors":"Kevin Kohler (Simon Institute, UN University, AGI Preparedness Institute)","areas":["AI control","International governance","Technical governance"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Within a few years, when self-replication is plausibly within reach of open-weight systems, the binding constraint on an agent deployed to operate without a controlling human principal will likely not be the model, but whether the rest of the agent economy will discover, authorize, transact with, or pay it. This project maps who actually holds change control over the agent identity and trust layer, evaluates the competing architectures against an explicit intentional-loss-of-control threat model, and feeds the result into live standards and Geneva policy discussions before network effects settle the question.","prereq":"Able to read a technical specification or standards draft closely and explain what it actually obliges implementers to do \u2014 without needing to implement it. If you have never opened an IETF or W3C draft, that is fine; if the idea of reading one carefully for two hours sounds unpleasant, this is the wrong project.\nComfortable writing clear analytical prose for a policy audience. Most of the output is written.\nAble to work independently on an open-ended question and come back with a structure rather than a list of links.\nWilling to email strangers, request interviews, and run them.\nSome grounding in AI safety arguments, specifically why loss of control is a concern at all. You do not need to agree with the framing \u2014 informed skepticism is useful here \u2014 but you should be able to engage with it.\n\nUseful but not required: background in internet governance, identity and access management, security engineering, standards participation, or law. Experience with a slow institutional process of any kind, including as a participant.\n\nExplicitly not required: machine learning research experience, ability to train models, publicatio
