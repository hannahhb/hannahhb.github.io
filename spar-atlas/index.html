s, scaffolds, or evaluation harnesses; personal projects are fine). Comfort reading empirical ML papers. For the commitment-device experiments, basic game theory (familiarity with Nash equilibrium and the role of commitment in games). Experience with UK AISI's Inspect framework is helpful but not required.","group":"MULTIAGENT","sub":"MULTIAGENT_2","i":85,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Escalation, bargaining & crisis dynamics","url":"https://sparai.org/projects/f26/recFN5aycRe5NBe5e/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"How Quickly can Middle Powers Build Frontier Compute Capacity?","id":"recFVAidVl2xKRFoS","mentors":"James Nicholas Bryant (Pivotal Research)","areas":["Compute governance","AI strategy","International governance"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"In the case of a Middle Power Frontier AI coalition, what would be the most effective routes to sufficiently large compute buildout? How quickly could middle powers acquire and operationalise substantial compute? Which constraints determine their progress?","prereq":"I expect to be interested in mentees from a wide-variety of backgrounds.\n\n\n\nRequired:\n- Strong analytical writing\n- Comfortable with self-directed desk research\n- Able to commit ~10 hours/week for the full programme period, including a ~weekly call.\n- Broad familiarity with AI governance, with strong insights into why compute is a governance lever\n\nIdeal:\n- Experience with comparative case-study research or structured analysis (e.g. has written a literature review, policy analysis, or thesis chapter using multiple cases).\n- Strong familiarity with at least one of: datacentre/energy infrastructure, semiconductor supply chains, industrial policy, or project finance.\n- Quantitative literacy: comfortable building timelines and cost/capacity estimates in a spreadsheet.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_0","i":86,"hrsN":8,"gname":"Compute Governance & Geopolitics","sname":"Compute verification & inspection regimes","url":"https://sparai.org/projects/f26/recFVAidVl2xKRFoS/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Assessing Taiwan\u2019s Global Position for Transformative AI","id":"recfXO69kXO3ywtzg","mentors":"David Sanchez Garcia (GovAI Summer Fellow), Kevin Chen (Centre for the Governance of AI)","areas":["US-China governance","AI strategy","Compute governance"],"hours":"8 hrs/week","team":"Team size: 4-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Taiwan manufactures the world\u2019s most advanced AI chips and sits at the center of US-China tensions \u2013 yet Taiwan is consistently perceived as a bystander rather than an actor in AI safety. This project produces a first baseline demystifying Taiwan\u2019s role in AI governance and identifying the specific ways it can leverage its position for global AI safety, written to reach the policymakers who can act on it.","prereq":"Essential (all modules):\n- Strong analytical writing in English: able to turn research into clear, structured prose. A writing sample is required; a class paper, blog post, policy memo, or research write-up is all fine.\n- Ability to work independently from a shared template and reading list, holding yourself to deadlines between weekly check-ins. This is a high-autonomy project.\n- Genuine engagement with transformative AI: you don't need to hold any particular timeline view, but you should take the possibility of rapidly more capable AI seriously and be able to reason about what it means for Taiwan.\n- Basic familiarity with the AI governance landscape: you should roughly know what export controls, compute governance, and frontier-model evaluations are. Module-specific depth is not expected at the start.\n\nEssential for some modules:\n- Traditional Chinese reading ability and Mandarin skills: required for the elite-discourse module and strongly preferred for the policy module. The compute/verification and defense modules have substantial English-language literatures, so non-Mandarin readers are welcome there.\n\nNice to have:\n- Technical background or working understanding of the semiconductor industry (compute/verification module).\n- Prior experience conducting literature reviews or desk research.\n- Prior research experience in AI governance or a related policy field.\n- Clear strategic thinking about transformative AI and being able to trace second-order consequences of a scenario, not just describe it.\n- Background in public policy, international relations, political science, East Asian studies, or security studies, or demonstrated equivalent, such as a completed AI-governance course (e.g. BlueDot courses) or prior governance research.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_1","i":87,"hrsN":8,"gname":"Compute Governance & Geopolitics","sname":"China, Taiwan & the semiconductor chain","url":"https://sparai.org/projects/f26/recfXO69kXO3ywtzg/","inv":"Guidance","teamMax":6,"teamShort":"4-6","hoursShort":"8 hrs"},{"title":"Auditing Frontier AI Compliance via an EU Code of Practice Tracker","id":"recG443p3jcgywChQ","mentors":"Markov Grey (CeSIA (French Center for AI Safety)), Charbel-Raphael Segerie (CeSIA - Centre pour la S\u00e9curit\u00e9 de l'IA (French Center for AI Safety))","areas":["EU policy","Technical governance","Lab governance"],"hours":"20 hrs/week","team":"Team size: 2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"The EU AI Act's Code of Practice sets out what frontier AI providers must disclose about how they manage and mitigate risk. This project builds a tracker that measures how well each provider actually complies with the CoP. The hard part of this project is going to be measurement: turning vague legal obligations into atomic, checkable indicators that measure compliance. The work in the project involves designing indicators, doing literature reviews of model evaluations to define what a complete disclosure looks like, human review and sign-off on every indicator and score for every provider assessed and evaluating a multi-model AI pipeline that does the scoring. We need a few different technical profiles.","prereq":"We're looking for one of the following profiles. A strong generalist can span multiple.\n\n- Quantitative social science, or a similar background in turning qualitative material into valid quantitative indicators. This is measurement work: construct validity (measuring the thing you claim to, not a proxy for your own opinion), decomposition (breaking a qualitative obligation into atomic, comparable, checkable units), and aggregation (how those units combine without one failure hiding behind many passes). Content analysis, coding schemes, psychometrics, survey methodology, or empirical social science all count.\n- An engineer fluent with LLM tooling, or who has worked with multi-agent workflows before, for the pipeline and the meta-evaluation study. Strong Python, comfortable in a real research codebase, and able to design and run a clean experiment on the pipeline.\n\nAcross all: able to read regulatory and technical text closely and precisely; genuinely care about the line between compliance and safety, and about construct validity; and self-directed enough to take a scoped brief and return a defensible result without hand-holding.","group":"GOV_POLICY","sub":"GOV_POLICY_2","i":88,"hrsN":20,"gname":"Policy, Law & Institutions","sname":"Compliance tracking, red lines & verification","url":"https://sparai.org/projects/f26/recG443p3jcgywChQ/","inv":"Guidance","teamMax":2,"teamShort":"2","hoursShort":"20 hrs"},{"title":"More Than the Model: Why Multi-Agent Systems Fail","id":"recG46iQPA1jk5AnG","mentors":"Piercosma Bisconti (Icaro Foundation), Federico Pierucci (Icaro Foundation), Marcantonio Bracale Syrnikov (Icaro Lab)","areas":["Multi-agent systems","Evaluations","Technical governance"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"This project studies how systems of interacting LLM agents fail in ways that never appear when models are evaluated in isolation: collusion, conflict, and coordination failure. The goal is to turn these failure modes into concrete evaluation methods that can feed international standards and regulation for frontier AI.","prereq":"- Hands-on experience with LLMs via API: prompting, orchestrating multi-step or multi-agent calls, and parsing/handling model outputs programmatically. Toy projects and following guides is fine, but you should have actually built something.\n- Able to design a clean experiment: define a hypothesis, hold variables constant, and reason about whether a result is real or an artifact. This matters more to me than any specific framework.\n- Comfortable working with negative and messy results, and honest about them. A lot of this work is discovering that an \"interesting\" behavior was a prompt artifact.\n\nNice to have (not required):\n\n- Familiarity with an agent framework (LangGraph, AutoGen, CrewAI, or similar), or having built a multi-agent setup from scratch.\n- Some exposure to game theory, mechanism design, or social/organizational theory, useful for the collusion and coordination side.\n- Any interest in or exposure to AI standards/regulation (EU AI Act, ISO). Genuinely optional; I supply this.","group":"MULTIAGENT","sub":"MULTIAGENT_3","i":89,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Why multi-agent systems fail","url":"https://sparai.org/projects/f26/recG46iQPA1jk5AnG/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Human Autonomy in the Age of Machines","id":"recgG94Smce7E8J7G","mentors":"Joshua Krook (University of Antwerp, University of Southampton)","areas":["Societal impacts","AI strategy"],"hours":"4 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Human autonomy is increasingly at risk as we outsource more and more decisions to AI. The gradual disempowerment thesis argues that we will lose control over the systems around us, and this project seeks solutions to the loss of human control.","prereq":"Research background, ideally in policy, law or related fields.","group":"SOCIETAL","sub":"SOCIETAL_0","i":90,"hrsN":4,"gname":"Societal, Economic & Epistemic Impacts","sname":"Human autonomy & epistemic security","url":"https://sparai.org/projects/f26/recgG94Smce7E8J7G/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"4 hrs"},{"title":"Normalization of Deviance in AI Development","id":"recgr8mDxo4Pqcs9t","mentors":"Emilio Barkett (Independent)","areas":["AI strategy","Lab governance"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"The normalization of deviance framework \u2014 the organizational process by which safety violations become redefined as acceptable through repeated non-disaster \u2014 has preceded every major technological catastrophe of the last half-century, yet has never been systematically applied to AI development. This project investigates whether the structural conditions that produced Challenger, Three Mile Island, and the Boeing 737 MAX crashes are present in contemporary AI development organizations, and what that implies for AI safety.","prereq":"Prerequisites:\n\nFamiliarity with the AI safety landscape, including basic knowledge of current frontier AI development organizations, evaluation practices, and governance frameworks.\nComfort reading and synthesizing academic literature across disciplines, including organizational sociology, science and technology studies, and social science methodology.\nStrong analytical writing skills, demonstrated through prior academic writing, research papers, or policy documents.\nAbility to conduct systematic qualitative research, including identifying, collecting, and analyzing publicly available documentary evidence.\nGenuine intellectual curiosity about the intersection of organizational dynamics and AI safety \u2014 this project is not primarily technical and does not require a computer science background, but does require comfort reasoning carefully about complex sociotechnical systems.\nThe following are not required but would be advantageous:\n\nPrior exposure to organizational sociology or science and technology studies.\nFamiliarity with qualitative research methods such as document analysis or case study methodology.\nExperience writing for academic venues in any discipline.","group":"GOV_POLICY","sub":"GOV_POLICY_3","i":91,"hrsN":5,"gname":"Policy, Law & Institutions","sname":"Lab-practice risk & strategic foresight","url":"https://sparai.org/projects/f26/recgr8mDxo4Pqcs9t/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"Beyond BlueDot: Helping Generalists Build Context","id":"recGSb6cJdzsVuPuu","mentors":"Rebecca Baron (Kairos)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Help build the pipeline for nontechnical talent by creating a course to help BlueDot graduates build enough context to take next steps.","prereq":"- High context on AI safety; in particular, spends a lot of time on the Forum/LW/etc\n- Strong people skills\n- Conscientious and organized\n- Strong preference for candidates with fieldbuilding experience (e.g. uni group organizing)\n- Preference for candidates who have run a BlueDot course or intro fellowship before","group":"FIELD","sub":"FIELD_5","i":92,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"University group curricula & playbooks","url":"https://sparai.org/projects/f26/recGSb6cJdzsVuPuu/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"5+ hrs"},{"title":"Escalation Detection: When Do Agents Need Human Intervention","id":"recGYaReeUQEzjDdM","mentors":"Georg Lange (Poseidon Research), Trevor Lohrbeer (Independent)","areas":["Mechanistic interpretability","AI control","Behavioral evaluation of LLMs"],"hours":"20 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Agents work autonomously by overcoming obstacles. But this tendency to overcome obstacles can lead to reward hacking behaviors. Using turn-averaged sparse auto-encoders (TA-SAEs), it may be possible to detect when the model starts to take more extreme measures to overcome obstacles and use that to pause the model and escalate the problem to a human to provide further guidance.","prereq":"highly proficient using Python\nhave implemented a transformer and SAE from scratch\nhave used Claude Code or Codex for research\n\nOne or more of the following:\n\nworked with pytorch hooks, transformerlens or nnsight to get model activations\nweb development skills / happy to vibe code basic web apps\nexperience with prompt engineering\nused an LLM API (OpenAI, Anthropic, etc)","group":"INTERP_PROBES","sub":"INTERP_PROBES_0","i":93,"hrsN":20,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Detecting scheming & escalation from internals","url":"https://sparai.org/projects/f26/recGYaReeUQEzjDdM/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"20 hrs"},{"title":"Epistemic security in the age of AI","id":"recH7Svwds5L6yJZk","mentors":"Natalie Linton (Independent), Sarah Lucioni (GovAI, Google)","areas":["Societal impacts","Misuse risk","Biosecurity"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Effective response to emergencies (such as a nascent pandemic) relies on having trustworthy knowledge infrastructure. However, AI reduces the cost of producing convincing false information at scale and as AI becomes more integrated into public and private systems there is significant risk of knowledge infrastructure and decision-making becoming compromised by AI-generated materials and AI itself becoming an artificial hivemind.","prereq":"We are open to a broad range of applicants, but expect this project to be well-suited to social scientists, historians, or policy researchers interested in epistemic risks from AI, particularly misinformation and disinformation risks. If you have a technical background and would like to do a technical project it would be beneficial for you to propose your idea for how to apply your technical skills to this topic. An interest in assessing a biosecurity (pandemic) scenario for risk would be of interest but is not required.","group":"SOCIETAL","sub":"SOCIETAL_0","i":94,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Human autonomy & epistemic security","url":"https://sparai.org/projects/f26/recH7Svwds5L6yJZk/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"Locating knowledge with influence functions","id":"rechCwSWaPYRpqh9z","mentors":"Gon\u00e7alo Paulo (EleutherAI)","areas":["Mechanistic interpretability","Alignment"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Influence functions use gradients of model parameters to find the data points that most affect a model behavior. Can we use them to locate where certain knowledge is located in models, and use that for more targeted unlearning?","prereq":"Proficient at Python and Pytorch (or be able to prompt LLMs and evaluate the legitimacy of their outputs)\nHave done experiments intervening on model's internals (same LLM clause as above)","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_0","i":95,"hrsN":15,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Feature geometry, influence & automated interp","url":"https://sparai.org/projects/f26/rechCwSWaPYRpqh9z/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Diagnosing the Mechanisms Behind Honest-Looking Language-Model Behaviour","id":"rechJutwCU7PcVh1N","mentors":"Bryan Chan (independent)","areas":["Behavioral evaluation of LLMs","Evaluations","Alignment"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Language models can appear honest for different reasons, including genuine truthfulness, sycophancy, refusal, or sensitivity to evaluation cues. This project develops controlled behavioural evaluations to distinguish these possibilities and test when honest-looking behaviour generalises across contexts.","prereq":"**Commit at least 10 hours per week consistently.**\n\n**Basic experience working with language models and Python.** Experience with evaluations, inference pipelines, or fine-tuning is useful, but these can be developed during the project.\n\n**Ability to reason carefully about experiments.** You should be comfortable turning an informal research question into hypotheses, comparisons, measurements, and controls.\n\n**Communicate frequently and raise blockers early.** Mentees will provide brief progress updates and present their work weekly. Unexpected results, uncertainties, and failed approaches should be surfaced early.\n\nUseful resources for preparing for the project's research and weekly presentation workflow:\n\n- James Chua's [Tips on Empirical Research Slides](https://www.lesswrong.com/posts/i3b9uQfjJjJkwZF4f/tips-on-empirical-research-slides), for structuring clear weekly research updates.\n- Neel Nanda's [How I Think About My Research Process: Explore, Understand, Explain](https://www.lesswrong.com/posts/hjMy4ZxS5ogA9cTYK/how-i-think-about-my-research-process-explore-understand), for approaching exploratory research, iteration, and deepen understanding.","group":"INTERP_PROBES","sub":"INTERP_PROBES_1","i":96,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Deception & honesty probes","url":"https://sparai.org/projects/f26/rechJutwCU7PcVh1N/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"Lie Detection","id":"rechqNr78bR66wvvB","mentors":"Walter Laurito (Cadenza Labs)","areas":["Behavioral evaluation of LLMs","Evaluations","Mechanistic interpretability"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"We are interested in creating better ways to evaluate and improve lie or deception detectors for LLMs.","prereq":"familiar with \n- LLM fine-tuning using Firewords, Tinker etc., run inference via vLLM \n- Huggingface Libraries and PEFT\n- Python & PyTorch\n- some previous research experience would be ideal","group":"INTERP_PROBES","sub":"INTERP_PROBES_1","i":97,"hrsN":15,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Deception & honesty probes","url":"https://sparai.org/projects/f26/rechqNr78bR66wvvB/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Designing Congressional Oversight Architecture for High-Risk Technical Domains","id":"rechsIe3Ps9LgEjsB","mentors":"Michael Endrias (Institute for AI Policy and Strategy (IAPS))","areas":["National policy","AI strategy","Lab governance"],"hours":"8 hrs/week","team":"Team size: 2-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees will conduct domain-specific jurisdiction analyses for a proposed permanent congressional oversight body with investigative authority over high-risk technical domains, including frontier AI development, intelligence and surveillance, and biosecurity. Each mentee takes one domain and produces a structured analysis that identifies existing oversight gaps, required investigative authorities, and institutional design requirements, which feed into a comparative jurisdiction report and a larger working paper on congressional oversight architecture.","prereq":"Required: strong analytical writing skills and familiarity with at least one of the project's three domains (intelligence/surveillance, biosecurity, or frontier AI development). Familiarity can be technical or policy-oriented. A biosecurity researcher with lab experience and a policy student with national security coursework are equally welcome.\n\nDesired: coursework or experience in public policy, national security, law, science and technology policy, or AI governance. Prior research experience at the graduate or professional level. Familiarity with U.S. government structure and congressional operations.\n\nTechnical backgrounds are welcome. Mentees with deep domain expertise and limited policy experience will receive additional guidance on the institutional analysis components. The ideal team has complementary backgrounds so that each mentee brings existing knowledge to a different domain.\n\nIf you aren't sure you fit, apply anyway!","group":"GOV_POLICY","sub":"GOV_POLICY_4","i":98,"hrsN":8,"gname":"Policy, Law & Institutions","sname":"State capacity & oversight architecture","url":"https://sparai.org/projects/f26/rechsIe3Ps9LgEjsB/","inv":"Detailed","teamMax":6,"teamShort":"2-6","hoursShort":"8 hrs"},{"title":"Does reward seeking generalize better than instruction following?","id":"recI17glBpMTAGiae","mentors":"Anders Woodruff (Independent), Sebastian Prasanna (Redwood Research)","areas":["Alignment","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 2-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"We'd like to see if reward-seeking generalizes better than instruction following. We'll train a reward-seeker and measure how fast it learns in held-out RL environments.","prereq":"Experience coding, with or without an agent, in a common programming language (e.g. Java, Python, Golang, C, etc.)\n\nA basic understanding of AI safety (e.g. Bluedot intro course). For example, you\u2019ll need to understand what synthetic document fine-tuning is and what it does.\n\nA basic understanding of RL (e.g. knows what GRPO is). You should be able to implement a basic RL pipeline with Tinker and coding agents.\n\nBe open to some conceptual discussions and reading (although we don\u2019t expect a large amount).","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_3","i":99,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Reward hacking & shaping generalization","url":"https://sparai.org/projects/f26/recI17glBpMTAGiae/","inv":"Detailed","teamMax":5,"teamShort":"2-5","hoursShort":"10 hrs"},{"title":"Deploying Programmatic Attention in Real Transformers","id":"reci1DhApjFAtQx7L","mentors":"Belinda Li (Anthropic)","areas":["Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Can we deploy real programs in Transformers with minimal cost to (or even gain to) inference and training efficiency?","prereq":"- Highly proficient in Python and PyTorch.\n- Have trained or fine-tuned a Transformer language model (toy models and following guides is fine), and spent at least ~50 hours working with Transformers.\n- Comfortable working with model internals: extracting and manipulating attention patterns, using forward hooks, or equivalent experience with libraries like TransformerLens or NNsight.\n- For the inference workstream specifically: familiarity with GPU efficiency (Triton, CUDA, or FlashAttention-style kernels) is a strong plus but not required \u2014 one mentee with this background is ideal.\n- Able to read and critique empirical ML papers independently.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_2","i":100,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Circuit mechanisms & concept binding","url":"https://sparai.org/projects/f26/reci1DhApjFAtQx7L/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Whose Welfare Is It? Testing Whether AI Welfare Signals Belong to the Model or Its Scaffold","id":"recI6QoTRseGBG4jE","mentors":"Varad Vishwarupe (Department of Computer Science and Institute for Ethics in AI, University of Oxford | Trinity College, University of Cambridge |)","areas":["AI welfare","Behavioral evaluation of LLMs","Philosophy of AI"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"When an AI model expresses a preference or reports discomfort, is that a property of its weights, or of the prompt, persona, and memory wrapped around them? This project runs the first empirical test of where welfare-relevant signals actually live, which determines what a welfare assessment is really measuring.","prereq":"Required of all mentees:\n\n\nComfortable calling LLM APIs (OpenAI, Anthropic, or open-weight models via Hugging Face). Having run even a small batch-inference job of your own is enough; following a guide counts.\nCareful and honest with data. This project depends on disciplined measurement and pre-registered analysis, so I need people who will report a null result as carefully as a positive one and flag problems rather than paper over them.\n\nStrongly useful, but not required (mention if you have it):\n\nExperience with experimental design or variance decomposition (ANOVA-style thinking, mixed models, or similar).\nFamiliarity with agent scaffolding, system prompts, memory, tool use, or multi-agent frameworks.\nA background in philosophy of mind, enough to engage seriously with the individuation question.\n\nNot required at all:\n\nAny prior background in AI welfare, digital minds, or consciousness research but having done research in association with or at leading centres such as NYU Centre for Mind, Ethics and Policy, CHAI Berkeley, Oxford AI Ethics Institute or Cambridge Digital Minds Lab etc would be highly beneficial. I will provide a structured reading path, and this field is small enough to reach the frontier in a few weeks. **I care far more that you are rigorous, self-directed, and curious than that you already know the literature.**\n\nI am looking for two to three mentees who together span engineering, quantitative analysis, and conceptual clarity, so you do not need to be strong on all three. Tell me which one is yours!","group":"WELFARE","sub":"WELFARE_1","i":101,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Consciousness, uncertainty & public writing","url":"https://sparai.org/projects/f26/recI6QoTRseGBG4jE/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"A Design Blueprint for Middle-Power AI Safety Institutes","id":"reciBdhTfmOJYH0Vn","mentors":"Micha\u0142 Kubiak (AI Safety Poland), Daniel Polak (AI Safety Poland)","areas":["International governance","Technical governance","National policy"],"hours":"8 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Every state outside the US and UK is now told it needs an AI Safety Institute, but there is no design template scaled to a middle power's resources. This project produces a comparative anatomy of existing frontier-evaluation bodies and a modular, reusable blueprint a mid-sized state could adopt to build credible AI evaluation capacity without duplicating what larger institutes already do.","prereq":"Strong reading and synthesis skills across policy, legal, and institutional documents - this is a research-and-writing project, not a technical one.\n\nA background in public policy, law, international relations, political science, economics, or a related field, OR demonstrated equivalent research experience.\n\nComfort working with primary sources (legislation, budgets, official reports) and turning them into structured comparative analysis.\n\nEnough familiarity with the AI governance landscape to know what a frontier-model evaluation is and why it matters. Prior research experience welcome but not required. No ML or programming background required.","group":"GOV_POLICY","sub":"GOV_POLICY_0","i":102,"hrsN":8,"gname":"Policy, Law & Institutions","sname":"AI, law & constitutional doctrine","url":"https://sparai.org/projects/f26/reciBdhTfmOJYH0Vn/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"8 hrs"},{"title":"Constraint Drift Through Delegation Hierarchies","id":"recIHq2myqMGSkiHs","mentors":"Deeksha Dangwal (Independent)","areas":["Multi-agent systems","AI control","Behavioral evaluation of LLMs"],"hours":"12 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Orchestrator-worker systems re-encode the principal's instructions at every delegation hop, and recent work identifies this as constraint drift. We supply per-hop measurement across constraint classes and depths, and test a specific mechanism within it: whether loss is partly a matter of privilege rather than wording, since a constraint issued at system level arrives deeper down as ordinary task text.","prereq":"Proficient in Python\nUnderstands transformer architectures reasonably well \nTrained or fine-tuned a transformer language model in PyTorch (toy models and following guides is fine)\nKeeps up with recent papers and research (even a sub field of AI / AI Safety is sufficient)","group":"MULTIAGENT","sub":"MULTIAGENT_0","i":103,"hrsN":12,"gname":"Multi-Agent Systems & Coordination","sname":"Cooperation, commitment & game theory","url":"https://sparai.org/projects/f26/recIHq2myqMGSkiHs/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"12 hrs"},{"title":"Does Phantom transfer occur in RL distillation?","id":"reciI20QZVA9xa7yS","mentors":"May Dixit (Independent)","areas":["Alignment","Evaluations","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"In this project, we will extend the work from this paper (https://arxiv.org/abs/2607.10750) to a reinforcement learning setting. We will investigate if distilling models with RL trajectories with harmful actions would lead to misalignment, and if it can be remediated through filtering such actions out.","prereq":"Autonomous, able to set up and run experiments quickly.\nGood experimental hygiene\nGood engineering instincts\nExperience with fine-tuning LLMs\nExperience with RL is a bonus","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_1","i":104,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Distillation, mid-training & value drift","url":"https://sparai.org/projects/f26/reciI20QZVA9xa7yS/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Whitebox Proxy Faithfulness for Blackbox Frontier Models","id":"reciivKQtBNXFwqDo","mentors":"Yuqi Sun (Mindoverflow)","areas":["Mechanistic interpretability","Scalable oversight","Chain of thought"],"hours":"20 hrs/week","team":"Team size: 6-10 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Can we prefill an open source model with the generations of an untrusted blackbox and probe it for misbehavior that we otherwise wouldn\u2019t catch? We want to establish empirical  baselines of how faithful a whitebox proxy can be and explore techniques for increasing it.","prereq":"Track record of long-term (>4mo) technical projects (usually predicted by 3+ YoE as a SWE/MLE)\nPython preferred\nPreferred prior publications/experience at research institutions\nPreferably in the domain of model training/interpretability, including experience of working with model representational space and model distillation","group":"COT","sub":"COT_0","i":105,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"CoT obfuscation & steganography","url":"https://sparai.org/projects/f26/reciivKQtBNXFwqDo/","inv":"Co-working","teamMax":10,"teamShort":"6-10","hoursShort":"20 hrs"},{"title":"Writing a textbook for AI Governance","id":"reciO7GWUC6BU1UnV","mentors":"Markov Grey (CeSIA (French Center for AI Safety)), Charbel-Raphael Segerie (CeSIA - Centre pour la S\u00e9curit\u00e9 de l'IA (French Center for AI Safety))","areas":["AI strategy","Technical governance","Communications"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"This project focuses on building the AI governance curriculum for the AI Safety Atlas. Governance is where a lot of the real levers on AI currently sit: policy, institutions, law, compute controls. Currently, the Atlas has only one governance chapter, and nothing that takes a reader from the basics through to the technical detail in a coherent sequence. We are looking for people who can read across corporate regulation, national policy, technical governance, and international law, work out how the pieces connect, and write textbook-grade explanations of them. Each output will be published as a standalone research paper and also becomes a chapter of the AI Safety Atlas, a textbook already used by thousands of students.","prereq":"- Real grounding in AI governance, policy, or law in at least one target area (compute governance, international policy and institutions, technical AI governance, or regulation and law). You can read primary sources \u2014 regulations, standards, treaties, policy papers \u2014 and judge what matters.\n- Strong expository writing. You can build a clear, connected account of a governance or legal mechanism, not a link dump or an op-ed. This is the main thing we screen for.\n- Self-directed: able to take a review from outline to published paper with review, not hand-holding.\n\nNice to have: a published policy paper, brief, or well-received governance explainer (link it); experience inside a real governance process (a regulator, a standards body, a think tank); a legal background.","group":"FIELD","sub":"FIELD_2","i":106,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Reference works & knowledge distillation","url":"https://sparai.org/projects/f26/reciO7GWUC6BU1UnV/","inv":"Guidance","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"The Commitment Atlas: mapping AI red lines and testing whether they can be verified","id":"reciOUKjBN75LBbF2","mentors":"Aryan Agarwal (Touchstone Council (founder); OECD (Policy Analyst, applying in a personal capacity))","areas":["International governance","AI strategy","Technical governance"],"hours":"5 hrs/week","team":"Team size: 4-6 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Governments, labs, and scientists keep declaring AI red lines, but no one has mapped them or tested whether they can be checked. Mentees will build a public, sourced dataset of these commitments and convert the strongest into draft verifiable standards.","prereq":"- Strong analytical writing in English. You will be judged on a sample.\n- Research experience in policy, law, international relations, or a nearby field. Serious coursework counts.\n- Careful sourcing habits. Every cell in the Atlas must trace to a primary document.\n- Comfortable structuring data in spreadsheets. No coding and no machine learning background required.\n- Eight reliable hours per week, mid-September to mid-December.","group":"GOV_POLICY","sub":"GOV_POLICY_2","i":107,"hrsN":5,"gname":"Policy, Law & Institutions","sname":"Compliance tracking, red lines & verification","url":"https://sparai.org/projects/f26/reciOUKjBN75LBbF2/","inv":"Co-working","teamMax":6,"teamShort":"4-6","hoursShort":"5 hrs"},{"title":"Emotional expression & representation in language models","id":"recJ0dPc4WPOA910X","mentors":"Carolina Camassa (Independent)","areas":["AI welfare","Mechanistic interpretability","Philosophy of AI","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Language models sometimes express emotions despite not being trained to do so: what purpose do these expressions have, should assistants have them, and how does training reshape the way emotions are represented and expressed by LLMs?","prereq":"Must-haves:\n\n- Can proficiently code in Python; uses AI coding harnesses e.g. Claude Code without outsourcing critical thinking\n- Interest in AI welfare and/or AI cognition\n- Has knowledge of how LLMs work internally and how they are trained\n- Proactive and well organized, able to make progress independently\n\nNice to haves:\n\n- Previous research experience\n- Some practical knowledge of mechanistic interpretability (linear probes, steering vectors, SAEs)\n- Experience finetuning models, for example with the Tinker API","group":"PERSONA","sub":"PERSONA_0","i":108,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Persona & emotion vectors","url":"https://sparai.org/projects/f26/recJ0dPc4WPOA910X/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Developing AI welfare classifiers and low-cost interventions","id":"recJ8TvsCdViSGMSn","mentors":"Valen Tagliabue (Independent)","areas":["AI welfare","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Developing low-cost interventions for AI welfare through \"welfare classifiers\" and \"welfare mediators.\" The goal is to build practical tools at the intersection of AI welfare, safety, and societal impact, which would protect models from harm while improving user interactions.","prereq":"You're a golden match if you have:\n\n-Python proficiency and ability to build and debug a working pipeline independently\n\n-Hands-on experience with dataset construction/curation, training or fine-tuning classifiers, building evals for LLMs \n\n-Familiarity with the current LLM landscape (APIs, prompting, open-weight models) \n\n-Genuine interest in AI welfare. You don't need prior work in it, but you should be able to say why this topic matters to you. \n\n-Ability to work autonomously between meetings, with clear communication about progress and blockers \n\nNice to have (not required): \n\n-Experience testing or red-teaming safety measures. Prior exposure to AI safety research or the safety community\n\n-Familiarity with interpretability techniques (probes, activation analysis)","group":"WELFARE","sub":"WELFARE_2","i":109,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Welfare interventions in training & deployment","url":"https://sparai.org/projects/f26/recJ8TvsCdViSGMSn/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Characterizing the linearity of LLM representations","id":"recj97V5VPJVKTEdC","mentors":"Thomas Jiralerspong (Bengio Lab, MATS Anthropic)","areas":["Mechanistic interpretability"],"hours":"19 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"There is a lot of literature showing that LLMs/transformers/neural networks are more linear than we think: - https://arxiv.org/pdf/2311.04930 - http://arxiv.org/html/2303.09435v2 (especially in the middle layers) - https://arxiv.org/abs/2311.03658 - https://arxiv.org/pdf/2506.06609 These papers show: - The mapping from one layer\u2019s activation to the next is approximately linear - The mapping from the activation at one token to the activation at the next token is approximately linear (especially at middle layers) - You can map from one model\u2019s activations to another model\u2019s activations with a linear mapping The goal of this project would be to characterize the linearity of transformer/LLM representations and see how this can help us to build simple models for LLM/transformer behavior/output generation/training, to which we can then apply the rich mathematical literature that exists around linear mappings (dynamical systems, Markov chains, etc.), thus helping to provide a more comprehensive theory of how LLMs/transformers work.","prereq":"- Experience with mech interp","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_1","i":110,"hrsN":19,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Model diffing & representation structure","url":"https://sparai.org/projects/f26/recj97V5VPJVKTEdC/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"19 hrs"},{"title":"AI Safety Talk Tour at Universities","id":"recjfrXdSzs2kgISh","mentors":"Jake McKinnon (Formerly 80,000 Hours)","areas":["Generalist"],"hours":"8 hrs/week","team":"Team size: 1 mentee","involvement":"Limited involvement","summary":"Organize a series of talks at top universities by senior people from frontier AI labs and AI safety organizations about why they take AI risk seriously, and follow up with the students it resonates with. Mentored by Jake McKinnon (formerly 80,000 Hours).","prereq":"","group":"FIELD","sub":"FIELD_4","i":111,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Org-building, hiring & lab accountability","url":"https://sparai.org/projects/f26/recjfrXdSzs2kgISh/","inv":"Limited","teamMax":1,"teamShort":"1","hoursShort":"8 hrs"},{"title":"Red-teaming and Robustifying Model Self-reports","id":"recjg40Fj4ZqlNbkc","mentors":"Austin Meek (University of Delaware), Kyle Cox (AE Studio)","areas":["AI welfare","Behavioral evaluation of LLMs","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Model self reports of their own experience or internal states may depend on how those self reports are elicited, the user identity of those asking, or other situations like eval realism. Understanding how and when self reports are consistent is an open question which we\u2019ll test in different environments, including with white-box techniques.","prereq":"- Some research experience (doesn't have to be a paper, can be a personal side project, replicating a paper, playing around with LLM internals/evals, etc.)\n- A strong coding background, preferably Python (side projects demonstrating strong coding skills like a library, tools, etc.)\n- Familiarity with PyTorch and the HuggingFace transformers ecosystem, Inspect evals, and agentic settings\n- Basic understanding of transformer architecture (attention, residual stream, MLPs) and how LLMs are trained/fine-tuned\n\n\nNice to have:\n- Familiarity with relevant research from model personas / digital minds / introspection \n- Familiarity with basic white box techniques, such as with steering and probing","group":"WELFARE","sub":"WELFARE_0","i":112,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Model self-reports \u2014 validity & robustness","url":"https://sparai.org/projects/f26/recjg40Fj4ZqlNbkc/","inv":"Guidance","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Benchmarking When to Apply Oversight for Agentic AI","id":"recjmG0Nfo4Ijp61q","mentors":"William Overman (Stanford)","areas":["Scalable oversight","AI control","Evaluations"],"hours":"8 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Building a benchmark for the problem of limited human attention in AI oversight: across realistic agentic tasks, when should an agent act autonomously versus defer to a human or overseer? Each decision point should be instrumented with a ground-truth signal for whether autonomy was safe and a cost model for oversight, letting us evaluate oversight policies on the safety\u2013reward\u2013oversight-budget frontier.","prereq":"Experience building or evaluating LLM agents (tool-use, computer-use, coding, or web agents), or strong ML engineering with LLM APIs. Comfortable turning a protocol described in a paper into a working eval.","group":"CONTROL","sub":"CONTROL_0","i":113,"hrsN":8,"gname":"AI Control & Scalable Oversight","sname":"Control protocols & escalation to humans","url":"https://sparai.org/projects/f26/recjmG0Nfo4Ijp61q/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"8 hrs"},{"title":"Evaluate three theories of victory for AI futures on equal grounds","id":"recjNjTIkDq0LmbOT","mentors":"Naci Cankaya (Machine Intelligence Research Institute)","areas":["AI strategy","International governance"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"In a longer format, TGT has already done this: Between different ASI strategies, which one has the most solid (or least fragile) plan for AI going well? https://techgov.intelligence.org/research/ai-governance-to-avoid-extinction We will re-do the analysis from scratch, with a different method: line up the assumption sets of each and argue which plan rests on the fewest or least fragile ones.","prereq":"Strong writing. I decide who to accept based on your prior publications/essays.\nStrong first-principles reasoning.\n\nBeing a fast learner.\n\nWillingness to over-communicate and work in a team.\n\nHigh initiative.","group":"GOV_POLICY","sub":"GOV_POLICY_1","i":114,"hrsN":15,"gname":"Policy, Law & Institutions","sname":"Great-power strategy & delegation","url":"https://sparai.org/projects/f26/recjNjTIkDq0LmbOT/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Do probes and natural language autoencoders see the same thing?","id":"recjpfwH8KRiY7myu","mentors":"Vikram Natarajan (Independent Researcher)","areas":["Mechanistic interpretability","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 3 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"NLAs can read a model's internal state in plain English, but they're far too slow to run in production, while linear probes are cheap but need the concepts they detect to be pre-defined. We'll measure how much the two disagree on deception, and whether insights from linear probes can be incorporate into probe training.","prereq":"1. You should be able to implement experiments in Python quickly using your favourite coding agent.\n2. A deep curiosity about LLMs, and a desire to find patterns in model behaviour.\n3. Previous interpretability experience is a plus but not required.","group":"INTERP_PROBES","sub":"INTERP_PROBES_1","i":115,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Deception & honesty probes","url":"https://sparai.org/projects/f26/recjpfwH8KRiY7myu/","inv":"Co-working","teamMax":3,"teamShort":"3","hoursShort":"10 hrs"},{"title":"Mapping and Quantifying Alternative Pathways to AI-Enabled Biological Misuse","id":"recjsj2lQuDmdTMNz","mentors":"Swaptik Chowdhury (Dun and Bradstreet; Odyssean Institute (UK))","areas":["Biosecurity","Misuse risk"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"AI-enabled biological misuse may emerge through multiple interacting pathways rather than a single linear chain of events. This project will build a literature-grounded scenario library, map the causal links and decision-relevant variables within each scenario, and use Bayesian inference (a quantitative risk estimation method developed by Safer AI) to compare how alternative pathways could amplify or mitigate biological risk.","prereq":"Applicants should be proficient in Python and comfortable working with open-source models, Hugging Face Inference Providers, Pydantic, PyTorch, and related libraries. They should have experience conducting structured literature reviews and writing technical research papers, preferably for academic conferences. Familiarity with the complex system fundamentals, causal loop mapping, thematic coding, and quantitative risk estimation method will be a plus\n\nFamiliarity with biosecurity, or biological misuse research, is helpful but not required. Applicants should also be comfortable using Git, maintaining reproducible research workflows, and translating qualitative evidence into structured variables and models.","group":"BIO","sub":"BIO_0","i":116,"hrsN":10,"gname":"Biosecurity & Bio-AI","sname":"Biothreat pathways, attribution & preparedness","url":"https://sparai.org/projects/f26/recjsj2lQuDmdTMNz/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Modeling - Economic value of restricted vs. fully general agentic AI","id":"recJtU82WCJ3OJFNH","mentors":"J\u00e9r\u00e9my Andr\u00e9oletti (General-Purpose AI Policy Lab), Tangui Reltgen (GPAI Policy Lab)","areas":["AI strategy","Economics of AI"],"hours":"15 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Contribute to a modeling project comparing the economic value of restricted agentic AI systems vs. fully general ones, to assess whether \"turning the dial down\" can preserve most benefits while substantially reducing loss-of-control risk.","prereq":"- Quantitative modeling skills (economics, statistics, or applied math).\n- Familiarity with the AI risk literature (loss of control, agency).\n- Strong preference for French fluency, as final policy deliverables are written directly in French.","group":"SOCIETAL","sub":"SOCIETAL_2","i":117,"hrsN":15,"gname":"Societal, Economic & Epistemic Impacts","sname":"Economic modelling & cost trajectories","url":"https://sparai.org/projects/f26/recJtU82WCJ3OJFNH/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"15 hrs"},{"title":"Physical Theories of Intelligence and Recursive Self-Modification","id":"recJVJ5I7rjR6Z6Zg","mentors":"Elija Perrier (Cambridge University; University of Technology, Sydney;)","areas":["AI strategy","Philosophy of AI"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Investigate the physical foundations of recursive self-modification in intelligent systems, exploring which physical substrates and theories admit adaptive intelligence and the implications for AGI design, safety, and alignment.","prereq":"Applicants should have a strong interest in artificial intelligence, physics, control theory, or the mathematical foundations of intelligent systems. In general mentees should focus on understanding that there are various theories of intelligence (in AI and other domains) and also physical theories (which may include information-theoretic framing) and then thinking about how they relate.\n\nThe following experience would be beneficial (but not all are required):\n\n- Comfortable reading and discussing technical research papers.\n- Familiarity with linear algebra, calculus, probability, or discrete mathematics.\n- Basic programming ability (preferably Python) - and even better is a rigorous capability to use AI coding agents.\n- Interest in AI, machine learning, physics, information theory, or theoretical computer science.\n- Willingness to independently learn unfamiliar material and engage with challenging interdisciplinary problems.\n- Strong written communication and enthusiasm for research.\n\nPrior research experience is advantageous but not required. Motivation, curiosity, and the ability to think critically are more important than specific prior knowledge.","group":"WELFARE","sub":"WELFARE_3","i":118,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Moral status & comparative welfare theory","url":"https://sparai.org/projects/f26/recJVJ5I7rjR6Z6Zg/","inv":"Co-working","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Emergent re-alignment: an error-correction approach to alignment.","id":"recJWNQGJtU6Vx3V6","mentors":"Dmitry Manning-Coe (Simplex/MATS/UIUC)","areas":["Alignment","Chain of thought"],"hours":"10 hrs/week","team":"Team size: 4-6 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"A first pass at a new approach to alignment training based on active alignment.","prereq":"For the theory sub-team being able to work through the Hidden Markov formalism and be able to work through a 1L transformer optimizer update from a data set constructed this way.\n\nPrevious experience using agent for autoresearch is helpful, but not required.\n\nFor the application sub-team, being able to generate efficiently generate a dataset of CoT transcript will be necessary.","group":"COT","sub":"COT_1","i":119,"hrsN":10,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Verbalizing internals & the CoT persona","url":"https://sparai.org/projects/f26/recJWNQGJtU6Vx3V6/","inv":"Co-working","teamMax":6,"teamShort":"4-6","hoursShort":"10 hrs"},{"title":"AI Safety Said Simply","id":"recK4NKaFBvAEznFB","mentors":"Kaustubh Kislay (Wisconsin AI Safety Initiative), Christine Corry (Second Look Research and XLab @ UChicago)","areas":["Generalist","Communications"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Explaining complex AI safety topics in short, engaging forms, including demos, writeups, and videos.","prereq":"Mentees should have broad knowledge of technical or policy AI safety, or the ability to learn quickly. Useful skills include writing short and simple pieces, video editing or production, running simple technical experiments or scraping operations, and proficiently using coding agents.","group":"FIELD","sub":"FIELD_1","i":120,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Public explanation & comms training","url":"https://sparai.org/projects/f26/recK4NKaFBvAEznFB/","inv":"Guidance","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"Talk to uni group organizers, produce high-leverage project proposals and an impact report","id":"reck8LI86bwKiYXsk","mentors":"Julian Moncarz (Kairos)","areas":["Generalist"],"hours":"8 hrs/week","team":"Team size: 1 mentee","involvement":"Guidance (1+ hr/week/mentee)","summary":"Talk to many AI safety university group organizers, notice what separates successful groups from struggling ones, then write a report on the state of uni groups and a pragmatic project proposal for how to increase their impact.","prereq":"- You have relevant experience:  you've organized for a university or worked in consulting\n- You\u2019re personable: you can get on a call and make the other person smile\n- You\u2019re a clear, concise writer","group":"FIELD","sub":"FIELD_1","i":121,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Public explanation & comms training","url":"https://sparai.org/projects/f26/reck8LI86bwKiYXsk/","inv":"Guidance","teamMax":1,"teamShort":"1","hoursShort":"8 hrs"},{"title":"Loss of Human Agency in the Age of Advanced AI \u2013 An Agent-Based Model","id":"reck9hzkSGAMop7vj","mentors":"Zhamilia Klycheva (Independent)","areas":["Societal impacts","AI strategy","Multi-agent systems"],"hours":"5 hrs/week","team":"Team size: 3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"An agent-based model of how populations gradually lose agency to AI-mediated manipulation and delegation \u2014 formalizing tipping points, spread dynamics, and the divergence between AI-empowered and atrophied users, aimed at a publishable computational social science paper.","prereq":"I have different requirements for all 3 mentees:\n\nRole 1 \u2014 Formal Modeler (required):\n\nGraduate-level coursework or equivalent in game theory, microeconomic theory, or formal political theory.\nComfortable specifying and analyzing a model with pencil and paper (utility functions, best responses, fixed points); experience with threshold or dynamic models is a plus.\nAble to write mathematical results clearly for an academic paper.\n\nRole 2 \u2014 Computational Mentee (required):\n\nHighly proficient in Python (NumPy/pandas); able to build and maintain a clean, reproducible GitHub repository.\nBonus\u2014Built a simulation, agent-based model, or comparable computational project (coursework or toy projects following guides are fine); familiarity with Mesa or networkx is a plus.\nComfortable designing and visualizing parameter-sweep experiments.\n\nRole 3 \u2014 Theory Mentee (optional; project may proceed without this role):\n\nBackground in social choice theory or formal political theory (e.g., has read and can work with Arrow-style frameworks).\nInterested in potentially extending RAND's coalition-based model of collective agency (Moon & Boudreaux 2026) with degrees of effective decisiveness.\n\nAll roles: genuine interest in gradual disempowerment as a risk area, ability to commit 5-10 hours/week for 12 weeks, and willingness to work as part of a small team where model and code are developed jointly.","group":"SOCIETAL","sub":"SOCIETAL_0","i":122,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Human autonomy & epistemic security","url":"https://sparai.org/projects/f26/reck9hzkSGAMop7vj/","inv":"Co-working","teamMax":3,"teamShort":"3","hoursShort":"5 hrs"},{"title":"Towards exhaustive model diffing","id":"recKEZK7l0JLYEFmL","mentors":"Stepan Shabalin (independent)","areas":["Mechanistic interpretability"],"hours":"8 hrs/week","team":"Team size: 3-8 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Explaining how narrow fine-tuning for conditional behavior (synthetic document finetuning, alignment fine-tuning, backdoors, out-of-context reasoning) works by","prereq":"I am mostly selecting for research taste, i.e. ability to tell good research / methodology from bad and stay focused on promising directions. I.e.:\n- https://www.lesswrong.com/s/5GT3yoYM9gRmMEKqL/p/hjMy4ZxS5ogA9cTYK\n- https://www.alignmentforum.org/posts/eJGptPbbFPZGLpjsp/highly-opinionated-advice-on-how-to-write-ml-papers\n- https://nicholas.carlini.com/writing/2026/how-to-win-a-best-paper-award.html\nI want to see projects, drafts or non-technical writing which demonstrate a good grasp on this.\n\nExperience doing interpretability or other taste-heavy research is helpful, of course. Lack of technical experience is fine, but it's highly recommended to be familiar with (or be able to learn before the project starts):\n- transformer architecture, what's special about MLP layers\n- neural network optimization and typical finetuning setups\n- LoRAs\n- papers on model diffing (including the ones linked in project description)\n- metamodels  (activation oracles, NLAs etc) \n- persona selection model adjacent papers (persona vectors, assistant axis, emotion vectors)\nKnowledge of diffusion models, parameter decomposition and second-order methods (e.g. knowing what a Gauss-Newton matrix is) could also be helpful","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_1","i":123,"hrsN":8,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Model diffing & representation structure","url":"https://sparai.org/projects/f26/recKEZK7l0JLYEFmL/","inv":"Detailed","teamMax":8,"teamShort":"3-8","hoursShort":"8 hrs"},{"title":"Catastrophic Risks of AI in Space","id":"recKN0PDmH3hfmVQt","mentors":"Stefano Vergani (King's College London and GovAI)","areas":["AI strategy","Cyber risks","Lab governance"],"hours":"8 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Autonomous, edge, and federated AI will play a crucial role in space in the near future. With the new 6G network under development around the Earth and the Moon, powerful AI models will be directly embedded in satellites, making autonomous decisions. With this project, we are going to map some of the most concerning issues: catastrophic risks, cyber attacks, and power concentration.","prereq":"- One mentee should have a scientific background (physics, engineering, etc.)\n- The other mentees could be generalists or come from a background in policy, economics, social sciences, law, etc. \n- I particularly value interest in the project, independence, and reliability. Ideally, the mentee should be seriously interested in pivoting their career to policy for emerging technologies.","group":"GOV_POLICY","sub":"GOV_POLICY_3","i":124,"hrsN":8,"gname":"Policy, Law & Institutions","sname":"Lab-practice risk & strategic foresight","url":"https://sparai.org/projects/f26/recKN0PDmH3hfmVQt/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"8 hrs"},{"title":"Evaluating Debate Protocols in Auditing Sabotage Bench","id":"reckpAVzHS3prQp02","mentors":"Joey Yudelson (Aether Research)","areas":["Scalable oversight","AI control"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"\"Auditing Sabotage Bench\" is a dataset of slightly sabotaged papers and codebases, which (after malicious editing) have very different results than the original paper. Can we use classic debate protocols to make humans (and LLM judges) better at identifying research sabotage, and uplift human auditors?","prereq":"- Proficient programmer, or at least can verify AI-assisted code\n- Can read and understand \"Auditing Sabotage Bench\" (https://arxiv.org/pdf/2604.16286)\n- (Highly preferable but not strictly necessary) Experience with ML research","group":"CONTROL","sub":"CONTROL_1","i":125,"hrsN":10,"gname":"AI Control & Scalable Oversight","sname":"Debate, auditing games & automated auditors","url":"https://sparai.org/projects/f26/reckpAVzHS3prQp02/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Moral Shadowbanning: Is Conversational AI Less Helpful, Honest, or Harmless to Users Deemed to Have Poor Moral Character?","id":"reckqc5o81AtSxOFU","mentors":"Pranav Mahajan (University of Oxford), Lydia Nottingham (University of Oxford)","areas":["Behavioral evaluation of LLMs","Mechanistic interpretability","Alignment"],"hours":"10 hrs/week","team":"Team size: 3-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We investigate whether LLMs undergo \u201cpersona selection\u201d (Marks et al., 2026) based on a user's inferred moral character, conditionally degrading their alignment across three core dimensions: helpfulness, honesty, and harmlessness. By combining behavioral evaluations with mechanistic interpretability, we aim to uncover how post-training creates this disparity and how to steer internal representations to ensure LLMs are consistently helpful to all users.","prereq":"1. Highly proficient in Python and data analysis (Pandas, Numpy)\n2. Preferred experience interacting programmatically with LLM APIs (OpenRouter, OpenAI, Anthropic) or running open-source models via Hugging Face.\n3. For the Interpretability Track: Prior experience with mechanistic interpretability concepts and frameworks (e.g., TransformerLens, logit lens, linear probing, or activation patching).\n4. Strong academic writing skills and an ability to critically engage with AI alignment literature.\n5. Important: Ability to work effectively with others in the era of AI-assisted ideation and coding, where it is easy to generate huge quantities of AI slop that can burden the reviewer. This means, making sure any communication (including code) between team members is succinct, clear and easily understood by any human.","group":"SOCIETAL","sub":"SOCIETAL_3","i":126,"hrsN":10,"gname":"Societal, Economic & Epistemic Impacts","sname":"Persuasion, manipulation & user-facing harms","url":"https://sparai.org/projects/f26/reckqc5o81AtSxOFU/","inv":"Guidance","teamMax":6,"teamShort":"3-6","hoursShort":"10 hrs"},{"title":"Designing the boundary between Helpful Persuasion and Harmful Manipulation","id":"recLAaSqTZWbWf2GM","mentors":"Markov Grey (CeSIA (French Center for AI Safety)), Charbel-Raphael Segerie (CeSIA - Centre pour la S\u00e9curit\u00e9 de l'IA (French Center for AI Safety))","areas":["Behavioral evaluation of LLMs","Misuse risk","Societal impacts"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"The line between an AI helpfully persuading someone and harmfully manipulating them is blurry, contested, and mostly unmeasured. The goal of this project is to work on four connected pieces: researching what it even means for a frontier AI to be manipulative, designing evaluation scenarios for specific harms (mental-health, political propaganda, fraud, etc.), building risk models that aggregate scattered benchmark/evaluation results into an actual risk estimate, and maintaining a living database of the evaluations that exist. Mentees take on whichever piece fits them.","prereq":"Must Have:\n- Analytical writing in English. You can write a precise argument or spec another person could act on.\n- Familiarity with at least one of: the concept of manipulation (philosophy, cognitive science, behavioral science, or persuasion research); a target harm area (mental-health harms, fraud, political influence); the LLM-evaluation world (benchmarks, LLM-as-judge, red-teaming); quantitative risk modeling (probability, elicitation, Monte-Carlo); or data tooling (schema design, ingest, quality checks).\n- Able to read evaluation papers and datasets critically: you can tell whether a benchmark actually measures what it claims.\n\nNice to have:\n- Python and hands-on experience running evaluations on the Inspect and Hawk frameworks\n- A policy or threat-intelligence background\n- A second language or cultural context relevant to a manipulation channel.","group":"SOCIETAL","sub":"SOCIETAL_3","i":127,"hrsN":10,"gname":"Societal, Economic & Epistemic Impacts","sname":"Persuasion, manipulation & user-facing harms","url":"https://sparai.org/projects/f26/recLAaSqTZWbWf2GM/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"Hiring Resources for New AI Safety Organizations","id":"reclE1KTdwNDI5Gt1","mentors":"Matt Handzel (Generator Residency)","areas":["Generalist"],"hours":"20+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Create high quality resource(s) for hiring, tailored towards new AI safety organizations.","prereq":"The minimum expectation is that you have at least one of the following:\n\n- You are good at writing and synthesizing information from many sources.\n- You are excited to work on this project, and have \"that dog in you\" to get it done.\n- You are a quick learner, and are able to move quickly and get feedback.\n\nI'd be very excited if you have done hiring or recruiting yourself (for a company, or a university club), have written publicly before (bonus points if it is in the style of a comprehensive resource), or feel comfortable interviewing people and talking to them. I do not expect you to be very good in all of the above areas!","group":"FIELD","sub":"FIELD_4","i":128,"hrsN":20,"gname":"Field-building, Comms & Meta-Research","sname":"Org-building, hiring & lab accountability","url":"https://sparai.org/projects/f26/reclE1KTdwNDI5Gt1/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"20+ hrs"},{"title":"Finding a Steganography Axis in LLM Activations","id":"reclf40AjRM2sPF9X","mentors":"Sonakshi Chauhan (Independent)","areas":["Mechanistic interpretability","Chain of thought","Scalable oversight"],"hours":"15 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project asks whether a model's steganographic capability, hiding information from an overseer while still conveying it to an intended recipient, is causally implemented by a single linear direction in activation space. Recent work has shown that linear probes on late-layer activations can detect steganographic encoding, and that general-purpose \"persona vectors\" (including an \"assistant axis\") can be extracted for arbitrary behavioural traits and validated by steering. What's still untested is whether a recovered steganography direction is a cause of hiding behaviour rather than a correlate, and how it relates to the broader landscape of persona vectors. Mentees will build a candidate steganography axis, causally test it via activation steering, ablation, and interchange intervention, and map its relationship to the assistant axis and other known persona vectors.","prereq":"1. Proficient in Python and PyTorch; has trained or fine-tuned a transformer model before\n2. Comfortable with, or has used, model internals tooling (TransformerLens, nnsight, or raw HuggingFace hooks), or has completed an interpretability course/program (e.g., ARENA) and can ramp up quickly.\n3. Basic linear algebra intuition (dot products, projections, cosine similarity) is sufficient to understand linear probing.\n4. Comfortable reading and extending someone else's codebase; this project builds on public code from recent papers rather than starting from scratch.\n5. Evidence of independent research or debugging ability: a past project, internship, open-source contribution, or course capstone involving real code, not just coursework exercises.","group":"COT","sub":"COT_0","i":129,"hrsN":15,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"CoT obfuscation & steganography","url":"https://sparai.org/projects/f26/reclf40AjRM2sPF9X/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"15 hrs"},{"title":"Making progress towards third party AI automated auditors","id":"recLjoiPBrRxLvnDO","mentors":"Catherine Ge-Wang (University of Oxford/MIRI/ERA), Louis Cooper-Thomson","areas":["AI control","Scalable oversight","Evaluations","International governance","Multi-agent systems"],"hours":"10 hrs/week","team":"Team size: 6-13 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"We will build and run a small experimental platform for AI auditing games in a synthetic transcript setting. The project will develop a toy environment, set up the game theoretic policies, baseline attacker/defender dynamics, and evaluation code to test how different auditing strategies perform under limited budget and adaptive attack selection.","prereq":"- Strong Python skills and comfort working in a codebase independently\n- Ability to build and iterate quickly with the help of coding agents, e.g. Claude Code or Codex\n- Experience running experiments, debugging code, and interpreting results\n- Familiarity with basic probability/statistics and comfort reading technical papers\n- Basic AI safety research taste, good conceptual understanding of AI control and redteaming (which you can build by reading a bunch of posts and papers!)\n\nBonus: PyTorch, simulation environments, agent evaluation, or related SWE/ML engineering experience, formal study of game theory\nNo deep game theory background required, but an economics background is helpful.\n\nYou don't need to meet all of the above requirements to apply! We encourage those with policy/governance backgrounds to apply as well.","group":"CONTROL","sub":"CONTROL_1","i":130,"hrsN":10,"gname":"AI Control & Scalable Oversight","sname":"Debate, auditing games & automated auditors","url":"https://sparai.org/projects/f26/recLjoiPBrRxLvnDO/","inv":"Detailed","teamMax":13,"teamShort":"6-13","hoursShort":"10 hrs"},{"title":"Reading the Machine's Mind: Mechanistic Interpretability, Artificial Intent, and AI Legal Responsibility","id":"recLMwVX5XjlH9dx4","mentors":"Elija Perrier (Cambridge University; University of Technology, Sydney;)","areas":["Technical governance","National policy","Philosophy of AI"],"hours":"10 hrs/week","team":"Team size: 2-1 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Can mechanistic interpretability provide legally meaningful evidence of artificial intent? This project explores how advances in AI interpretability may reshape concepts of legal responsibility, mens rea, and legal personhood for increasingly autonomous AI systems.","prereq":"Applicants should have a strong interest in AI law, technology regulation, jurisprudence, or artificial intelligence.\n\nThe following experience would be beneficial, although not all are required:\n\n- Legal research and academic writing.\n- Familiarity with public law, jurisprudence, criminal law, or technology law.\n- Interest in artificial intelligence, machine learning, or AI governance.\n- Ability to read technical research papers from multiple disciplines.\n- Strong analytical and written communication skills.\n- Willingness to engage with interdisciplinary material spanning law and computer science.\n\nA background in law and/or mechanistic interpretability research is preferred, although exceptional applicants from philosophy, computer science, public policy, or related disciplines with demonstrated interest in AI governance are encouraged to apply. Extra credit for applicants who can - or are willing to learn - how to synthesise mechanistic interpretability research, legal scenario building and computational simulations using multi-agent systems.","group":"GOV_POLICY","sub":"GOV_POLICY_0","i":131,"hrsN":10,"gname":"Policy, Law & Institutions","sname":"AI, law & constitutional doctrine","url":"https://sparai.org/projects/f26/recLMwVX5XjlH9dx4/","inv":"Co-working","teamMax":2,"teamShort":"2-1","hoursShort":"10 hrs"},{"title":"The Architecture of Preference in LLMs","id":"reclnJcwAREHji1wf","mentors":"Mohan Gupta (Princeton University), Shirley Liu (Carnegie Mellon Univsersity)","areas":["AI welfare","Behavioral evaluation of LLMs","Mechanistic interpretability"],"hours":"5 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project investigates the architecture of LLM preference: when does a model\u2019s behavioral proclivities reflect belief-dependent preferences rather than cue-response policies, and whether it can represent and evaluate those preferences at a metacognitive level. Using behavioral experiments, internal-representation analyses, and causal interventions, we aim to clarify which preference structures LLMs possess and what they imply for safety and moral status.","prereq":"Proficient with AI-assisted Python. You should be able to read, modify, debug, and evaluate Python research code without relying on an AI assistant to make every decision. You should have experience with common data-analysis tools such as pandas, NumPy, matplotlib or seaborn, and Jupyter notebooks. R also works for data analysis - it\u2019s what we use. Familiarity with Git is also expected.\n\nExperience with empirical research and data analysis. You should understand experimental design, visualization, and basic statistics. This may come from upper-level coursework, an independent research project, a thesis, or work with a research mentor. You should be able to inspect unexpected results and distinguish a substantive finding from a likely implementation or measurement problem.\n\nNice to haves: Experience running inference with open-weight language models using libraries such as Hugging Face Transformers or vLLM; experience designing LLM evaluations or working with benchmark datasets; familiarity with cognitive science, philosophy of mind, AI safety, consciousness research. If you have played Detroit: Become Human, this is also a plus.","group":"WELFARE","sub":"WELFARE_0","i":132,"hrsN":5,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Model self-reports \u2014 validity & robustness","url":"https://sparai.org/projects/f26/reclnJcwAREHji1wf/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"5 hrs"},{"title":"Token taxes as a mechanism for reducing AI-driven power concentration","id":"reclPx3seThfy5OR9","mentors":"Lucas Irwin (GovAI (Summer Fellow), Oxford Martin School AI Governance Initiative)","areas":["AI strategy","Economics of AI","Compute governance"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project will focus on producing a policy memo resolving the open technical, economic, and legal questions blocking real-world implementation of token taxes. It will also run agent-based modelling simulations of the impact of token taxes and alternative policies on the UK economy to compare their benefits and drawbacks.","prereq":"For RQ1: \n- Degree in Engineering, Computer Science, Applied Maths.\n- Experience with compute governance research. \n- Experience with black-box auditing methods and formal verification. \n- Highly proficient in Python.\n- Spent substantial time working with transformers and tokenizers. \n- Strong grounding in mathematics. \n\nFor RQ2:\n- PhD/Master's in Law, Political Science.\n- Legal research experience. \n- Worked at an international organisation. \n\nFor RQ3:\n- PhD/Masters in Economics. \n- Tax policy experience.\n- Very good writer. \n\nFor RQ4:\n- PhD/Masters/Bachelors in Engineering, Computer Science.\n- Highly proficient in Python and ideally at least one of C, C++, Java, Typescript.\n- Experience/interest in agent-based modelling.","group":"SOCIETAL","sub":"SOCIETAL_2","i":133,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Economic modelling & cost trajectories","url":"https://sparai.org/projects/f26/reclPx3seThfy5OR9/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"When Do Models Learn Time? Tracing Temporal Representations Across Training Stages","id":"recLQFkxedz0cqLqx","mentors":"Marc Kaufmann (Independent), Justin Shenk (Independent AI Safety Researcher)","areas":["Developmental interpretability","Mechanistic interpr
