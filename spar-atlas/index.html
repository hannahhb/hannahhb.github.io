<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An interactive map of all 230 SPAR Fall 2026 AI-safety research projects, clustered into 15 themes and 56 sub-clusters by topic similarity, with a live directory and a globe of where everyone is.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="SPAR Project Atlas">
<meta property="og:url" content="https://hannahhb.github.io/spar-atlas/">
<meta property="og:description" content="All 230 SPAR Fall 2026 research projects, clustered by topic similarity, plus a directory and globe of who is working on what, where.">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://hannahhb.github.io/spar-atlas/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>SPAR Project Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E9EDF1; --surface:#FFFFFF; --surface-2:#F3F6F9;
  --ink:#0F161C; --ink-2:#33414E; --muted:#5E6C79; --faint:#8A97A3;
  --hairline:#D0D8E0; --hairline-2:#E1E7ED;
  --link:#3B5A7A; --accent-pin:oklch(.55 .17 28); --warn-bg:#FBF0E2; --warn-ink:#6B4514; --warn-line:#E3C79B;
  --shadow:0 1px 2px rgba(15,22,28,.06), 0 8px 24px rgba(15,22,28,.07);
  --cl:.545; --cc:.155; --edge-op:.16; --hull-fill:.055; --hull-line:.26;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Archivo","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --rail:268px; --panel:360px; --top:56px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0C1116; --surface:#141B22; --surface-2:#1A232B;
  --ink:#E4EAF0; --ink-2:#B9C5D1; --muted:#8593A0; --faint:#65727F;
  --hairline:#222C35; --hairline-2:#1B242C;
  --link:#8FB6DE; --accent-pin:oklch(.68 .16 30); --warn-bg:#2A2114; --warn-ink:#E6C48B; --warn-line:#4A3A1E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --cl:.715; --cc:.145; --edge-op:.2; --hull-fill:.075; --hull-line:.3;
}}
:root[data-theme="dark"]{
  --ground:#0C1116; --surface:#141B22; --surface-2:#1A232B;
  --ink:#E4EAF0; --ink-2:#B9C5D1; --muted:#8593A0; --faint:#65727F;
  --hairline:#222C35; --hairline-2:#1B242C;
  --link:#8FB6DE; --accent-pin:oklch(.68 .16 30); --warn-bg:#2A2114; --warn-ink:#E6C48B; --warn-line:#4A3A1E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --cl:.715; --cc:.145; --edge-op:.2; --hull-fill:.075; --hull-line:.3;
}
.c-INTERP_CIRCUITS{--c:oklch(var(--cl) var(--cc) 265)}
.c-INTERP_PROBES{--c:oklch(var(--cl) var(--cc) 240)}
.c-COT{--c:oklch(var(--cl) var(--cc) 214)}
.c-PERSONA{--c:oklch(var(--cl) var(--cc) 195)}
.c-WELFARE{--c:oklch(var(--cl) var(--cc) 172)}
.c-ALIGN_TRAIN{--c:oklch(var(--cl) var(--cc) 150)}
.c-EVALS{--c:oklch(var(--cl) var(--cc) 128)}
.c-CONTROL{--c:oklch(var(--cl) var(--cc) 107)}
.c-MULTIAGENT{--c:oklch(var(--cl) var(--cc) 85)}
.c-SECURITY{--c:oklch(var(--cl) var(--cc) 58)}
.c-BIO{--c:oklch(var(--cl) var(--cc) 36)}
.c-SOCIETAL{--c:oklch(var(--cl) var(--cc) 16)}
.c-GOV_POLICY{--c:oklch(var(--cl) var(--cc) 356)}
.c-GOV_COMPUTE{--c:oklch(var(--cl) var(--cc) 330)}
.c-FIELD{--c:oklch(var(--cl) var(--cc) 302)}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--panel);grid-template-rows:var(--top) minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- topbar ---------- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--hairline);position:relative;z-index:6}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.015em}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.sep{width:1px;height:22px;background:var(--hairline);flex:none}
.search{flex:1 1 200px;min-width:120px;max-width:340px;position:relative}
.search input{width:100%;padding:6px 26px 6px 10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;font-size:12.5px}
.search input::placeholder{color:var(--faint)}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 5px;line-height:1;font-size:15px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:4px 11px;border-radius:4px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.tb-btn{border:1px solid var(--hairline);background:var(--surface-2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.tb-btn:hover{background:var(--surface);border-color:var(--faint)}
.tb-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tb-btn b{font-family:var(--mono);font-weight:500}
.tb-spacer{flex:1 1 auto}
.closed{display:flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:500;flex:none}
.closed i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8;flex:none}
.sheet-btn{display:none}

/* ---------- rail ---------- */
.rail{grid-row:2;overflow-y:auto;background:var(--surface);border-right:1px solid var(--hairline);padding:12px 0 28px}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;padding:4px 14px 8px;gap:8px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rail-h button{border:0;background:none;color:var(--link);font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.grp{border-top:1px solid var(--hairline-2)}
.grp:first-of-type{border-top:0}
.grp>.gh{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px 7px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.grp>.gh:hover{background:var(--surface-2)}
.grp[data-on="1"]>.gh{background:var(--surface-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2.5px color-mix(in oklab,var(--c) 18%,transparent)}
.gh .gn{flex:1;font-size:12.5px;font-weight:500;line-height:1.3}
.grp[data-on="1"] .gh .gn{font-weight:600}
.gh .gc{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.gh .car{color:var(--faint);font-size:9px;flex:none;transition:transform .15s}
.grp[data-open="1"] .car{transform:rotate(90deg)}
.subs{display:none;padding:0 0 8px 0}
.grp[data-open="1"] .subs{display:block}
.sub{display:flex;align-items:center;gap:8px;width:100%;padding:4px 12px 4px 33px;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink-2)}
.sub:hover{background:var(--surface-2)}
.sub[aria-pressed="true"]{background:color-mix(in oklab,var(--c) 12%,transparent);color:var(--ink);font-weight:600}
.sub .sn{flex:1;font-size:11.8px;line-height:1.35}
.sub .sc{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tick{width:3px;align-self:stretch;border-radius:2px;background:var(--c);opacity:.55;flex:none;margin:1px 0}
.rail-note{padding:14px 14px 0;margin-top:10px;border-top:1px solid var(--hairline-2);color:var(--muted);font-size:11.5px;line-height:1.55}
.rail-note p{margin:0 0 7px}
.keyrow{display:flex;align-items:center;gap:7px;margin:0 0 5px}
.keyrow svg{flex:none}

/* ---------- canvas ---------- */
.canvas{grid-row:2;position:relative;overflow:hidden;background:var(--ground)}
#graph{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#graph.grabbing{cursor:grabbing}
.hull{stroke-linejoin:round;pointer-events:none;fill:var(--c);fill-opacity:var(--hull-fill);stroke:var(--c);stroke-opacity:var(--hull-line);stroke-width:1.25;transition:fill-opacity .18s,stroke-opacity .18s}
.hull.hot{fill-opacity:calc(var(--hull-fill) * 2.6);stroke-opacity:.62;stroke-width:1.6}
.edges line{stroke:var(--ink);stroke-opacity:var(--edge-op);stroke-width:.75}
.edges line.same{stroke:var(--c);stroke-opacity:calc(var(--edge-op) * 1.7)}
.edges line.lit{stroke:var(--ink);stroke-opacity:.72;stroke-width:1.5}
.edges line.hid{display:none}
.node circle{fill:var(--c);stroke:var(--surface);stroke-width:1.4;cursor:pointer;transition:stroke-width .12s}
.node.dim{opacity:.13}
.node.dim circle{cursor:default}
.node.off{display:none}
.node.lit circle{stroke:var(--ink);stroke-width:2}
.node.sel circle{stroke:var(--ink);stroke-width:2.6}
.node.star circle{stroke-dasharray:2.2 1.8;stroke:var(--ink);stroke-width:1.9}
.glabel{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;fill:var(--ink);fill-opacity:.5;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}
.slabel{font-family:var(--sans);font-weight:600;font-size:10.5px;fill:var(--ink);fill-opacity:0;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-opacity:0;stroke-width:3.5px;stroke-linejoin:round;transition:fill-opacity .18s,stroke-opacity .18s}
.slabel.hot{fill-opacity:.9;stroke-opacity:1}
.tip{position:absolute;pointer-events:none;max-width:270px;background:var(--surface);border:1px solid var(--hairline);border-radius:7px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;line-height:1.4;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;z-index:4}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:600;margin-bottom:3px}
.tip span{color:var(--muted);font-size:11px}
.zoomer{position:absolute;left:12px;bottom:12px;display:flex;gap:5px;z-index:3}
.zoomer button{width:28px;height:28px;border:1px solid var(--hairline);background:var(--surface);border-radius:6px;color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.zoomer button:hover{border-color:var(--faint)}
.zoomer button.wide{width:auto;padding:0 10px;font-size:11.5px}
.count{position:absolute;right:12px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint);background:color-mix(in oklab,var(--surface) 82%,transparent);padding:3px 8px;border-radius:5px;z-index:3}

/* ---------- panel ---------- */
.panel{grid-row:2;overflow-y:auto;background:var(--surface);border-left:1px solid var(--hairline)}
.pad{padding:16px 16px 40px}
.p-eyebrow{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.p-eyebrow .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1.ptitle{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.22;letter-spacing:-.018em;margin:0 0 10px;text-wrap:balance}
h2.psub{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--hairline-2)}
.mentors{font-size:13px;font-weight:500;margin:0 0 12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.chip{font-size:11px;padding:2.5px 8px;border-radius:999px;border:1px solid var(--hairline);color:var(--muted);background:var(--surface-2)}
.chip.area{border-color:color-mix(in oklab,var(--c) 40%,var(--hairline));color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline-2);border:1px solid var(--hairline-2);border-radius:7px;overflow:hidden;margin:0 0 14px}
.fact{background:var(--surface);padding:8px 10px}
.fact dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 2px}
.fact dd{margin:0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.prose{font-size:13px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.prose.small{font-size:12.3px;line-height:1.6}
.acts{display:flex;gap:7px;margin:14px 0 0}
.acts a,.acts button{flex:1;text-align:center;padding:7px 10px;border-radius:6px;font-size:12.2px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--hairline);background:var(--surface-2);color:var(--ink-2)}
.acts a{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.near{display:flex;flex-direction:column;gap:1px;background:var(--hairline-2);border:1px solid var(--hairline-2);border-radius:7px;overflow:hidden}
.near button{display:flex;align-items:center;gap:8px;background:var(--surface);border:0;padding:7px 10px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:12.2px;line-height:1.35}
.near button:hover{background:var(--surface-2);color:var(--ink)}
.near .w{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.near .nn{flex:1}
.empty{color:var(--muted);font-size:12.3px;padding:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--ink);color:var(--ground);padding:7px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.filters{display:flex;flex-direction:column;gap:10px;padding:12px 14px 4px}
.fgroup .eyebrow{display:block;margin-bottom:5px}
.fopts{display:flex;flex-wrap:wrap;gap:5px}
.fopt{font-size:11.3px;padding:3px 9px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface-2);color:var(--muted);cursor:pointer}
.fopt[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}

.sphere{fill:var(--surface-2);stroke:var(--hairline);stroke-width:1}
.grat{fill:none;stroke:var(--hairline);stroke-opacity:.55;stroke-width:.5}
.land{fill:var(--ink);fill-opacity:.13;stroke:var(--ink);stroke-opacity:.28;stroke-width:.5}
.globe{cursor:grab}
.globe.spinning{cursor:grabbing}
.pin{cursor:pointer}
.pin circle{fill:var(--accent-pin);stroke:var(--surface);stroke-width:1.5}
.pin text{font-family:var(--mono);font-size:8.5px;fill:var(--surface);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:500}
.pin.sel circle{stroke:var(--ink);stroke-width:2.4}
.pinlab{font-family:var(--sans);font-size:9.5px;font-weight:600;fill:var(--ink);fill-opacity:.8;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round}
.placerow{display:flex;align-items:center;gap:8px;background:var(--surface);border:0;border-top:1px solid var(--hairline-2);padding:7px 10px;text-align:left;cursor:pointer;color:var(--ink-2);width:100%;font-size:12.2px}
.placerow:first-child{border-top:0}
.placerow:hover{background:var(--surface-2)}
.placerow .pl{flex:1;font-weight:500;color:var(--ink)}
.placerow .pw{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.placerow .approx{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.railback{display:flex;align-items:center;gap:7px;width:100%;padding:8px 14px;background:none;border:0;border-bottom:1px solid var(--hairline-2);cursor:pointer;color:var(--link);font-size:11.8px;text-align:left}
.railback:hover{background:var(--surface-2)}
.ctxhead{padding:11px 14px 9px;border-bottom:1px solid var(--hairline-2)}
.ctxhead .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.ctxhead .ht{font-size:12.6px;font-weight:600;line-height:1.3}
.ctxhead .hm{font-size:11.4px;color:var(--muted);margin-top:3px;line-height:1.4}
.ctxsec{padding:11px 0 4px}
.ctxsec>.eyebrow{display:flex;align-items:baseline;gap:6px;padding:0 14px 6px}
.ctxsec>.eyebrow b{font-weight:400;color:var(--ink-2);text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:11px}
.ctxrow{display:flex;gap:8px;width:100%;padding:7px 12px 7px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;border-top:1px solid var(--hairline-2)}
.ctxrow:hover{background:var(--surface-2)}
.ctxrow .cx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ctxrow .ct{font-size:11.9px;font-weight:500;line-height:1.32;color:var(--ink)}
.ctxrow .cm{font-size:10.8px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.ctxrow .cp{font-size:10.8px;line-height:1.4;color:var(--ink-2)}
.ctxrow .cp i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
.ctxempty{padding:2px 14px 10px;font-size:11.4px;color:var(--faint);line-height:1.45}
.subbtns{display:flex;flex-direction:column;gap:6px}
.subbtns .go.alt{background:var(--surface);color:var(--ink);border-color:var(--hairline)}
.node .halo{fill:none;stroke:var(--c);stroke-opacity:0;stroke-width:1.6;pointer-events:none}
.node.peopled .halo{stroke-opacity:.75}
.pcount{font-family:var(--mono);font-size:8.5px;fill:var(--ink);fill-opacity:0;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-width:2.6px}
.node.peopled .pcount{fill-opacity:.85}

.ppl{display:flex;flex-direction:column;gap:1px;background:var(--hairline-2);border:1px solid var(--hairline-2);border-radius:7px;overflow:hidden}
.person{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.person .top{display:flex;align-items:baseline;gap:7px}
.person .pn{font-weight:600;font-size:12.8px;overflow-wrap:anywhere}
.person .pr{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);flex:none}
.person .pnote{font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.person .plinks{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.person .plinks a{font-size:11.3px;padding:1.5px 8px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface-2);text-decoration:none;color:var(--link)}
.person .plinks a:hover{border-color:var(--link)}
.person .drop{margin-left:auto;border:0;background:none;color:var(--faint);cursor:pointer;font-size:11px;padding:0 2px;text-decoration:underline;text-underline-offset:2px}
.person .drop:hover{color:var(--ink)}
.joinform{display:none;flex-direction:column;gap:7px;margin-top:9px;padding:11px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-2)}
.joinform[data-open="1"]{display:flex}
.joinform label{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.joinform input,.joinform select{padding:5px 8px;border:1px solid var(--hairline);border-radius:5px;background:var(--surface);font-size:12.5px;font-family:var(--sans);width:100%}
.joinform .row{display:flex;gap:7px}
.joinform .row>*{flex:1;min-width:0}
.joinform .go{padding:7px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font-weight:600;font-size:12.2px;cursor:pointer}
.joinform .go[disabled]{opacity:.45;cursor:not-allowed}
.privacy{font-size:11px;color:var(--muted);line-height:1.45}
.srcnote{font-size:11.3px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.dirgroup{margin-bottom:16px}
.dirgroup .dh{display:flex;align-items:center;gap:7px;margin:0 0 6px}
.dirgroup .dh b{font-size:12.3px;font-weight:600}
.dirproj{border-left:2px solid var(--c);padding:2px 0 2px 9px;margin:0 0 9px}
.dirproj .dt{font-size:12px;font-weight:600;line-height:1.35;margin-bottom:2px;cursor:pointer}
.dirproj .dt:hover{color:var(--link)}
.dirproj .dp{font-size:11.6px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}

@media (max-width:1180px){ :root{--rail:238px;--panel:320px} }
@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:var(--top) minmax(0,1fr)}
  .rail,.panel{position:absolute;top:var(--top);bottom:0;z-index:8;width:min(86vw,340px);box-shadow:var(--shadow);transform:translateX(-101%);transition:transform .22s}
  .rail{left:0}
  .panel{right:0;transform:translateX(101%);border-left:1px solid var(--hairline);border-right:0}
  .rail[data-sheet="1"],.panel[data-sheet="1"]{transform:none}
  .canvas{grid-row:2;grid-column:1}
  .sheet-btn{display:inline-block}
  :root{--top:92px}
  .topbar{flex-wrap:wrap;align-items:center;row-gap:6px;padding:6px 10px}
  .sep,.closed{display:none}
  .brand span{display:none}
  #railBtn{order:0} .brand{order:1} .seg{order:2} #panelBtn{order:3}
  .tb-spacer{display:block;order:4;flex:0 0 100%;height:0}
  .search{order:5;flex:1 1 150px;max-width:none} #fBtn{order:6} #starBtn{order:7} #dirBtn{order:8}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="tb-btn sheet-btn" id="railBtn" aria-label="Toggle themes panel">Themes</button>
    <div class="brand"><b>SPAR Project Atlas</b><span>Fall 2026 &middot; 230 projects</span></div>
    <div class="sep" aria-hidden="true"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search titles, mentors, areas&hellip;" aria-label="Search projects" autocomplete="off">
      <button class="clr" id="qClear" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="seg" role="group" aria-label="Layout">
      <button id="mWeb" aria-pressed="true">Web</button>
      <button id="mPack" aria-pressed="false">Clusters</button>
      <button id="mGlobe" aria-pressed="false">Globe</button>
    </div>
    <button class="tb-btn" id="fBtn" aria-pressed="false">Filters</button>
    <button class="tb-btn" id="starBtn" aria-pressed="false">&#9733; Shortlist <b id="starN">0</b></button>
    <button class="tb-btn" id="dirBtn">&#9679; Who's here <b id="pplN">0</b></button>
    <div class="tb-spacer"></div>
    <div class="closed"><i aria-hidden="true"></i>Applications closed <span>&middot; 18 Aug 2026</span></div>
    <button class="tb-btn sheet-btn" id="panelBtn" aria-label="Toggle detail panel">Detail</button>
  </header>

  <aside class="rail" id="rail">
    <div class="rail-h"><span class="eyebrow">15 themes &middot; 56 clusters</span><button id="clearSel">Reset</button></div>
    <div id="filters" class="filters" hidden></div>
    <div id="ctx" hidden></div>
    <div id="tree"></div>
    <div class="rail-note">
      <div class="keyrow"><svg width="34" height="14" aria-hidden="true"><circle cx="6" cy="7" r="4" fill="currentColor" opacity=".45"></circle><circle cx="24" cy="7" r="7.5" fill="currentColor" opacity=".45"></circle></svg><span>Circle size = hours/week (3&ndash;40)</span></div>
      <div class="keyrow"><svg width="34" height="14" aria-hidden="true"><line x1="2" y1="7" x2="32" y2="7" stroke="currentColor" stroke-width="1.4" opacity=".5"></line></svg><span>Line = topic similarity</span></div>
      <p style="margin-top:9px">Blobs are the 56 sub-clusters, each holding 3&ndash;5 projects. Drag any circle to reshape the web; double-click to release it.</p>
    </div>
  </aside>

  <main class="canvas" id="canvas">
    <svg id="graph" role="img" aria-label="Force-directed map of 230 SPAR Fall 2026 research projects grouped into 15 themes"></svg>
    <div class="tip" id="tip" aria-hidden="true"></div>
    <div class="zoomer">
      <button id="zIn" aria-label="Zoom in">+</button>
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="zFit" class="wide">Fit</button>
    </div>
    <div class="count" id="count"></div>
  </main>

  <aside class="panel" id="panel"><div class="pad" id="panelBody"></div></aside>
</div>

<script type="application/json" id="atlas-data">{"groups":{"INTERP_CIRCUITS":"Interpretability \u2014 Circuits & Representations","INTERP_PROBES":"Interpretability \u2014 Probes & Deception Detection","COT":"Chain of Thought \u2014 Faithfulness & Monitorability","PERSONA":"Personas, Character & Self-Models","ALIGN_TRAIN":"Alignment \u2014 Training Dynamics & Generalization","EVALS":"Evaluation Science & Eval Awareness","CONTROL":"AI Control & Scalable Oversight","MULTIAGENT":"Multi-Agent Systems & Coordination","SECURITY":"AI Security, Misuse & Cyber","BIO":"Biosecurity & Bio-AI","WELFARE":"AI Welfare, Consciousness & Philosophy","GOV_COMPUTE":"Compute Governance & Geopolitics","GOV_POLICY":"Policy, Law & Institutions","SOCIETAL":"Societal, Economic & Epistemic Impacts","FIELD":"Field-building, Comms & Meta-Research"},"subs":{"EVALS_0":"Benchmark validity & sandbagging","EVALS_1":"Evaluation awareness & eval gaming","EVALS_2":"Interpretability-grounded eval design","EVALS_3":"Evals for agentic & R&D capability","PERSONA_0":"Persona & emotion vectors","PERSONA_1":"Eliciting & red-teaming character","PERSONA_2":"Self-models, identity & introspection","COT_0":"CoT obfuscation & steganography","COT_1":"Verbalizing internals & the CoT persona","COT_2":"Measuring CoT / self-explanation faithfulness","INTERP_CIRCUITS_0":"Feature geometry, influence & automated interp","INTERP_CIRCUITS_1":"Model diffing & representation structure","INTERP_CIRCUITS_2":"Circuit mechanisms & concept binding","INTERP_CIRCUITS_3":"Developmental interp \u2014 what forms during training","SOCIETAL_0":"Human autonomy & epistemic security","SOCIETAL_1":"Macro impacts & public risk preferences","SOCIETAL_2":"Economic modelling & cost trajectories","SOCIETAL_3":"Persuasion, manipulation & user-facing harms","BIO_0":"Biothreat pathways, attribution & preparedness","BIO_1":"Safeguards & evals for bio foundation models","WELFARE_0":"Model self-reports \u2014 validity & robustness","WELFARE_1":"Consciousness, uncertainty & public writing","WELFARE_2":"Welfare interventions in training & deployment","WELFARE_3":"Moral status & comparative welfare theory","GOV_POLICY_0":"AI, law & constitutional doctrine","GOV_POLICY_1":"Great-power strategy & delegation","GOV_POLICY_2":"Compliance tracking, red lines & verification","GOV_POLICY_3":"Lab-practice risk & strategic foresight","GOV_POLICY_4":"State capacity & oversight architecture","MULTIAGENT_0":"Cooperation, commitment & game theory","MULTIAGENT_1":"Collusion & untrusted monitoring","MULTIAGENT_2":"Escalation, bargaining & crisis dynamics","MULTIAGENT_3":"Why multi-agent systems fail","FIELD_0":"Career pipelines & community infrastructure","FIELD_1":"Public explanation & comms training","FIELD_2":"Reference works & knowledge distillation","FIELD_3":"Meta-research & automating safety research","FIELD_4":"Org-building, hiring & lab accountability","FIELD_5":"University group curricula & playbooks","INTERP_PROBES_0":"Detecting scheming & escalation from internals","INTERP_PROBES_1":"Deception & honesty probes","INTERP_PROBES_2":"Probe reliability across models & data","INTERP_PROBES_3":"Activation monitors & ground-truth probe panels","GOV_COMPUTE_0":"Compute verification & inspection regimes","GOV_COMPUTE_1":"China, Taiwan & the semiconductor chain","ALIGN_TRAIN_0":"Data provenance & unintended generalization","ALIGN_TRAIN_1":"Distillation, mid-training & value drift","ALIGN_TRAIN_2":"Model organisms of emergent misalignment","ALIGN_TRAIN_3":"Reward hacking & shaping generalization","ALIGN_TRAIN_4":"Preference conflicts & RL exploration","CONTROL_0":"Control protocols & escalation to humans","CONTROL_1":"Debate, auditing games & automated auditors","SECURITY_0":"Jailbreak evasion, tampering & testing failures","SECURITY_1":"Mechanistic anatomy of jailbreaks & injections","SECURITY_2":"Misuse uplift & infohazard measurement","SECURITY_3":"Agent attribution & cyber-offense evals"},"projects":[{"title":"Model Forensics: Follow-up investigations into concerning behavior","id":"rec06PdLADTzLArsZ","mentors":"Aditya Singh (Anthropic Fellows)","areas":["Behavioral evaluation of LLMs","AI control","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"If we catch a concerning action, how can we tell if it is real misalignment or just a mistake? We will research this question by trying to understand complex behavior in current models, such as why a model hardcodes tests.","prereq":"- Python proficiency\n- Comfortable using LLM APIs","group":"EVALS","sub":"EVALS_0","i":0,"hrsN":10,"gname":"Evaluation Science & Eval Awareness","sname":"Benchmark validity & sandbagging","url":"https://sparai.org/projects/f26/rec06PdLADTzLArsZ/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Persona Selection Covert Red Teaming","id":"rec0b90L7DTomqlvM","mentors":"Ben Maltbie (Pivotal Research / MIT)","areas":["Behavioral evaluation of LLMs","AI control","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Can we get models to deviate from the assistant persona through covert (not obvious to human readers) single or multi-turn prompts? Can we push them to move towards a specific persona (e.g. a misaligned persona)?","prereq":"Strong proficiency using Python, some research experience sufficient to be able to read the papers above. Bonus if you have done interpretability research before.","group":"PERSONA","sub":"PERSONA_1","i":1,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Eliciting & red-teaming character","url":"https://sparai.org/projects/f26/rec0b90L7DTomqlvM/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Understanding the Chain of Thought persona","id":"rec1qD16FAgdqKv2m","mentors":"Thomas Jiralerspong (Bengio Lab, MATS Anthropic)","areas":["Chain of thought","Mechanistic interpretability","Alignment"],"hours":"20 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Persona Selection Model says that LLMs learn a bunch of different personas during pretraining (to be able to predict then next token on all internet text) and posttraining selects/refines the assistant persona. There have been many papers exploring the assistant persona and evil personas but very few papers trying to understand the role of chain of thought in all this. This project's aim would be to understand the role of the CoT in the persona selection model.","prereq":"- Experience with mech interp\n- Experience with model personas\n- Experience with LLM inference","group":"COT","sub":"COT_1","i":2,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Verbalizing internals & the CoT persona","url":"https://sparai.org/projects/f26/rec1qD16FAgdqKv2m/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"20 hrs"},{"title":"Unmixing Mechanisms: How Language Models Choose Among Binding Strategies","id":"rec2BhiCp77djygfJ","mentors":"David Bau (Northeastern University)","areas":["Mechanistic interpretability"],"hours":"40 hrs/week","team":"Team size: 4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"When a language model reads 'Ann loves pie,' it binds Ann to pie so it can later answer 'Who loves pie?', and recent work shows models juggle at least three distinct mechanisms (positional, lexical, and reflexive) to do this. This project aims to uncover how these mechanisms interact: do they back each other up, or compete to drive the model's answer?","prereq":"- Highly proficient in Python and PyTorch; you'll be implementing and debugging your own experiments fairly independently.\n- Completed at least one hands-on mechanistic interpretability investigation using a library such as nnsight, TransformerLens, or pyvene (self-directed projects, paper replications, and ARENA-style coursework all count).\n- Familiar with common mechanistic interpretability methods such as the logit lens, activation patching, and distributed alignment search (DAS).\n- Comfortable with core linear algebra concepts, matrices, vector spaces and subspaces, basis vectors, rank, as analyzing the subspaces that attention heads read from and write to is central to this project.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_2","i":3,"hrsN":40,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Circuit mechanisms & concept binding","url":"https://sparai.org/projects/f26/rec2BhiCp77djygfJ/","inv":"Detailed","teamMax":4,"teamShort":"4","hoursShort":"40 hrs"},{"title":"Measuring AI R&D Automation Beyond Coding: Analysis and Communication Evals","id":"rec2eJ0wU8bEy1ilD","mentors":"Prakrat Agrawal (MATS / UC Berkeley), Advait Yadav (MATS / UIUC)","areas":["Evaluations","AI strategy"],"hours":"15 hrs/week","team":"Team size: 4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We will build evaluations that measure how good AI models are at fuzzy AI R&D tasks, focusing on analyzing experiment results and communicating research findings.","prereq":"Must haves:\n\n- Proficiency with Python\n- Has driven at least one LLM research project end-to-end\n- Comfortable with rapid experimental iteration\n- Familiar with popular AI Safety threat models and research agendas (can articulate a concrete threat model for a given scenario and reason about mitigations)\n\nNice to haves:\n\n- Prior research experience (not necessarily ML research)\n- Experience with Inspect\n- Working knowledge of post-training and evaluations (RL environments, judging/rubrics, reward models)\n\nYou don\u2019t need to meet all of these requirements to do good research. In general we value the willingness and ability to learn things fast more than prior knowledge and experience. Err on the side of applying, even if you don\u2019t meet all requirements!","group":"EVALS","sub":"EVALS_3","i":4,"hrsN":15,"gname":"Evaluation Science & Eval Awareness","sname":"Evals for agentic & R&D capability","url":"https://sparai.org/projects/f26/rec2eJ0wU8bEy1ilD/","inv":"Detailed","teamMax":4,"teamShort":"4","hoursShort":"15 hrs"},{"title":"Benchmark Cartography: Using Interpretability to Map What Our Evaluations Miss","id":"rec2eMF6MyQaMQqSr","mentors":"Maty Bohacek (Stanford University, ex-DeepMind)","areas":["Evaluations","Mechanistic interpretability"],"hours":"8 hrs/week","team":"Team size: 4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We evaluate models constantly and almost never evaluate the evaluations: when a benchmark saturates we build a harder one and call that progress, but difficulty is not validity. This project uses sparse autoencoders to map what benchmarks actually measure in concept space, tests whether successive benchmark generations expand coverage or merely intensify difficulty within the same footprint, and uses the resulting gaps to construct items that probe what current evaluations miss.","prereq":"Required:\n\n- High proficiency in Python and PyTorch, and comfort running inference over open-weight models. No SAE training is required; pretrained SAEs (Gemma Scope, Llama Scope) cover the models we would use.\n- Strong data analysis and visualization skills. A large share of this project is analysis design rather than engineering: deciding what to measure and how to show it is the work.\n- Ability to read a benchmark critically. You should be able to look at a dataset and articulate what it does and does not measure, beyond reporting its stated purpose.\n\nUseful, not required:\n\n- Familiarity with sparse autoencoders or feature-level interpretability. If you have not used them, demonstrated ability to pick up an unfamiliar toolchain quickly is an acceptable substitute.\n- A measurement, psychometrics, or statistics background. This is unusual in ML and a genuine asset here. If you have thought about construct validity, item discrimination, or test design in any domain, including outside ML, say so in your application.\n- For the item-construction thread, experience writing careful test items or exam questions.","group":"EVALS","sub":"EVALS_2","i":5,"hrsN":8,"gname":"Evaluation Science & Eval Awareness","sname":"Interpretability-grounded eval design","url":"https://sparai.org/projects/f26/rec2eMF6MyQaMQqSr/","inv":"Detailed","teamMax":4,"teamShort":"4","hoursShort":"8 hrs"},{"title":"Develop epistemic evals with Sophron Research","id":"rec2hUz8IUFeGoFXx","mentors":"Paul de Font-Reaulx (Sophron Research), Alejandro Botas (Sophron Research, Future of Life Foundation)","areas":["Behavioral evaluation of LLMs","Evaluations","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee), Limited involvement","summary":"Developing evaluations for assessing the epistemic properties of AI models, including how they affect our ability to have true beliefs.","prereq":"- Some familiarity with evaluation and benchmarking.\n- Background in CS, ML, Stats, Econ, and/or Philosophy, or equivalent. Familiarity with AI and AI safety required.\n- Substantial research experience (e.g. writing research papers). Preferably: PhD completed or ongoing.","group":"SOCIETAL","sub":"SOCIETAL_3","i":6,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Persuasion, manipulation & user-facing harms","url":"https://sparai.org/projects/f26/rec2hUz8IUFeGoFXx/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"Operationalizing AI\u00d7Bio Governance: A Practical IBC Framework for Resource-Constrained Settings","id":"rec2IaCS7pctEEr6P","mentors":"Zia Ashraf (Government College University, Faisalabad)","areas":["Biosecurity","Technical governance","International governance"],"hours":"10 hrs/week","team":"Team size: 1-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Existing biosecurity guidance increasingly recognizes artificial intelligence, information security, and the role of Institutional Biosafety Committees (IBCs), but institutions still need practical ways to translate these principles into project-level review. This project will develop and pilot-test a resource, calibrated screening framework, comprising an intake checklist, risk tiers, and escalation decision tree, to help IBCs identify and manage risks arising from AI-enabled biological research.","prereq":"Required:\nDemonstrated ability to conduct a rigorous literature or policy review and synthesize findings in clear written English.\nFoundational knowledge in at least one of the following: biosecurity or biosafety, life sciences, AI governance or safety, technology policy, or research governance\u2014and willingness to learn the adjacent domain.\nAbility to compare governance frameworks, identify assumptions and evidence gaps, and translate analysis into practical recommendations.\nGood judgment when handling uncertainty and potentially sensitive dual-use subjects.\nAvailability for at least 10 hours per week throughout the program.\n\nPreferred but not required:\nExperience with qualitative research, structured expert consultation, institutional review, dual-use research governance, cyberbiosecurity, or policy-tool development.\nFamiliarity with resource-constrained research environments or global health security.\n\nNo wet-lab work or programming is required. Applicants from regions underrepresented in AI governance are encouraged, but selection is not geographically restricted.","group":"BIO","sub":"BIO_0","i":7,"hrsN":10,"gname":"Biosecurity & Bio-AI","sname":"Biothreat pathways, attribution & preparedness","url":"https://sparai.org/projects/f26/rec2IaCS7pctEEr6P/","inv":"Detailed","teamMax":3,"teamShort":"1-3","hoursShort":"10 hrs"},{"title":"Handling uncertainty in AI consciousness","id":"rec2k7EhS2J4QOmJE","mentors":"Chris Percy (The Consciousness Foundation + Honorary research roles at the University of Warwick, University of Derby, and QRI.)","areas":["AI welfare","Philosophy of AI","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees can choose to work on research content and/or community engagement in the AI consciousness field. Research content includes extracting technical indicators of consciousness from different theories and reviewing new papers about computational functionalism (or developing your own novel arguments). Community engagement includes engaging experts and site users, preparing posts, and identifying dissemination opportunities.","prereq":"For research content interested mentees: \n- familiarity with the style of academic papers in neuroscience and philosophy; able to read such papers independently with only occasional clarification questions.\n- educated to at least an undergraduate level or equivalent. \n\nFor field building interested mentees:\n- familiarity with the major forms, events, and social media channels for engaging those working in AI safety, AI consciousness, AI capabilities, and related domains.\n- proactive, creative mindset for engaging existing community members, finding new individuals, and identifying awareness-raising opportunities.","group":"WELFARE","sub":"WELFARE_1","i":8,"hrsN":5,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Consciousness, uncertainty & public writing","url":"https://sparai.org/projects/f26/rec2k7EhS2J4QOmJE/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"5 hrs"},{"title":"Strategic stability when states delegate to AI: escalation, commitments, and arms control","id":"rec2OyufWy8TB2vOy","mentors":"Amritanshu Prasad (Alva Myrdal Centre for Nuclear Disarmament, Uppsala University)","areas":["AI strategy","International governance"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"States are integrating AI into military and diplomatic functions, with consequences for deterrence, crisis stability, and agreement-making that remain underanalyzed. This project produces analytical papers and policy briefs on two questions: under what conditions delegation to AI systems destabilizes crises, and whether machine-verifiable commitments could improve the verifiability of future agreements.","prereq":"Strong analytical writing. Working familiarity with current AI capabilities and deployment patterns. Preferably background in international relations, strategic studies, or security policy, through formal study or serious self-study, including familiarity with the deterrence and escalation literature (for example Schelling, Fearon, and the counterforce debates). Arms-control knowledge is helpful for the commitments subproject.","group":"GOV_POLICY","sub":"GOV_POLICY_1","i":9,"hrsN":8,"gname":"Policy, Law & Institutions","sname":"Great-power strategy & delegation","url":"https://sparai.org/projects/f26/rec2OyufWy8TB2vOy/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Economic Impacts of Frontier AI","id":"rec2PlDq9OODdId2k","mentors":"Rishi Bommasani (Stanford University)","areas":["Economics of AI","Societal impacts"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Reasoning about the economic impacts of frontier AI: how does AI diffuse through work, how do new tasks emerge, how does household use substitute for labor, how do technical benchmarks relate to economic indicators.","prereq":"No strict prerequisites. Familiarity with and interest in the research/data available on the economic impacts of frontier AI is expected. Running evals, doing data analysis, and do technical economic analysis are all useful skills. Using agents effectively in research will be useful.","group":"SOCIETAL","sub":"SOCIETAL_1","i":10,"hrsN":10,"gname":"Societal, Economic & Epistemic Impacts","sname":"Macro impacts & public risk preferences","url":"https://sparai.org/projects/f26/rec2PlDq9OODdId2k/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"Internal monitoring when chain-of-thought becomes illegible","id":"rec2qWv2uQC5ontGH","mentors":"Marios Tsatsos (Independent)","areas":["Chain of thought","Scalable oversight","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"As reasoning models are trained with RL, their chain-of-thought can drift into illegible text a monitor cannot read, documented across RL-trained reasoning models and now in Anthropic's Fable 5 / Mythos 5 system card. This project builds a controlled legibility gradient and tests whether a residual-stream activation monitor keeps detecting harmful intent where a CoT monitor goes blind.","prereq":"- High proficiency in Python.\n- Have trained or fine-tuned a transformer in PyTorch (toy models or following guides is fine).\n- Comfortable running experiments on a single GPU (Colab T4 level).\n- Basic familiarity with transformer internals: residual stream, layers, activations. Prior probe experience is not required; comfort reading a paper and turning it into code is.\n- Able to commit ~10 hr/week for the full round.","group":"COT","sub":"COT_2","i":11,"hrsN":10,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Measuring CoT / self-explanation faithfulness","url":"https://sparai.org/projects/f26/rec2qWv2uQC5ontGH/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Legal Alignment and Rule of Law Empirical Evaluations","id":"rec3aZfmWmS5ZMlY9","mentors":"Noam Kolt (Hebrew University)","areas":["Evaluations","Societal impacts","National policy"],"hours":"20 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Empirically measuring the legal alignment of AI agents and the impact of AI on the rule of law","prereq":"Publication track record of at least one first-authored paper in a top CS conference (e.g., NeurIPS, AAAI, FAccT), peer-reviewed scientific journal, or U.S. law review.","group":"GOV_POLICY","sub":"GOV_POLICY_0","i":12,"hrsN":20,"gname":"Policy, Law & Institutions","sname":"AI, law & constitutional doctrine","url":"https://sparai.org/projects/f26/rec3aZfmWmS5ZMlY9/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"20 hrs"},{"title":"Human Behavioral Phenomena in Language Models","id":"rec3euodKyEvpcC6t","mentors":"Emilio Barkett (Independent)","areas":["Behavioral evaluation of LLMs","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project investigates whether language models replicate human behavioral phenomena by adapting experimental designs from the social sciences. Mentees will select a documented human behavior and design experiments to test whether it emerges in language model outputs.","prereq":"Required:\n\nProficiency in Python sufficient to write and run experiments independently.\nExperience querying language models via API (e.g., OpenAI, Anthropic, or open-source models through Hugging Face).\nFamiliarity with experimental research design, including concepts like independent/dependent variables, control conditions, and statistical significance.\nExposure to at least one social science discipline (e.g., psychology, sociology, communication, organizational behavior, economics) through coursework or independent study.\n\nStrongly preferred:\n\nExperience reading and synthesizing academic literature.\nPrior experience designing or running a research study (does not need to be published).\nBasic statistical analysis skills (e.g., hypothesis testing, regression, or equivalent).","group":"SOCIETAL","sub":"SOCIETAL_3","i":13,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Persuasion, manipulation & user-facing harms","url":"https://sparai.org/projects/f26/rec3euodKyEvpcC6t/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"5 hrs"},{"title":"Can LLMs use open-source game theory to cooperate?","id":"rec3FBZgiQtWyy9Rv","mentors":"Richard Willis (King's College London)","areas":["Multi-agent systems","Behavioral evaluation of LLMs"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project evaluates whether current LLMs are capable of open-source game theory: cooperating by conditioning their strategies on their opponent's decision procedure, in a paradigm where an agent can simulate its opponent's strategy but not inspect its code. The output is an open evaluation suite and a report, designed both to measure today's models and to track when future releases acquire the capability.","prereq":"- Familiarity with basic game theory concepts: Nash equilibrium, best response, Prisoner's Dilemma, mixed strategies, etc.\n- Reasonable coding skills: able to code a simple project for GitHub without LLM use.\n- Experience with using LLM code generation.","group":"MULTIAGENT","sub":"MULTIAGENT_0","i":14,"hrsN":15,"gname":"Multi-Agent Systems & Coordination","sname":"Cooperation, commitment & game theory","url":"https://sparai.org/projects/f26/rec3FBZgiQtWyy9Rv/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Faithfulness, Self-Knowledge, and Introspection","id":"rec3KQAI0JcxJJAce","mentors":"Noah Siegel (Google DeepMind)","areas":["Chain of thought","AI welfare","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 3-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"To what extent can we trust model self-explanations? Are models able to make use of privileged self-knowledge, e.g. via introspection or metacognition, and does this have implications for model welfare?","prereq":"- Python proficiency\n- Experience working with LLMs, via API as well as locally (e.g. Huggingface transformers)\n- Familiar with libraries for data processing (e.g. Pandas/Polars) and visualization (e.g. Plotly/Matplotlib)\n- Prior research experience","group":"COT","sub":"COT_2","i":15,"hrsN":10,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Measuring CoT / self-explanation faithfulness","url":"https://sparai.org/projects/f26/rec3KQAI0JcxJJAce/","inv":"Guidance","teamMax":6,"teamShort":"3-6","hoursShort":"10 hrs"},{"title":"AI Safety Fieldbuilding Outreach","id":"rec3oUxfxIMzdlRux","mentors":"Sam Anschell (Coefficient Giving), Kuhan Jeyapragasan (Civitech Incubator)","areas":["Generalist"],"hours":"5 hrs/week","team":"Team size: 1 mentee","involvement":"Limited involvement","summary":"An outreach project to bring more promising people into AI safety work, mentored by Sam Anschell (Coefficient Giving) and Kuhan Jeyapragasan. The project scope is shared directly with the mentee.","prereq":"","group":"FIELD","sub":"FIELD_2","i":16,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Reference works & knowledge distillation","url":"https://sparai.org/projects/f26/rec3oUxfxIMzdlRux/","inv":"Limited","teamMax":1,"teamShort":"1","hoursShort":"5 hrs"},{"title":"Convergent Truth","id":"rec4dPcpKHiP2iO8f","mentors":"Jared Moore (Stanford University)","areas":["Multi-agent systems","Behavioral evaluation of LLMs","Scalable oversight"],"hours":"20 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Design a test for whether LLM agents, given opposing information and sometimes goals, can still converge on the truth.","prereq":"Prior research experience (can be in another domain).\n\nAble to read and understand papers in at least some AI domains (and not just use an LLM summary)\n\nProficiency with python. Writes clean, understandable code.\n\n- It is fine to use coding agents but you must know how to reign them in (viz.: read their code; don't let them reimplement everything; use linters and formatters).\n\nHave a realistic model of your own schedule and get things done when you say. (I'm not trying to say everything has to be done quickly -- just that you should communicate your uncertainty.)\n\nOpenness to learn new things.\n\nClear communicator. Agreeable and humble","group":"MULTIAGENT","sub":"MULTIAGENT_0","i":17,"hrsN":20,"gname":"Multi-Agent Systems & Coordination","sname":"Cooperation, commitment & game theory","url":"https://sparai.org/projects/f26/rec4dPcpKHiP2iO8f/","inv":"Co-working","teamMax":1,"teamShort":"1","hoursShort":"20 hrs"},{"title":"Do Less Coercive Interventions Reduce AI Deception?","id":"rec4JR0BxYnJ214XA","mentors":"Aashiq Muhamed (Carnegie Mellon University)","areas":["AI control","AI welfare","Alignment"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Many safety methods rely on monitoring, restrictions, hidden evaluations, model edits, or shutdown threats. This project tests whether less coercive interventions such as transparency, positive incentives, and limited recourse reduce deception, hidden goal pursuit, and resistance in AI agents with planted conflicting objectives.","prereq":"Required:\n\nStrong Python programming ability.\nFamiliarity with PyTorch and Hugging Face transformers.\nAbility to run and debug experiments with open-weight language models or LLM agents.\nComfort reading ML papers and turning research questions into concrete experiments.\nEnough time and independence to make weekly progress between check-ins.\nExperience with coding agents.\n\nStrongly preferred:\n\nExperience finetuning a transformer model.\nFamiliarity with at least one of: mechanistic interpretability, probing, activation patching, sparse autoencoders, model editing, unlearning, backdoors, or agent scaffolding.\nInterest in deceptive alignment, evals, model organisms, or the safety relevance of AI welfare ideas.\n\nPrior published research is a plus. The ideal candidate is someone who can implement experiments reliably, notice confounds, and think carefully about what a toy model organism does and does not show.","group":"WELFARE","sub":"WELFARE_2","i":18,"hrsN":15,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Welfare interventions in training & deployment","url":"https://sparai.org/projects/f26/rec4JR0BxYnJ214XA/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Representation Diagnostics for LLM Safety","id":"rec4NRAGVuLATiWpd","mentors":"Sandy Tanwisuth (Independent), Mohan Gupta (Princeton University)","areas":["Mechanistic interpretability","Behavioral evaluation of LLMs","Alignment"],"hours":"10 hrs/week","team":"Team size: 2-4 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Do mechanistic \u201csafety directions\u201d in LLMs truly represent refusal, or do they conflate refusal with harmfulness, caution, clarification, and other safety-relevant tasks? Building on our behavioral taxonomy of six safety policies (under-review at EMNLP), this project asks whether those policy shifts correspond to internal model representations that generalize across prompt wording, datasets, and model families. Two mentees, one engineering-focused and one theory-focused, will develop and stress-test representational diagnostics on small open-weight models, with large-model replication and causal interchange interventions as stretch goals.","prereq":"Applicants should indicate whether they are applying primarily for the engineering track or the theory track. We value overlap, but do not expect applicants to arrive with both skill sets.\n\nEngineering-track applicants should be proficient in Python and Git. You should be able to read, modify, debug, and evaluate research code without relying on an AI assistant to make the important technical decisions. Experience with PyTorch and common data-analysis tools such as pandas, NumPy, matplotlib, or Jupyter is expected. You should also understand experimental design, visualization, and basic statistics, and be able to distinguish a substantive result from an implementation, data, or measurement problem.\n\nTheory-track applicants should be comfortable with linear algebra and with discrete mathematical concepts such as sets, functions, partitions, equivalence relations, and directed graphs. Basic probability, statistics, calculus, and optimization are also helpful. Applicants should be able to read formal definitions and proofs, construct counterexamples, and translate a proposed high-level model into falsifiable intervention predictions.\n\nApplicants in either track should demonstrate independent scientific judgment, intellectual honesty, and comfort with negative results. We are especially interested in people who evaluate claims based on evidence.\n\nNice to haves for the engineering track include experience with Hugging Face Transformers, vLLM, TransformerLens, activation hooks, open-weight model inference, or LLM evaluation datasets.&#x20;\n\nNice to haves for the theory track include familiarity with causal abstraction, mechanistic interpretability, task or function vectors, representation learning, or causal interventions.\n\nBackground in computational modeling, philosophy of science, formal epistemology, applied math, or AI safety may be useful for either track.","group":"INTERP_PROBES","sub":"INTERP_PROBES_1","i":19,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Deception & honesty probes","url":"https://sparai.org/projects/f26/rec4NRAGVuLATiWpd/","inv":"Co-working","teamMax":4,"teamShort":"2-4","hoursShort":"10 hrs"},{"title":"Forecasting - Quantifying the lag of China's compute production chain","id":"rec4oD6HjHY9R3OJQ","mentors":"J\u00e9r\u00e9my Andr\u00e9oletti (General-Purpose AI Policy Lab), Antoine Maier (General-Purpose AI Policy Lab)","areas":["Compute governance","US-China governance","AI strategy"],"hours":"15 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Build quantitative forecasts of China's indigenous compute production chain, refining existing DUV/EUV lag estimates and/or extending the approach to other bottlenecks such as HBM.","prereq":"- Familiarity with the AI risk literature.\n- Quantitative background; comfort with probabilistic forecasting (calibration, decomposition).\n- Ability to do deep technical desk research on unfamiliar domains.\n- Strong preference for French fluency for the policy-facing summary, written directly in French.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_1","i":20,"hrsN":15,"gname":"Compute Governance & Geopolitics","sname":"China, Taiwan & the semiconductor chain","url":"https://sparai.org/projects/f26/rec4oD6HjHY9R3OJQ/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"15 hrs"},{"title":"Alignment without Personas","id":"rec5lzq8haUmA56sY","mentors":"Matthew Khoriaty (Pivotal AI Safety Research Fellowship)","areas":["Alignment","Philosophy of AI"],"hours":"6 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Alignment techniques that rely on 'personas' will fail as the AIs become more powerful. This project aims to make progress on the \u201chard problem of alignment\u201d by providing a framework within which to measure how persona-dependent an alignment technique is, mapping and demonstrating the limits of persona-based alignment and of alignment techniques that make use of personas, and increasing awareness of the limitations of persona-based alignment techniques.","prereq":"Has engaged with AI Alignment (eg BlueDot course, a university AI safety fellowship, or equivalent).\nHas read at least one book on the alignment problem.","group":"PERSONA","sub":"PERSONA_2","i":21,"hrsN":6,"gname":"Personas, Character & Self-Models","sname":"Self-models, identity & introspection","url":"https://sparai.org/projects/f26/rec5lzq8haUmA56sY/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"6 hrs"},{"title":"Evaluation Awareness Convergence","id":"rec5pfOc1lr7adaAF","mentors":"Netzer Epstein (Microsoft, Heron AI Security, LIDA), Neta Ravid (Astrix Security)","areas":["Evaluations","Behavioral evaluation of LLMs","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Researchers now have many ways to measure LLM \"evaluation awareness\", a model's ability to tell it is being tested, but no one has checked whether these methods agree. This project runs the leading instruments head-to-head on a shared set of transcripts: black-box self-report, verbalized awareness, Elo ranking, linear probes, sparse-autoencoder features, and the Jacobian-lens (\"J-space\") score. We test whether they measure the same underlying construct and, where they diverge, what each one actually captures.","prereq":"Required:\n- Highly proficient in Python, and using coding agents.\n- Comfortable with PyTorch and the Hugging Face transformers library.\n- Comfortable calling frontier LLM APIs (OpenAI / Anthropic / Google) and handling batched jobs.\n- Genuine interest in AI evaluations / AI safety, and the discipline to write careful, reproducible code.\n\nStrongly desired for at least one team member (not required of everyone):\n- Mechanistic-interpretability tooling.\n- Experience training linear probes on model activations, or working with sparse autoencoders / the logit- or Jacobian-lens family of tools.\n\nYou do not need prior research experience or a publication record. If you are strong on the required list and excited about the topic, please apply even if you don't match everything above.","group":"EVALS","sub":"EVALS_2","i":22,"hrsN":10,"gname":"Evaluation Science & Eval Awareness","sname":"Interpretability-grounded eval design","url":"https://sparai.org/projects/f26/rec5pfOc1lr7adaAF/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"How AI Safety Looks to the People Around Us","id":"rec68pQfMGiWKXh2h","mentors":"Vy Tran (Generator Residency)","areas":["Generalist","Communications","Societal impacts"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Interview people working in AI safety and people in their lives who aren't immersed in the field to understand how AI safety work affects relationships, how career choices and beliefs are perceived, and what helps people communicate across differences in worldview.","prereq":"- Strong interviewing and writing skills\n- Good social judgment\n- Comfort speaking with people who disagree with AI safety assumptions and ability to report those views fairly\n- Familiarity with AI safety is useful, but deep technical knowledge is not required","group":"FIELD","sub":"FIELD_0","i":23,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Career pipelines & community infrastructure","url":"https://sparai.org/projects/f26/rec68pQfMGiWKXh2h/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"No-Regret Preparedness: A Framework for Investments That Mitigate Both Advanced-AI and Conventional Catastrophic Risk","id":"rec6BkoDQ7nye26BE","mentors":"Micha\u0142 Kubiak (AI Safety Poland)","areas":["AI strategy","Biosecurity","National policy"],"hours":"8 hrs/week","team":"Team size: 3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Catastrophic-AI preparedness is chronically under-resourced because it competes with more immediate national-security priorities. This project develops and stress-tests a decision framework identifying investments that build resilience against BOTH advanced-AI risks (AI-enabled bio, cyber, infrastructure attacks) and conventional or hybrid threats, creating \u201cno-regret\u201d benefits that can unlock the catastrophic-risk funding.","prereq":"Strong reading and synthesis skills across policy, legal, and institutional documents - this is a research-and-writing project, not a technical one.\n\nA background in public policy, law, international relations, political science, economics, security studies or a related field, OR demonstrated equivalent research experience.\n\nBasic understanding of catastrophic AI risk pathways (especially AI-enabled bio and cyber). No ML or programming background required.","group":"BIO","sub":"BIO_0","i":24,"hrsN":8,"gname":"Biosecurity & Bio-AI","sname":"Biothreat pathways, attribution & preparedness","url":"https://sparai.org/projects/f26/rec6BkoDQ7nye26BE/","inv":"Guidance","teamMax":3,"teamShort":"3","hoursShort":"8 hrs"},{"title":"Towards rigorous Alignment Evaluations.","id":"rec6g7dEGkp4T4uLy","mentors":"Krish Sen (ERA AI/University of Oxford), Rahul Marchand (Oxford University)","areas":["Evaluations","Behavioral evaluation of LLMs","Alignment"],"hours":"10 hrs/week","team":"Team size: 4-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Evaluations, in principle, are most meaningful if they are accurate. In this project, we will audit evaluations that claim to measure traits such as generalisation, identify current failure modes, and help build evaluations that are more accurate.","prereq":"We would like mentees who are able to run small experiments on LLMs in Python and think through problem critically. Skills that are helpful for this:\n- Python\n- Knowledge of transformers/LLMs\n- Previous experience with LLM evaluations (not required)\n\nWe're happy to take on people who learn quickly, if they're ready to do a lot of technical learning independently! On the off chance that you have psychometrics experience this would also be extremely valuable (although certainly not needed).","group":"EVALS","sub":"EVALS_3","i":25,"hrsN":10,"gname":"Evaluation Science & Eval Awareness","sname":"Evals for agentic & R&D capability","url":"https://sparai.org/projects/f26/rec6g7dEGkp4T4uLy/","inv":"Detailed","teamMax":6,"teamShort":"4-6","hoursShort":"10 hrs"},{"title":"From AI Exposure to Economic Shock: Early-Warning Triggers for Southeast Asia","id":"rec6h6JTLiswjlgL9","mentors":"Supheakmungkol Sarin (AI Safety Asia)","areas":["Societal impacts","Economics of AI","AI strategy"],"hours":"10 hrs/week","team":"Team size: 3-6 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Most AI labour research stops at estimating which jobs are exposed; this project asks when AI-driven disruption in Southeast Asia\u2019s export-service economies could cascade into a broader economic and governance shock\u2014and what governments can do before it does. Mentees will build and stress-test early-warning indicators, transition scenarios and policy triggers for anticipatory action.","prereq":"Applicants must:\n\nBe able to conduct rigorous literature or policy research and write clearly in English.\n\nHave basic quantitative literacy and be comfortable assessing the quality and limitations of public data.\n\nBe able to commit at least 10 hours per week for the full programme.\n\nDemonstrate serious interest in transformative-AI governance and economic transition.\n\nApplicants should also bring strength in at least one of the following areas: labour or development economics; public policy or political economy; quantitative data analysis using spreadsheets, R or Python; structured forecasting or scenario methods; or Southeast Asian political and economic research.\n\nRegional experience is valuable but not mandatory. Applicants do not need to be advanced programmers. More important are intellectual honesty, careful handling of uncertainty, reliability and the ability to distinguish evidence from inference.","group":"SOCIETAL","sub":"SOCIETAL_2","i":26,"hrsN":10,"gname":"Societal, Economic & Epistemic Impacts","sname":"Economic modelling & cost trajectories","url":"https://sparai.org/projects/f26/rec6h6JTLiswjlgL9/","inv":"Detailed","teamMax":6,"teamShort":"3-6","hoursShort":"10 hrs"},{"title":"Orthogonalization Against Reward Hacking","id":"rec6s8CRgbmKsDlZ1","mentors":"Vladimir Ivanov (Aether)","areas":["Alignment","Mechanistic interpretability"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Apply orthogonalization - the technique most used in practice to remove refusal from open weight LLMs - to remove reward hacking. I expect to have some advantages over DPO, test if it does.","prereq":"- Has done experiments on model-internals/interpretability (in a broad sense: probes, activation steering, mech-interp, gradient routing, sparse autoencoders, etc, are all good) OR has fine-tuned an LLM\n- [preferred] AND instead of OR\n- Has done evals on an LLM\n- Has done some research, preferably on LLMs.\n- Proficient programmer or good at verifying AI assisted code\n- [preferred] Has worked with open weight LLMs on GPUs","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_3","i":27,"hrsN":10,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Reward hacking & shaping generalization","url":"https://sparai.org/projects/f26/rec6s8CRgbmKsDlZ1/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Differential Data for Automated AI Safety Research","id":"rec6Vi0ys9vI7GZqJ","mentors":"Alec Harris (Pivotal Research Extension)","areas":["Generalist","Alignment"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Explore what data could differentially train future models to conduct useful AI safety research.","prereq":"Familiarity with machine learning, model post-training, or AI safety research would be useful. Strong conceptual research and writing skills are more important than software engineering experience.","group":"FIELD","sub":"FIELD_3","i":28,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Meta-research & automating safety research","url":"https://sparai.org/projects/f26/rec6Vi0ys9vI7GZqJ/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Do AI Safety Benchmarks Hold Up Under Real Deployment Prompts?","id":"rec6YVWuz1lgRRE1x","mentors":"Rahul Kumar (DevRev, Independent AI Safety Researcher)","areas":["Evaluations","Behavioral evaluation of LLMs","EU policy"],"hours":"12 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"AI safety benchmarks test models under clean conditions, but deployed models run with system prompts that tell them how to behave. This project measures whether models that pass the COMPL-AI EU AI Act benchmark suite still pass when you add the system prompts that real enterprise deployments actually use, and tests which minimal prompt fixes restore safety scores.","prereq":"Comfortable writing Python and working with command-line tools\nHas called at least one LLM API (OpenAI, Anthropic, or similar) in code\nCan read a research paper and understand the experimental setup (does not need to have published)\nFamiliarity with what the EU AI Act is (at a high level, not legal expertise)\nBonus: has used UK AISI's Inspect framework or built any kind of model evaluation","group":"EVALS","sub":"EVALS_0","i":29,"hrsN":12,"gname":"Evaluation Science & Eval Awareness","sname":"Benchmark validity & sandbagging","url":"https://sparai.org/projects/f26/rec6YVWuz1lgRRE1x/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"12 hrs"},{"title":"Inter-machine Existential Risk Triage","id":"rec7mj30VARuTCZRH","mentors":"Andrii Shportko (Poseidon Research)","areas":["Multi-agent systems","AI strategy"],"hours":"5 hrs/week","team":"Team size: 6-8 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Building a dynamic Bayesian protocol to rank which multi-agent risks the safety field should prioritize","prereq":"Both teams\n- Bayesian methods\n- AI control / x-risk familiarity\n\nTeam A\n- Forecasting or elicitation experience\n- Calibrated probabilistic reasoning\n- Clear analytical writing\n\nTeam B\n- Proficient in Python\n- Trained/fine-tuned transformers (PyTorch)\n- Familiar with scaling laws","group":"MULTIAGENT","sub":"MULTIAGENT_2","i":30,"hrsN":5,"gname":"Multi-Agent Systems & Coordination","sname":"Escalation, bargaining & crisis dynamics","url":"https://sparai.org/projects/f26/rec7mj30VARuTCZRH/","inv":"Guidance","teamMax":8,"teamShort":"6-8","hoursShort":"5 hrs"},{"title":"Accelerating Democratic AI Leadership by Reforming the US Extraterritorial Surveillance Regime","id":"rec7rlTo6ZnFsEMDa","mentors":"Michelle Nie (Center for a New American Security (CNAS))","areas":["International governance","US policy","AI strategy"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Keeping the most advanced AI within the control of democracies depends on integrating democratic allied nations into the US AI stack, but US extraterritorial surveillance and data access laws are eroding those allies' trust in its tech stack. This project aims to propose a reformed regime that reconciles legitimate US security interests with the trust and assurance allies need to build on American infrastructure.","prereq":"Need-to-have:\n- Strong analytical, research, and writing skills\n- Comfort doing independent desk research\n- Familiarity with AI safety/governance literature \n- Knowledge of/interest in geopolitics of AI, middle power strategy\n\nNice-to-have:\n- Experience with legal analysis (e.g. a law degree or some amount of legal training)\n- Familiarity with middle power government(s) and political dynamics\n- Experience conducting stakeholder interviews or expert outreach\n- Experience presenting to/educating policymakers\n- Prior relevant publications","group":"GOV_POLICY","sub":"GOV_POLICY_1","i":31,"hrsN":10,"gname":"Policy, Law & Institutions","sname":"Great-power strategy & delegation","url":"https://sparai.org/projects/f26/rec7rlTo6ZnFsEMDa/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Biological AI Model Safeguards","id":"rec8C86Vc0kfiTZnM","mentors":"SecureBio AI (SecureBio)","areas":["Biosecurity","Misuse risk","Technical governance"],"hours":"7 hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees will map the safeguard landscape for biological AI models and evaluate which mitigations hold up. Work spans surveying protein and genomic design models, characterizing existing mitigations across the model lifecycle, and assessing where they fail.","prereq":"Able to read and accurately summarize machine learning papers on protein or genomic models. A computational biology or protein ML background is the most direct fit.\nStrong technical writing.\nInterest in the governance and standards side, not only the technical side.\nPython is useful but not required.","group":"BIO","sub":"BIO_1","i":32,"hrsN":7,"gname":"Biosecurity & Bio-AI","sname":"Safeguards & evals for bio foundation models","url":"https://sparai.org/projects/f26/rec8C86Vc0kfiTZnM/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"7 hrs"},{"title":"Run a Matching Round for AI Safety Chiefs of Staff","id":"rec8gcBHOq7X6pnI5","mentors":"Tzu Kit Chan (High Impact CoS)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Own one full matching cycle end to end: take in live roles from hiring organisations, score candidates against them, run the introductions, and write up what the round revealed about how these jobs actually get filled.","prereq":"Comfort talking to founders and senior operators, and asking the second and third question rather than accepting the first answer. Judgment about people, and willingness to make a recommendation you can be wrong about. No recruiting background required.","group":"FIELD","sub":"FIELD_4","i":33,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Org-building, hiring & lab accountability","url":"https://sparai.org/projects/f26/rec8gcBHOq7X6pnI5/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"The Signature of Scheming: Cross-Organism Interpretability of Strategic Misrepresentation","id":"rec8h4EE5tioWPoGA","mentors":"David Williams-King (ERA), Linh Le (Lida Safety), Hong Kiat Tan (University of California - Los Angeles; Independent)","areas":["Mechanistic interpretability","AI control","Alignment"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Investigating different types of scheming (sandbagging, alignment faking, etc) by creating model organisms that exhibit these behaviours, then testing modern interpretability techniques (NLA, J-space) to look for common structure. Such commonality would be a significant boost to the detection of naturally-occurring scheming.","prereq":"- Highly proficient with Python and git (or Github).\n- Has written code to run transformers from Huggingface, with custom system prompts.\n- Has run code on GPUs from the command line on a cluster (or a local machine).","group":"INTERP_PROBES","sub":"INTERP_PROBES_0","i":34,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Detecting scheming & escalation from internals","url":"https://sparai.org/projects/f26/rec8h4EE5tioWPoGA/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"10 h
