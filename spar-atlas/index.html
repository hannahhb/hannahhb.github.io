    '<button class="railback" id="railBack">&larr; All themes</button>' +
    '<div class="ctxhead c-' + d.group + '"><span class="lbl">Selected</span>' +
      '<div class="ht">' + esc(d.title) + '</div>' +
      '<div class="hm">' + esc(d.mentors) + '</div>' +
      (peopleLine(d) ? '<div class="hm">' + peopleLine(d) + '</div>' : '') +
    '</div>' +
    ctxSection('Same cluster', esc(d.sname), mates, 'Alone in its cluster.') +
    ctxSection('Closest by topic', '', neigh, '') +
    ctxSection('Same mentor', '', shared, '');
  ctxEl.hidden = false;
  treeEl.hidden = true;
  if(railNote) railNote.hidden = true;
  document.getElementById('railBack').addEventListener('click', railThemes);
  ctxEl.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ var n = nodes[+b.dataset.go]; select(n); centreOn(n); });
  });
  ctxEl.scrollTop = 0;
}
function railThemes(){
  ctxEl.hidden = true; ctxEl.innerHTML = '';
  treeEl.hidden = false;
  if(railNote) railNote.hidden = false;
}

/* ---- turning what people type into a point on the globe ---- */
var LAND = JSON.parse(document.getElementById('geo-land').textContent);
var PLACES = JSON.parse(document.getElementById('geo-places').textContent);
var cityIndex = {};
PLACES.cities.forEach(function(c){ (cityIndex[c[0]] = cityIndex[c[0]] || []).push(c); });

function geocode(raw){
  if(!raw) return null;
  var parts = String(raw).split(/[,/|]/).map(normTitle).filter(Boolean);
  if(!parts.length) return null;
  var whole = normTitle(raw);
  var cc = parts.length > 1 ? (PLACES.names[parts[parts.length - 1]] || null) : null;
  function city(c){ return { lat:c[1], lon:c[2], label: titleCase(c[0]) + ', ' + (PLACES.labels[c[3]] || c[3]) }; }
  // the whole string, then each comma-separated part, preferring a named country
  var tries = [whole].concat(parts);
  for(var i = 0; i < tries.length; i++){
    var hits = cityIndex[tries[i]];
    if(!hits) continue;
    if(cc){ for(var j = 0; j < hits.length; j++){ if(hits[j][3] === cc) return city(hits[j]); } }
    return city(hits[0]);           // cities are ordered by population
  }
  var code = PLACES.names[whole] || cc || PLACES.names[parts[0]];
  if(code && PLACES.countries[code]){
    return { lat: PLACES.countries[code][0], lon: PLACES.countries[code][1],
             label: PLACES.labels[code] || code, approx: true };
  }
  return null;
}
function titleCase(s){
  return String(s).replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); });
}

/* ---- who's here: a shared roster of people on each project ---- */
var roster = {}, rosterMode = 'none', rosterDb = null, rosterCount = 0;
var places = {}, unplaced = 0, selPlace = null;
var ROLES = ['Mentee','Mentor','Also interested'];
var myToken = (function(){
  try {
    var t = localStorage.getItem('spar-atlas-token');
    if(!t){ t = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('spar-atlas-token', t); }
    return t;
  } catch(e){ return 'anon-' + Math.random().toString(36).slice(2); }
})();

function safeUrl(u){
  if(!u) return null;
  u = String(u).trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { var q = new URL(u); return (q.protocol === 'http:' || q.protocol === 'https:') ? q.href : null; }
  catch(e){ return null; }
}
function clip(v, n){ return String(v == null ? '' : v).trim().slice(0, n); }

function setEntries(list){
  roster = {}; rosterCount = 0;
  list.forEach(function(e){
    if(!e || !e.projectId || !e.name) return;
    (roster[e.projectId] = roster[e.projectId] || []).push(e);
    rosterCount++;
  });
  Object.keys(roster).forEach(function(k){
    roster[k].sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  });
  places = {}; unplaced = 0;
  list.forEach(function(e){
    if(!e || !e.projectId || !e.name) return;
    var g = e.location ? geocode(e.location) : null;
    if(!g){ if(e.location) unplaced++; return; }
    var key = g.lat.toFixed(1) + ',' + g.lon.toFixed(1);
    var slot = places[key] || (places[key] = { lat:g.lat, lon:g.lon, label:g.label, approx:!!g.approx, people:[] });
    slot.people.push(e);
  });
  document.getElementById('pplN').textContent = rosterCount;
  apply();
  if(mode === 'globe') drawGlobe();
  if(panelMode === 'project' && sel) select(sel);
  else if(panelMode === 'dir') directory();
}

/* The published Google Sheet tab, as CSV. Publish ONLY a tab that has no
   email column (File -> Share -> Publish to web -> that tab -> CSV).
   Empty string = fall back to data/people.json alone. */
var SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXhFTbxiuvh7eZT5loX89r8FvdSg6jr2zziLNC-LYFf-UrbqggdJU8Ruucta_EmS88Swts3-ZQegmP/pub?gid=852687721&single=true&output=csv';

function parseCSV(text){
  var rows = [], row = [], cur = '', q = false, i = 0;
  while(i < text.length){
    var c = text.charAt(i);
    if(q){
      if(c === '"'){ if(text.charAt(i+1) === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if(c === '"'){ q = true; }
    else if(c === ','){ row.push(cur); cur = ''; }
    else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(c !== '\r'){ cur += c; }
    i++;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(v){ return v.trim(); }); });
}

var normTitle = function(v){ return String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
var titleIndex = {};
nodes.forEach(function(nd){ titleIndex[normTitle(nd.title)] = nd.id; });
function matchProject(text){
  var k = normTitle(text);
  if(!k) return null;
  if(titleIndex[k]) return titleIndex[k];
  var keys = Object.keys(titleIndex), hit = null;
  for(var i = 0; i < keys.length; i++){
    if(keys[i].indexOf(k) === 0 || k.indexOf(keys[i]) === 0){ hit = titleIndex[keys[i]]; break; }
  }
  return hit;
}

/* Header -> field. Anything mentioning email is dropped outright, so a
   wrongly published tab still cannot put addresses on the page. */
function csvEntries(text){
  var rows = parseCSV(text);
  if(rows.length < 2) return [];
  var map = rows[0].map(function(h){
    var k = normTitle(h);
    if(k.indexOf('email') > -1 || k.indexOf('timestamp') > -1) return null;
    if(k.indexOf('linkedin') > -1) return 'linkedin';
    if(k.indexOf('project') > -1) return 'project';
    if(k.indexOf('name') > -1) return 'name';
    if(k.indexOf('role') > -1) return 'role';
    if(k.indexOf('line') > -1 || k.indexOf('note') > -1) return 'note';
    if(k.indexOf('location') > -1 || k.indexOf('city') > -1 || k.indexOf('country') > -1 || k.indexOf('where') > -1) return 'location';
    if(k.indexOf('link') > -1) return 'link';
    return null;
  });
  var out = [];
  rows.slice(1).forEach(function(r){
    var rec = {};
    map.forEach(function(field, i){ if(field && r[i] && r[i].trim()) rec[field] = r[i].trim(); });
    var pid = matchProject(rec.project);
    if(!pid || !rec.name) return;
    delete rec.project;
    rec.projectId = pid;
    rec.createdAt = 0;
    out.push(rec);
  });
  return out;
}

var rosterFile = [], rosterSheet = [];
function mergeSources(){
  var seen = {}, all = [];
  rosterFile.concat(rosterSheet).forEach(function(e){
    var k = e.projectId + '|' + normTitle(e.name);
    if(seen[k]) return;
    seen[k] = 1; all.push(e);
  });
  if(all.length || rosterMode === 'none') rosterMode = 'static';
  setEntries(all);
}

function initRoster(){
  fetch('data/people.json', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(j && Array.isArray(j.entries)){ rosterFile = j.entries; mergeSources(); } })
    .catch(function(){});
  if(SHEET_CSV){
    fetch(SHEET_CSV, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){ if(t){ rosterSheet = csvEntries(t); mergeSources(); } })
      .catch(function(){ /* sheet unreachable: the committed file still renders */ });
  }
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(function(db){
      if(!db) return;
      rosterDb = db; rosterMode = 'db';
      db.collection('roster').onSnapshot(function(snap){
        setEntries(snap.docs.map(function(doc){
          var o = Object.assign({}, doc.data() || {}); o._id = doc.id; return o;
        }));
      }, function(){ /* terminal: keep whatever is already rendered */ });
    }).catch(function(){});
  }
}

var GH_REPO = 'hannahhb/hannahbb.github.io';
/* Google Form "Spar Atlas Sign Up". Field ids come from the form's
   pre-filled link (⋮ → Get pre-filled link). Add a key here to carry a
   new question through; drop one and that field stops being sent. */
var GFORM = {
  base: 'https://docs.google.com/forms/d/15baGmkFSmcKcHd6oYEKDjMqEF-dW8sgXdv90WF8rR2U/viewform',
  fields: {
    name:    'entry.1431031113',
    linkedin:'entry.1808384973',
    email:   'entry.1911476711',
    project: 'entry.1196920667',
    location:'entry.1018615458'
  }
};
function formUrl(d, e){
  if(!GFORM.base) return null;
  var q = ['usp=pp_url'], f = GFORM.fields;
  var vals = { name:e.name, linkedin:e.linkedin, email:e.email, project:d.title,
               role:e.role, note:e.note, link:e.link, location:e.location };
  Object.keys(f).forEach(function(k){
    if(f[k] && vals[k]) q.push(f[k] + '=' + encodeURIComponent(vals[k]));
  });
  return GFORM.base + '?' + q.join('&');
}
function ghIssue(d, e){
  var slug = GH_REPO.split('/'), owner = slug[0], repo = slug[1];
  if(!owner || !repo) return null;
  var body = ['Add me to the SPAR Project Atlas directory.', '',
    '- **project**: ' + d.title, '- **projectId**: ' + d.id, '- **name**: ' + (e.name || ''),
    '- **role**: ' + (e.role || ''), '- **linkedin**: ' + (e.linkedin || ''),
    '- **link**: ' + (e.link || ''), '- **note**: ' + (e.note || '')].join('\n');
  return 'https://github.com/' + owner + '/' + repo + '/issues/new?title=' +
    encodeURIComponent('Directory: ' + clip(e.name || 'add me', 40) + ' — ' + clip(d.title, 60)) +
    '&labels=directory&body=' + encodeURIComponent(body);
}

function personRow(e){
  var li = safeUrl(e.linkedin), ot = safeUrl(e.link);
  var links = '';
  if(li) links += '<a href="' + esc(li) + '" target="_blank" rel="noopener nofollow">LinkedIn &#8599;</a>';
  if(ot) links += '<a href="' + esc(ot) + '" target="_blank" rel="noopener nofollow">Link &#8599;</a>';
  var mine = rosterMode === 'db' && e.token && e.token === myToken && e._id;
  return '<div class="person">' +
    '<div class="top"><span class="pn">' + esc(clip(e.name,60)) + '</span>' +
    (e.role ? '<span class="pr">' + esc(clip(e.role,24)) + '</span>' : '') +
    (mine ? '<button class="drop" data-drop="' + esc(e._id) + '">remove</button>' : '') + '</div>' +
    (e.location ? '<div class="pnote">' + esc(clip(e.location,80)) + '</div>' : '') +
    (e.note ? '<div class="pnote">' + esc(clip(e.note,140)) + '</div>' : '') +
    (links ? '<div class="plinks">' + links + '</div>' : '') +
  '</div>';
}

function peopleSection(d){
  var list = roster[d.id] || [];
  var rows = list.length ? list.map(personRow).join('')
    : '<div class="person"><div class="pnote">Nobody has added themselves yet. Be first.</div></div>';
  var note = rosterMode === 'db'
    ? 'Saved live for everyone who can open this page.'
    : SHEET_CSV
      ? 'Opens the sign-up form with your details already filled in \u2014 one click to finish. You appear here as soon as you reload.'
      : 'Opens the sign-up form with your details already filled in \u2014 one click to finish. Hannah adds you to the map, usually within a day.';
  return '<h2 class="psub">Who&rsquo;s here <span style="color:var(--faint);font-weight:400">' + list.length + '</span></h2>' +
    '<div class="ppl" id="pplList">' + rows + '</div>' +
    '<div class="acts"><button id="joinBtn">+ Add yourself</button></div>' +
    '<form class="joinform" id="joinForm" data-open="0">' +
      '<label>Name<input id="jName" maxlength="60" required autocomplete="name" placeholder="How you want to be listed"></label>' +
      '<label>LinkedIn<input id="jLi" maxlength="300" inputmode="url" autocomplete="url" placeholder="linkedin.com/in/&hellip;"></label>' +
      (GFORM.fields.location ? '<label>Location<input id="jLoc" maxlength="80" autocomplete="address-level2" placeholder="City, Country \u2014 puts you on the globe"></label>' : '') +
      '<label>Email <span style="text-transform:none;letter-spacing:0">(optional, public)</span><input id="jMail" type="email" maxlength="120" autocomplete="email" placeholder="Only if you want it shared"></label>' +
      '<div class="subbtns">' +
        '<button type="submit" class="go" id="jGo">Continue &rarr; one click to finish</button>' +
      '</div>' +
      '<p class="privacy"><b>This is all public.</b> Your name and LinkedIn appear on this page, and the sign-up sheet behind it is published openly &mdash; so treat your email as public too. Give one you are happy to share, or leave it blank.</p>' +
    '</form>' +
    '<p class="srcnote">' + note +
      (ghIssue(d, {}) ? ' <a href="' + esc(ghIssue(d, {})) + '" target="_blank" rel="noopener">Prefer GitHub? File an issue instead.</a>' : '') +
    '</p>';
}

function wirePeople(d){
  var btn = document.getElementById('joinBtn'), form = document.getElementById('joinForm');
  if(btn && form) btn.addEventListener('click', function(){
    var open = form.dataset.open === '1';
    form.dataset.open = open ? '0' : '1';
    if(!open){ var f = document.getElementById('jName'); if(f) f.focus(); }
  });
  if(form) form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var entry = {
      projectId: d.id,
      name: clip(document.getElementById('jName').value, 60),
      linkedin: clip(document.getElementById('jLi').value, 300),
      email: clip(document.getElementById('jMail').value, 120),
      location: document.getElementById('jLoc') ? clip(document.getElementById('jLoc').value, 80) : '',
      token: myToken,
      createdAt: Date.now()
    };
    if(!entry.name){ toast('A name is required'); return; }
    if(rosterMode === 'db' && rosterDb){
      var go = document.getElementById('jGo'); go.disabled = true; go.textContent = 'Adding…';
      rosterDb.collection('roster').add(entry).then(function(){
        toast('Added — everyone on this page can see you now');
      }).catch(function(err){
        go.disabled = false; go.textContent = 'Add me to this project';
        var c = err && err.code;
        toast(c === 'quota_exceeded' ? 'The directory is full — tell the owner'
            : c === 'resource_exhausted' ? 'Too many writes just now — try again shortly'
            : (c === 'not_granted' || c === 'revoked') ? 'You do not have write access to this directory'
            : 'Could not save — try again');
      });
      return;
    }
    var url = formUrl(d, entry) || ghIssue(d, entry);
    if(url){ window.open(url, '_blank', 'noopener'); toast('Form opened with your details filled in \u2014 just hit Submit'); }
    else toast('Could not open the sign-up form');
  });
  var list = document.getElementById('pplList');
  if(list) list.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-drop]'); if(!b || !rosterDb) return;
    rosterDb.collection('roster').doc(b.dataset.drop).delete()
      .then(function(){ toast('Removed'); })
      .catch(function(){ toast('Could not remove — try again'); });
  });
}

/* ---- globe panels ---- */
function personLine(e){
  var li = safeUrl(e.linkedin), nd = nodes.filter(function(x){ return x.id === e.projectId; })[0];
  return '<div class="person"><div class="top"><span class="pn">' +
    (li ? '<a href="' + esc(li) + '" target="_blank" rel="noopener nofollow">' + esc(clip(e.name,60)) + '</a>' : esc(clip(e.name,60))) +
    '</span>' + (e.role ? '<span class="pr">' + esc(clip(e.role,24)) + '</span>' : '') + '</div>' +
    (nd ? '<div class="pnote"><span class="dt" data-go="' + nd.i + '" style="cursor:pointer;text-decoration:underline;text-underline-offset:2px">' + esc(nd.title) + '</span></div>' : '') +
    (e.note ? '<div class="pnote">' + esc(clip(e.note,140)) + '</div>' : '') + '</div>';
}
function globePanel(){
  panelMode = 'globe'; sel = null; selPlace = null; railThemes();
  var list = Object.keys(places).map(function(k){ return places[k]; })
    .sort(function(a,b){ return b.people.length - a.people.length || a.label.localeCompare(b.label); });
  var html = '<div class="p-eyebrow"><span class="lbl">Globe</span></div><h1 class="ptitle">Where everyone is</h1>';
  if(!list.length){
    html += '<p class="prose">Nobody has given a location yet. Once people do, they appear as pins here &mdash; drag the globe to spin it, and click a pin to see who is there and what they are working on.</p>' +
      '<p class="prose small">Locations are matched against a built-in list of ' + PLACES.cities.length.toLocaleString() +
      ' cities and ' + Object.keys(PLACES.countries).length + ' countries, so &ldquo;Melbourne&rdquo;, &ldquo;Melbourne, Australia&rdquo; and &ldquo;AU&rdquo; all land in the right spot. Nothing is sent anywhere to do it.</p>';
  } else {
    html += '<p class="prose small">Click a place to see who is there. Drag the globe to spin it.</p><div class="near">' +
      list.map(function(pl){
        return '<button class="placerow" data-place="' + esc(pl.label) + '"><span class="pl">' + esc(pl.label) + '</span>' +
          (pl.approx ? '<span class="approx">approx</span>' : '') +
          '<span class="pw">' + pl.people.length + '</span></button>';
      }).join('') + '</div>';
    if(unplaced) html += '<p class="srcnote">' + unplaced + ' ' + (unplaced === 1 ? 'person gave a location that' : 'people gave locations that') + ' could not be matched to a place, so ' + (unplaced === 1 ? 'they are' : 'they are') + ' not on the globe.</p>';
  }
  panelBody.innerHTML = html;
  panelBody.querySelectorAll('[data-place]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = Object.keys(places).filter(function(x){ return places[x].label === b.dataset.place; })[0];
      if(k) showPlace(places[k]);
    });
  });
  document.getElementById('panel').scrollTop = 0;
}
function showPlace(pl){
  panelMode = 'globe'; sel = null; selPlace = pl.label;
  if(mode === 'globe'){
    proj.rotate([-pl.lon, -pl.lat]);
    drawGlobe();
  }
  panelBody.innerHTML = '<button class="railback" id="backGlobe" style="padding-left:0;border:0">&larr; All places</button>' +
    '<div class="p-eyebrow"><span class="lbl">' + (pl.approx ? 'Country' : 'Place') + '</span></div>' +
    '<h1 class="ptitle">' + esc(pl.label) + '</h1>' +
    (pl.approx ? '<p class="prose small">Only a country was given, so this pin sits at the country&rsquo;s centre rather than a real address.</p>' : '') +
    '<h2 class="psub">' + pl.people.length + (pl.people.length === 1 ? ' person' : ' people') + '</h2>' +
    '<div class="ppl">' + pl.people.map(personLine).join('') + '</div>';
  document.getElementById('backGlobe').addEventListener('click', globePanel);
  panelBody.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ var nd = nodes[+b.dataset.go]; select(nd); centreOn(nd); });
  });
  document.getElementById('panel').scrollTop = 0;
  if(window.innerWidth <= 980) document.getElementById('panel').dataset.sheet = '1';
}

/* ---- directory: everyone, grouped by theme ---- */
function directory(){
  panelMode = 'dir'; sel = null; railThemes();
  var html = '<div class="p-eyebrow"><span class="lbl">Directory</span></div>' +
    '<h1 class="ptitle">Who&rsquo;s here, by theme</h1>';
  if(!rosterCount){
    html += '<p class="prose">Nobody has added themselves yet. Open any project and use <b>+ Add yourself</b> &mdash; you appear here, and a ring is drawn around that project on the map.</p>' +
            '<p class="prose small">The point is to find the people working next to you: neighbouring circles are neighbouring questions.</p>';
  } else {
    GORDER.forEach(function(g){
      var projs = byGroup[g].filter(function(n){ return (roster[n.id] || []).length; });
      if(!projs.length) return;
      var head = projs.reduce(function(a,n){ return a + roster[n.id].length; }, 0);
      html += '<div class="dirgroup c-' + g + '"><div class="dh"><span class="dot"></span><b>' + esc(GROUPS[g]) +
        '</b><span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)">' + head + '</span></div>' +
        projs.map(function(n){
          return '<div class="dirproj c-' + g + '"><div class="dt" data-go="' + n.i + '">' + esc(n.title) + '</div>' +
            '<div class="dp">' + roster[n.id].map(function(e){
              var li = safeUrl(e.linkedin);
              return (li ? '<a href="' + esc(li) + '" target="_blank" rel="noopener nofollow">' + esc(clip(e.name,60)) + '</a>'
                         : esc(clip(e.name,60))) + (e.role ? ' <span style="color:var(--faint)">(' + esc(clip(e.role,24)) + ')</span>' : '');
            }).join(' &middot; ') + '</div></div>';
        }).join('') + '</div>';
    });
  }
  panelBody.innerHTML = html;
  panelBody.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ var n = nodes[+b.dataset.go]; select(n); centreOn(n); });
  });
  document.getElementById('panel').scrollTop = 0;
  if(window.innerWidth <= 980) document.getElementById('panel').dataset.sheet = '1';
}
document.getElementById('dirBtn').addEventListener('click', directory);

intro();
apply();
fit(0);
