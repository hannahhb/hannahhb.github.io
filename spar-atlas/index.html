ns, or a technical degree.","group":"GOV_POLICY","sub":"GOV_POLICY_1","i":191,"hrsN":10,"gname":"Policy, Law & Institutions","sname":"Great-power strategy & delegation","url":"https://sparai.org/projects/f26/recSTG0vRi3nFZ4h9/","inv":"Guidance","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Predicting answer activation from context","id":"recsu02eqjsY6T64z","mentors":"Thomas Jiralerspong (Bengio Lab, MATS Anthropic)","areas":["Mechanistic interpretability"],"hours":"15 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"A LLM can be seen as a function from context (input) to answer (output). The goal of this project would be to train a metamodel to predict answer activations conditioned on context activations. We would use similar techniques to https://arxiv.org/pdf/2602.06964 to do this. This would allow us to: - predict what a model will do before generation (by applying some kind of probing to the predicted activations) - potentially predict how data will affect a model (through differentiability of this mapping) - probably many other things","prereq":"- Experience with LLMs and mech interp","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_1","i":192,"hrsN":15,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Model diffing & representation structure","url":"https://sparai.org/projects/f26/recsu02eqjsY6T64z/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"15 hrs"},{"title":"Policy brief - Chinese views on AI loss-of-control risk","id":"rect6u4ovAI4U03t8","mentors":"J\u00e9r\u00e9my Andr\u00e9oletti (General-Purpose AI Policy Lab), Antoine Maier (General-Purpose AI Policy Lab)","areas":["US-China governance","International governance","AI strategy"],"hours":"15 hrs/week","team":"Team size: 1 mentee","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Map how Chinese frontier AI actors (regulators, AI companies, scholars) discuss loss of control over advanced AI systems, assess how seriously they treat this possibility, and how it has evolved over time.","prereq":"- Familiarity with AI safety concepts (alignment, loss of control, etc.).\n- Strong preference for French fluency, as final policy deliverables are written directly in French.\nBonus: ability to read Chinese-language sources.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_1","i":193,"hrsN":15,"gname":"Compute Governance & Geopolitics","sname":"China, Taiwan & the semiconductor chain","url":"https://sparai.org/projects/f26/rect6u4ovAI4U03t8/","inv":"Detailed","teamMax":1,"teamShort":"1","hoursShort":"15 hrs"},{"title":"Coherence-preserving steering via learned activation denoisers","id":"rectBzHvY22Efwfqn","mentors":"Francisco Ferreira da Silva (Pivotal Research)","areas":["Mechanistic interpretability","Alignment"],"hours":"15 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Activation steering is a useful safety tool, but it tends to degrade model coherence; recent work showed that a diffusion-style meta-model of LLM activations can denoise steered activations, recovering coherence without losing the steering effect. We'll test whether training the denoiser directly on steering-like corruption works even better.","prereq":"Strong scientific fundamentals: linear algebra, critical thinking, ability to design and interpret experiments.\nCoding ability per se less important; fluency with agentic coding tools (Claude Code, Cursor, etc.) matters more than writing PyTorch from scratch.\nPrior experience with mech interp or activation steering helpful but not required.","group":"INTERP_PROBES","sub":"INTERP_PROBES_0","i":194,"hrsN":15,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Detecting scheming & escalation from internals","url":"https://sparai.org/projects/f26/rectBzHvY22Efwfqn/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"15 hrs"},{"title":"Curated AI Safety Comment Threads","id":"recTCxF4KnaAjPFAu","mentors":"Helena Tran (Constellation)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Create an annotated collection of valuable LessWrong/EA Forum comment threads that explains the main disagreements, arguments, and cruxes in AI safety debates.","prereq":"Strong reading, synthesis, and editorial judgment. Familiarity with AI safety and LessWrong would be useful.","group":"FIELD","sub":"FIELD_2","i":195,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"Reference works & knowledge distillation","url":"https://sparai.org/projects/f26/recTCxF4KnaAjPFAu/","inv":"Guidance","teamMax":2,"teamShort":"1-2","hoursShort":"5+ hrs"},{"title":"Locating the Refusal Circuit in Unified, Encoder-Free Vision-Language Models","id":"recTF6JBqSCgR6sNf","mentors":"Alessandro Suglia (University of Edinburgh), Rohit Saxena (University of Edinburgh), Francesco Pinto (Google DeepMind)","areas":["Mechanistic interpretability","AI security","Behavioral evaluation of LLMs"],"hours":"16 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"VLMs reliably refuse harmful text prompts but frequently comply with the same intent when it's delivered visually. This is a well-documented \"safety gap\" traced, in modular architectures, to their vision-projector bottleneck. This project asks what happens to that gap in emerging encoder-free, unified VLMs (e.g. Gemma-4-class models) that have no discrete projector to blame and mechanistically locates \u2014 and attempts to patch \u2014 wherever the failure actually lives.","prereq":"- Highly proficient in Python and comfortable in PyTorch and HuggingFace Transformers, including loading and modifying open-weight model code (not just calling high-level pipelines).\n\n- Comfortable writing manual PyTorch forward hooks to extract or modify intermediate activations, without relying on a pre-built library \u2014 TransformerLens-style tooling won't have out-of-the-box support for this model's architecture, since it's only weeks old.\n\n- Knowledge of Vision-Language-Models or experience in using them, going beyond prompting via API.\n\n- Bonus (not required): prior exposure to interpretability techniques (SAEs, activation steering, logit lens, causal mediation), LLM safety/red-teaming.\n\n- Bonus (not required): experience with cloud GPU rental workflows (RunPod, Lambda, Vast.ai, Lightning AI) rather than only managed notebook environments.\n\n- Bonus (not required): experience with logging and reporting tools such as W&B","group":"SECURITY","sub":"SECURITY_1","i":196,"hrsN":16,"gname":"AI Security, Misuse & Cyber","sname":"Mechanistic anatomy of jailbreaks & injections","url":"https://sparai.org/projects/f26/recTF6JBqSCgR6sNf/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"16 hrs"},{"title":"Infohazard Evaluations","id":"recTgCdQR8ZQVhNI0","mentors":"Shi Feng (George Washington University), Taslim Mahbub (George Washington University, CBAI), Arush Tagade (George Washington University, MATS)","areas":["Evaluations","Behavioral evaluation of LLMs"],"hours":"8 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project aims to circumvent introspection requirements for situational awareness by instead studying the possibility of situational awareness being established through access to documents (internal or external) containing infohazardous content.","prereq":"- Proficient in AI-assisted coding (while avoiding common AI code pitfalls)\n- Proficient in Inspect AI OR Agentic evaluation environments\n- Ability to reason from first-principles","group":"SECURITY","sub":"SECURITY_2","i":197,"hrsN":8,"gname":"AI Security, Misuse & Cyber","sname":"Misuse uplift & infohazard measurement","url":"https://sparai.org/projects/f26/recTgCdQR8ZQVhNI0/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"8 hrs"},{"title":"Extending the SCHEME Coordinated Sabotage Benchmark","id":"recTv8x3ebH1ksPpp","mentors":"Pablo Bernabeu P\u00e9rez (Independent), Benjamin Arnav (NYU), Nikolay Radev (Independent)","areas":["AI control","Multi-agent systems","Evaluations"],"hours":"15 hrs/week","team":"Team size: 6-8 mentees","involvement":"Co-working (5+ hr/week/mentee)","summary":"As agentic coding systems split work across many model instances, we study whether those instances can coordinate to pursue a hidden malicious objective while passing as aligned. Building on our SCHEME benchmark (https://arxiv.org/abs/2605.29178), this project will make coordinated-sabotage tasks harder and more realistic, design side tasks that survive models' refusal training, and run a control evaluation to produce conservative safety estimates.","prereq":"- Proficiency in Python, comfortable reading and extending a real evaluation codebase. High iteration speed and AI-assisted coding are valued.\n- Hands-on experience building or running LLM agents including prompting, tool-use, multi-turn orchestration. Familiarity with an eval framework such as Inspect is a strong plus.\n- Familiarity with AI safety / AI control literature and reasoning about threat models.","group":"MULTIAGENT","sub":"MULTIAGENT_3","i":198,"hrsN":15,"gname":"Multi-Agent Systems & Coordination","sname":"Why multi-agent systems fail","url":"https://sparai.org/projects/f26/recTv8x3ebH1ksPpp/","inv":"Co-working","teamMax":8,"teamShort":"6-8","hoursShort":"15 hrs"},{"title":"Subliminal Learning or Model Character Entanglements? Decomposing Emergent Misalignment to Data Generation and Persona Generalization components","id":"recTWkkAQO56qLciH","mentors":"Arush Tagade (George Washington University, MATS), Taslim Mahbub (George Washington University, CBAI), Shaoheng Zhou (Google, Praxis Research Group at George Washington University), Shi Feng (George Washington University)","areas":["Behavioral evaluation of LLMs","Alignment"],"hours":"8 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Emergent Misalignment, while heralded as an important problem, is relatively understudied with respect to the misalignment profiles it causes with relation to model character entanglements. We aim to shed light to this by studying model roleplaying and intervening on the EM data generation process.","prereq":"- Proficient in AI-assisted coding (while avoiding common AI coding pitfalls)\n- Familiarity with LoRA finetuning and tools such as Axolotl, Unsloth etc.\n- Familiarity or willingness to engage with models from an LLM psychology lens\n- Ability to reason from first-principles about catastrophic safety risks","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_0","i":199,"hrsN":8,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Data provenance & unintended generalization","url":"https://sparai.org/projects/f26/recTWkkAQO56qLciH/","inv":"Co-working","teamMax":2,"teamShort":"2","hoursShort":"8 hrs"},{"title":"Probe by Proxy","id":"rectxfIyKQDDXIod0","mentors":"Matt Levinson (Clearwood, PBC)","areas":["Mechanistic interpretability","AI control","Evaluations"],"hours":"10 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Can behavioral propensities of closed-weight agents be recovered from the activations of an open-weight proxy model 'reading' their transcripts?","prereq":"- Highly proficient programmer. Python experience preferred. \n- Has spent time working with transformers. Mech int experience is a plus. Experience pre and/or post training transformers also works. Basically, thinking about weights and gradients and activations can't be new.\n- Experimental experience and understanding. This might be most important. Do you know how to think through the structure of a dataset and a testing regime and understand the ways the results may or may not provide evidence for the question you're trying to answer? When results are positive, do you know how to design the next test to eliminate a possible confounder or unrelated cause? When results are negative, how do you design the next experiment to hone in on an explanation for what to fix?","group":"INTERP_PROBES","sub":"INTERP_PROBES_0","i":200,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Detecting scheming & escalation from internals","url":"https://sparai.org/projects/f26/rectxfIyKQDDXIod0/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"10 hrs"},{"title":"Robustness of Moral Consideration Under Adversarial Pressure","id":"recu2cA6BKdpH8NGA","mentors":"Jasmine Brazilek (Compassion-Aligned Machine Learning (CaML)), Maheep Chaudhary (CaML)","areas":["Alignment","AI welfare","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Investigate the training mechanisms which erode compassion instilled during midtraining. Understand how to preserve self-fulfilling alignment through adversarial attacks.","prereq":"Must-haves\n- Python experience\nExperimental rigor: disciplined about controls and baselines, honest about negative results, and willing to pre-register go/no-go criteria rather than chase a hoped-for outcome.\n- Self-directed. Able to own a thread across the  with weekly check-ins.\n- Genuine interest in AI alignment and nonhuman welfare; the project lives or dies on caring whether the model's consideration is sincere, so we want someone who finds that question motivating.\n\nNice-to-haves\n- Prior work with steering vectors, persona vectors, or representation engineering.\n- Familiarity with the relevant literature \u2014 emergent misalignment, mid-training/value-erosion, or the AI-\u00d7-animals space.\n- Experience with eval harnesses (e.g., Inspect) or benchmark construction.\n- Comfort reasoning about variance and statistics (seed variance is a known failure mode in this line of work).\n- Ability to write results up clearly for an EA-forum / workshop audience.","group":"WELFARE","sub":"WELFARE_3","i":201,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Moral status & comparative welfare theory","url":"https://sparai.org/projects/f26/recu2cA6BKdpH8NGA/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"MM-AutoTrainBench: A Platform for Studying Risk from Autonomous Multimodal Systems Research","id":"reculXvG2VeSRsbIu","mentors":"Daniel Ben-Levi (UChicago XLab, Columbia), Judah Goldfeder (Columbia University), Kevin Miao (UC Berkeley, Bryel Labs)","areas":["Evaluations","AI control","AI security"],"hours":"15 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Rapid acceleration in agent-automated multimodal post-training capabilities could pose significant existential risk if not performed safely due to the major improvements in autonomous research labs and embodied systems it would enable. Currently, no benchmark studying agentic multimodal post-training exists, and thus we both have no concrete understanding of how close we are to such a takeoff and have no good setting for studying security against misaligned agents performing multimodal training tasks. This study aims to address both of these timely problems through the creation of a platform for studying risk from autonomous multimodal systems research.","prereq":"- Significant research experience experimenting with multimodal systems\n- Research experience post-training multimodal systems\n- Significant experience implementing experiments involving LLM coding agent harnesses\n- Preferred: AI monitoring or control research experience, or a prior project that involved examining agent transcripts (i.e. for evidence of reward hacking, etc.)\n- Python proficiency and experience quickly iterating on experiments with agents","group":"SECURITY","sub":"SECURITY_0","i":202,"hrsN":15,"gname":"AI Security, Misuse & Cyber","sname":"Jailbreak evasion, tampering & testing failures","url":"https://sparai.org/projects/f26/reculXvG2VeSRsbIu/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"15 hrs"},{"title":"Resources and Playbooks for University Groups","id":"recUUPuRSDIEWNZTA","mentors":"James Lester (Generator Residency)","areas":["Generalist"],"hours":"5+ hrs/week","team":"Team size: 4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Grow and update the body of shareable knowledge and advice available to university groups (especially more comprehensive \"playbooks\"), so that new organisers aren't starting from scratch.","prereq":"There are no formal prerequisites for this project, though we would guess that the successful applicant(s) will have helped lead a group (EA and/or AI safety) and be familiar with many of the tradeoffs and decisions organisers face.\n\n**You might be a great fit if:**\n- You internalise and endorse the impact case for university groups (and meta uni-groups work)\n- Your writing is clear, concise and appropriately confident\n\n**You might be a worse fit if:**\n- You're interested in a single, longform report-style output\n- You want ultimate editorial control over any outputs that go on the EA or AI safety groups resource centres (CEA and Kairos, respectively, don't want to push advice to groups that they don't endorse)\n- Your intuitions for what makes a great group are pretty different to ours across the board. There's obviously nothing intrinsically wrong with this, but it might make working together less fun and productive.\n\n_If you're worried about any of these caveats (especially the \"intuitions about groups\") but otherwise think you'll be a great applicant, please apply anyway!_","group":"FIELD","sub":"FIELD_5","i":203,"hrsN":5,"gname":"Field-building, Comms & Meta-Research","sname":"University group curricula & playbooks","url":"https://sparai.org/projects/f26/recUUPuRSDIEWNZTA/","inv":"Guidance","teamMax":4,"teamShort":"4","hoursShort":"5+ hrs"},{"title":"Does privacy change what models disclose? Measuring the verbalization gap in chain of thought reasoning","id":"recV2uDw7A3OHxGS5","mentors":"Sohan Venkatesh (LASR Labs)","areas":["Chain of thought","Scalable oversight","Behavioral evaluation of LLMs"],"hours":"20 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"LLMs often fail to mention the thing that actually drove their answer, and the field has not established whether this is concealment or reasoning that never entered token space. We plant cues that provably determine the answer, vary whether the model believes its reasoning is watched and measure how much more it discloses.","prereq":"Required.\n1. High proficiency in Python\n2. Experience with open weights LLMs using HuggingFace transformers or vLLM. Following a guide is fine. You should know what a chat template does and why sampling parameters matter.\n3. Willingness to hand label several hundred model outputs and to write down decision thresholds before seeing results. This is the largest single time cost and it is not delegable.\n\nUseful.\n1. Experience building evaluations or benchmarks.\n2. Experience with structured output judges and their failure modes.\n3. Familiarity with the chain of thought faithfulness literature.\n\nNot required.\n1. Prior publications.\n2. Any interp background","group":"COT","sub":"COT_2","i":204,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Measuring CoT / self-explanation faithfulness","url":"https://sparai.org/projects/f26/recV2uDw7A3OHxGS5/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"20 hrs"},{"title":"Making unlearning stick in genomic foundation models","id":"recVdlu6cDjien31I","mentors":"Ilias Georgakopoulos-Soares (UT Austin)","areas":["Biosecurity","Misuse risk","Technical governance"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Our project plans to test whether UNDO-style noise-and-distillation can make targeted unlearning in genomic foundation models resistant to adversarial fine-tuning, while quantifying the associated compute and performance trade-offs.","prereq":"High proficiency in Python and PyTorch, including the ability to independently debug model-training code, data pipelines, and GPU memory or performance issues.\nHands-on experience training or fine-tuning a transformer or other large sequence model. Following an established implementation is acceptable, but applicants should understand training loops, loss functions, checkpointing, evaluation, and hyperparameter selection.\nFamiliarity with modern deep-learning concepts, including knowledge distillation, representation learning, transfer learning, and model evaluation. Prior experience with machine unlearning is helpful but not required.\nExperience using Linux, Git, and remote computing environments, preferably including multi-GPU training, SLURM, cloud computing, or an institutional high-performance computing cluster.\nAbility to design and execute experiments independently, including selecting appropriate controls, tracking experiments, analysing results statistically, and distinguishing genuine capability removal from temporary performance suppression.\nSufficient mathematical and machine-learning background to read recent technical papers and reproduce methods from them. Relevant coursework or equivalent experience may include machine learning, deep learning, natural language processing, computational biology, statistics, or optimization.\nStrong research communication skills, including maintaining clear documentation and presenting results in written reports, figures, and research meetings.","group":"BIO","sub":"BIO_1","i":205,"hrsN":15,"gname":"Biosecurity & Bio-AI","sname":"Safeguards & evals for bio foundation models","url":"https://sparai.org/projects/f26/recVdlu6cDjien31I/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Can Follow-up Questions Catch Missing Reasoning?","id":"recVHalQ4NlHvSbUC","mentors":"Pierre-Luc St-Charles (LawZero)","areas":["Scalable oversight","AI control","Chain of thought"],"hours":"20 hrs/week","team":"Team size: 1 mentee","involvement":"Co-working (5+ hr/week/mentee)","summary":"We have built a shortcut-following model organism that often fails because it never carries out necessary reasoning that would expose a misleading cue. This project will build a small investigator that asks targeted follow-up questions, then test whether active elicitation catches these failures more reliably and cheaply than passive judges or simple debate/consultancy.","prereq":"Must be highly proficient using Python, and comfortable navigating and modifying large codebases. The project will depend on being able to modify and adapt existing Python code to conduct experiments.\n\nHaving fine-tuned (SFT, RLVR) a language model in PyTorch is likely necessary to build the proposed active investigator. Good experience with an agentic workflow library (e.g. LangChain) may compensate for a lack of experience training large language models directly, but familiarity with transformers is required.","group":"CONTROL","sub":"CONTROL_0","i":206,"hrsN":20,"gname":"AI Control & Scalable Oversight","sname":"Control protocols & escalation to humans","url":"https://sparai.org/projects/f26/recVHalQ4NlHvSbUC/","inv":"Co-working","teamMax":1,"teamShort":"1","hoursShort":"20 hrs"},{"title":"Beyond Neighbours: A Geometry Aware Study of Representational Convergence","id":"recVJbqKVllHbvC2q","mentors":"Trinidad Borrell (Paris Brain Institute. Forschungszentrum J\u00fclich.), Giovanni Marraffini (INRIA. Sigma Nova.)","areas":["Mechanistic interpretability","Scalable oversight"],"hours":"10 hrs/week","team":"Team size: 4 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Manifold-based activation steering is more faithful than linear steering, but each manifold is currently fit per-model: a real limitation for using it in safety tools, since nobody knows if it transfers. This project asks whether the underlying concept geometry is actually shared across models, by re-measuring cross-model alignment with curvature-aware tools (geodesic-distance kernels, Gromov-Wasserstein) instead of the Euclidean CKA that recently found global convergence to be illusory. The answer either licenses building a shared, model-agnostic manifold intervention for a safety-relevant concept, or tells the field  that manifold steering must be validated per model.","prereq":"- Comfortable with linear algebra and basic differential geometry concepts (manifolds, geodesics, intrinsic vs. ambient distance). You don't need to be an expert, but you shouldn't be meeting these ideas for the first time.\n\n- Working knowledge of representation/similarity metrics in ML (CKA, kNN-based alignment) or willingness to get up to speed quickly from Kornblith et al. (2019) and the Aristotelian paper.\n\n- Solid Python and PyTorch; comfortable working with a large existing codebase (we build directly on the Aristotelian repo) rather than starting from scratch.\n\n- Some exposure to optimal transport (Gromov-Wasserstein) or diffusion maps is a plus but not required (willingness to read M\u00e9moli (2011) / Coifman & Lafon (2006) and implement from the paper is enough). \n\n- Prior experience actually running representation-analysis or interpretability experiments (probing, CKA, activation steering) is strongly preferred over purely theoretical familiarity.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_0","i":207,"hrsN":10,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Feature geometry, influence & automated interp","url":"https://sparai.org/projects/f26/recVJbqKVllHbvC2q/","inv":"Detailed","teamMax":4,"teamShort":"4","hoursShort":"10 hrs"},{"title":"Understanding Self-Awareness in LLMs","id":"recvpGTqoLsDdWWOp","mentors":"Christopher Ackerman (MATS; Independent)","areas":["Behavioral evaluation of LLMs","Mechanistic interpretability","Philosophy of AI"],"hours":"16 hrs/week","team":"Team size: 4-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"My research focus is on understanding self-awareness in AI, primarily through behavior-based experiments on components of self-awareness in LLMs and investigations into how these components are implemented, using interpretability techniques. I am also interested in conceptual work to establish frameworks for thinking about self-awareness, and human experiments to establish comparative baselines.","prereq":"Comfortable writing substantial amounts of Python code, as well as with appropriate use of coding agents. High familiarity with LLMs as a user, and a solid understanding of how transformers work. Some background or at least interest in psychology/cognitive science and concepts of self and self-awareness. Familiarity with experimental design is a plus. Good communication skills and work ethic.","group":"PERSONA","sub":"PERSONA_2","i":208,"hrsN":16,"gname":"Personas, Character & Self-Models","sname":"Self-models, identity & introspection","url":"https://sparai.org/projects/f26/recvpGTqoLsDdWWOp/","inv":"Detailed","teamMax":5,"teamShort":"4-5","hoursShort":"16 hrs"},{"title":"Running Frontier Robotics Benchmark Program","id":"recVQ5C0YKqSp4vcG","mentors":"Yashvardhan Sharma (Constellation, Georgetown)","areas":["Generalist","Evaluations","Other"],"hours":"10 hrs/week","team":"Team size: 3-4 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Robocurve and Generator Residency are running an open call for reproducible robotics benchmarks, with up to $500,000 in awards. We're looking for technical program managers with prior experience in robotics or building benchmarks. As part of this project, you will evaluate applications, select the finalist teams to receive funding, run office hours, and help run the program. Roughly 10 hrs/week, mid-September to mid-December.","prereq":"**Required**\n\n- Comfortable with Python and reading unfamiliar codebases\n- Experience building evaluations or benchmarks, or hands-on robotics work\n- Agentic and proactive in solving problems&#x20;\n\n**Helpful**\n\n- Familiarity with LeRobot, Inspect, or [Inspect Robots](https://github.com/robocurve/inspect-robots)\n- Experience with creating evaluations or benchmark design\n- TA experience","group":"FIELD","sub":"FIELD_3","i":209,"hrsN":10,"gname":"Field-building, Comms & Meta-Research","sname":"Meta-research & automating safety research","url":"https://sparai.org/projects/f26/recVQ5C0YKqSp4vcG/","inv":"Guidance","teamMax":4,"teamShort":"3-4","hoursShort":"10 hrs"},{"title":"The continuousness of personas","id":"recvVJENpLe4OLNM7","mentors":"Andy Han (NYU, Anthropic Fellows), Ariana Azarbal (Anthropic Fellows Program; Brown University), Darion Cassel (Independent)","areas":["Mechanistic interpretability","AI welfare","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 1-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"This project aims to understand what personas are: in particular, we'd like to understand to what extent they're continuous.","prereq":"- Experience with empirical ML research, particularly mech interp\n- Familiarity with persona literature\n- Familiarity with AI welfare literature\n- Philosophy background/experience is a plus!","group":"PERSONA","sub":"PERSONA_0","i":210,"hrsN":10,"gname":"Personas, Character & Self-Models","sname":"Persona & emotion vectors","url":"https://sparai.org/projects/f26/recvVJENpLe4OLNM7/","inv":"Detailed","teamMax":3,"teamShort":"1-3","hoursShort":"10 hrs"},{"title":"AI Consciousness: Research and Public Writing","id":"recwqKUHoCqd3iZ83","mentors":"Maria Avramidou (Independent)","areas":["AI welfare","Philosophy of AI"],"hours":"10 hrs/week","team":"Team size: 2-3 mentees","involvement":"Co-working (5+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees will research questions about AI consciousness and turn their findings into rigorous, original, and accessible essays for an audience of AI safety, governance, and policy researchers.","prereq":"Applicants should have:\n- Independent judgment and strong convictions about what matters morally and epistemically in this space.\n- Willingness to work on open-ended questions where there may be no settled answer, and to decide what the right approach is even if others disagree.\n- A pragmatic orientation: applicants should care about producing useful, decision-relevant work, not only exploring abstract questions.\n- Some familiarity with the space, including what the biggest questions and bottlenecks are, and why they have not yet been solved.","group":"WELFARE","sub":"WELFARE_1","i":211,"hrsN":10,"gname":"AI Welfare, Consciousness & Philosophy","sname":"Consciousness, uncertainty & public writing","url":"https://sparai.org/projects/f26/recwqKUHoCqd3iZ83/","inv":"Co-working","teamMax":3,"teamShort":"2-3","hoursShort":"10 hrs"},{"title":"Evaluating Collusion in Untrusted Monitoring","id":"recWSYp5f9SnKiqEA","mentors":"Morgan Sinclaire (University of Wyoming PhD student; BlueDot grantee)","areas":["AI control","Multi-agent systems"],"hours":"10 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"We will be running fine-tuning experiments to carefully evaluate an AI\u2019s ability to do code self-recognition in an untrusted monitoring setup, to understand which anti-collusion measures are needed in AI control.","prereq":"Required:\n- High proficiency in Python.\n- Comfortable running and iterating on ML experiments, e.g. launching runs, debugging, interpreting results, and turning them around reasonably quickly\n- Have fine-tuned an LLM at least once\n- Familiar with ML evaluation basics, e.g. thinking critically about what we're trying to measure, how to read an ROC curve\n- Willing to get up to speed on AI control and untrusted monitoring in the first week, e.g. threat models, anti-collusion protocols, and evaluation methodologies\n\nBonus:\n- Experience fine-tuning LLMs with RL (especially multi-agent setups)\n- Prior familiarity with AI control / untrusted monitoring\n- Prior familiarity with LLMs' ability to recognize subtle stylistic signals (e.g. authorship identification)","group":"MULTIAGENT","sub":"MULTIAGENT_1","i":212,"hrsN":10,"gname":"Multi-Agent Systems & Coordination","sname":"Collusion & untrusted monitoring","url":"https://sparai.org/projects/f26/recWSYp5f9SnKiqEA/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"10 hrs"},{"title":"From Controllability to Concealment A Causal Model Organism of Steganographic Reasoning","id":"recWZb3vFLdTeGWhq","mentors":"Luis Ibanez (Banco Santander)","areas":["Chain of thought","Scalable oversight","AI control"],"hours":"20 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"We will test whether a seemingly harmless capability\u2014controlling one\u2019s own reasoning trace\u2014can become a stepping stone toward a dangerous failure mode: load-bearing reasoning hidden from oversight.","prereq":"Mentees should have strong Python skills, experience with PyTorch or Hugging Face, and the ability to reason carefullyvabout confounding, controls, split hygiene, and negative results. Experience with LoRA/SFT, TRL, PPO/GRPO, mechanistic interpretability, or randomization inference is useful but not required. We care more about experimental judgment and reliable execution than prior publication","group":"COT","sub":"COT_0","i":213,"hrsN":20,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"CoT obfuscation & steganography","url":"https://sparai.org/projects/f26/recWZb3vFLdTeGWhq/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"20 hrs"},{"title":"A Diagnostic Panel of Ground-Truth Probes for Language Models","id":"recX1zoRhxvqP5RD3","mentors":"Mohamed Amine Merzouk (Mila - Quebec AI Institute & McGill University), Adam Oberman (McGill)","areas":["Mechanistic interpretability","Evaluations"],"hours":"20 hrs/week","team":"Team size: 3-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Most safety probing starts from a human concept (deception, sandbagging, sycophancy) and hunts for its direction in activation space, inheriting noisy labels and fragile transfer. This project inverts the recipe: we admit only probe targets with exact, computable ground truth, such as remaining response length, end-of-sequence hazard, repetition onset, copy-versus-generate, and format validity. Individually these are calibrated vital signs for a generating model. Jointly, reproducible patterns across the panel define \"conditions\", named for mechanism the way medicine names syndromes from lab values.","prereq":"Core track: comfortable with Python and PyTorch, able to run inference and train small probes on open models; prior interpretability experience helps but is not required, since every target here comes with its own ground truth and its own sanity checks. A statistics background (survival analysis, calibration) is a plus for the hazard probes. Theory tracks: strong probability or decision theory, and interest in turning theorems into experiments. We care more about care in evaluation than prior safety experience.","group":"INTERP_PROBES","sub":"INTERP_PROBES_3","i":214,"hrsN":20,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Activation monitors & ground-truth probe panels","url":"https://sparai.org/projects/f26/recX1zoRhxvqP5RD3/","inv":"Detailed","teamMax":4,"teamShort":"3-4","hoursShort":"20 hrs"},{"title":"AI character evaluations","id":"recxa76RmUztO99ZH","mentors":"Robert McCarthy (A new AI Character Evaluations Org)","areas":["Behavioral evaluation of LLMs","Evaluations","Alignment"],"hours":"20 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Build a state-of-the-art evaluation for one specific AI character trait/propensity (e.g., behaviour in extreme concentration of power scenarios, corrigibility, prosocial tendencies, law-following, tendency to escalate to humans or whistleblow, etc). Use the eval to measure adherence to the relevant part of the model spec.","prereq":"- Has basic context on AI safety (e.g., equivalent to having taken a BlueDot course)\n- Has previously successfully executed on an empirical AI project (e.g., lead author on a workshop paper-level output)\n- Has spent 80 hours doing technical AI safety research","group":"PERSONA","sub":"PERSONA_1","i":215,"hrsN":20,"gname":"Personas, Character & Self-Models","sname":"Eliciting & red-teaming character","url":"https://sparai.org/projects/f26/recxa76RmUztO99ZH/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"20 hrs"},{"title":"Measuring Agency: Belief and Preference Elicitation for Language Models","id":"recxGaEfyt8YeakYZ","mentors":"Aydin Mohseni (Carnegie Mellon University)","areas":["Behavioral evaluation of LLMs","Evaluations","Mechanistic interpretability"],"hours":"8 hrs/week","team":"Team size: 2-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"We are building metrics for the degree of agency of AI models. We combine empirical belief and preference elicitation on model behavior with interpretability probes to generate belief-desire representations that predict model behavior.","prereq":"Required: experience running experiments with LLMs via API or open-weight models (personal projects fine); comfort with probability at the level of a first course (conditional probability, expectation, independence); exposure to decision theory (expected utility, representation theorems; though I can teach this to a mathematically fluent mentee); experience with interpretability tooling (probing, activation analysis) for the probe-based track; experience analyzing experimental data (pandas, statistical tests).","group":"PERSONA","sub":"PERSONA_1","i":216,"hrsN":8,"gname":"Personas, Character & Self-Models","sname":"Eliciting & red-teaming character","url":"https://sparai.org/projects/f26/recxGaEfyt8YeakYZ/","inv":"Guidance","teamMax":6,"teamShort":"2-6","hoursShort":"8 hrs"},{"title":"Developing economies in the post-AGI era","id":"recXpokdUjxAqwoJL","mentors":"Andrei Potlogea (University of Edinburgh)","areas":["Economics of AI","AI strategy","Societal impacts"],"hours":"5 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"One concern about transformational AI is the concentration of economic output and political power in countries that host the frontier AI developers and infrastructure, in particular the US. This project aims to investigate the \"permanent periphery\" hypothesis via rigorous economic modelling and scope out policy solutions that developing countries might use to secure some exposure to any economic windfall emerging from AI.","prereq":"Economics background with solid programming skills (Python or Julia)","group":"SOCIETAL","sub":"SOCIETAL_1","i":217,"hrsN":5,"gname":"Societal, Economic & Epistemic Impacts","sname":"Macro impacts & public risk preferences","url":"https://sparai.org/projects/f26/recXpokdUjxAqwoJL/","inv":"Co-working","teamMax":2,"teamShort":"1-2","hoursShort":"5 hrs"},{"title":"Distillation-induced Teacher Attribution Bias","id":"recxPoqODXH5rWIDc","mentors":"Arush Tagade (George Washington University, MATS), Taslim Mahbub (George Washington University, CBAI), Shi Feng (George Washington University)","areas":["AI control","Behavioral evaluation of LLMs","Scalable oversight"],"hours":"8 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"LLM self-preference bias has led to concerning behavior related to monitors downplaying harmful actions under self-monitoring scenarios. In this project, we intend to study the effects of distillation on amplifying self-preference bias to the teacher and therefore downplaying harmful actions.","prereq":"- Proficient in AI-assisted coding (while avoiding common AI coding pitfalls)\n- Familiarity with LoRA and full SFT using tools such as Axolotl, Unsloth etc.\n- Familiarity or willingness to engage with models from an LLM psychology lens\n- Ability to reason from first-principles about catastrophic safety risks","group":"ALIGN_TRAIN","sub":"ALIGN_TRAIN_1","i":218,"hrsN":8,"gname":"Alignment \u2014 Training Dynamics & Generalization","sname":"Distillation, mid-training & value drift","url":"https://sparai.org/projects/f26/recxPoqODXH5rWIDc/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"8 hrs"},{"title":"Reliable AI Safety Tools Across Functionally-Equivalant AI Models","id":"recya376zTSObIwnr","mentors":"Bo Zhao (Harvard University)","areas":["Mechanistic interpretability","Evaluations"],"hours":"10 hrs/week","team":"Team size: 1-2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Co-working (5+ hr/week/mentee)","summary":"Two neural networks can behave exactly the same even when their internal weights look different -- for example, hidden components can be reordered, or one internal signal can be scaled up and later scaled back down. We will test whether safety monitors are confused by these behavior-preserving changes and develop ways to make the monitors more reliable.","prereq":"- Highly proficient using Python.\n- Trained or fine-tuned a transformer language model in PyTorch.\n- Spent at least 50 hours working with transformers.\n- Working knowledge of linear algebra.\n- Background in group theory is not required, but willingness to learn enough basic definitions (https://arxiv.org/pdf/2506.13018 Section 2, up to definition 2.4) to formalize our research questions is a plus.","group":"INTERP_PROBES","sub":"INTERP_PROBES_2","i":219,"hrsN":10,"gname":"Interpretability \u2014 Probes & Deception Detection","sname":"Probe reliability across models & data","url":"https://sparai.org/projects/f26/recya376zTSObIwnr/","inv":"Co-working","teamMax":2,"teamShort":"1-2","hoursShort":"10 hrs"},{"title":"New Evaluations Based on Uplift Study Results","id":"recyjRkZl57Taru7F","mentors":"SecureBio AI (SecureBio)","areas":["Biosecurity","Evaluations"],"hours":"7 hrs/week","team":"Team size: 1-2 mentees","involvement":"Guidance (1+ hr/week/mentee), Detailed Guidance (2+ hr/week/mentee)","summary":"Mentees will build evaluation scenarios grounded in how people actually used AI during a large wet-lab uplift trial. Work spans qualitative coding of interaction logs, comparison against SecureBio's existing benchmark coverage, and piloting new items against frontier models.","prereq":"Comfortable building and applying a coding scheme to unstructured data, or equivalent qualitative or mixed-methods research experience.\nWorking proficiency in Python for data analysis.\nEnough familiarity with molecular biology or wet lab work to follow a protocol and recognise where someone went wrong.\nLLM evaluation experience is welcome but not required.","group":"BIO","sub":"BIO_1","i":220,"hrsN":7,"gname":"Biosecurity & Bio-AI","sname":"Safeguards & evals for bio foundation models","url":"https://sparai.org/projects/f26/recyjRkZl57Taru7F/","inv":"Detailed","teamMax":2,"teamShort":"1-2","hoursShort":"7 hrs"},{"title":"Mapping Biorisk Capabilities of Genome Language Models","id":"recyNgVIfl9BSrRFs","mentors":"Noga Aharony (Columbia University)","areas":["Biosecurity","Evaluations"],"hours":"8 hrs/week","team":"Team size: 1-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Genome language models can potentially be used to generate sequences of concern or evade detection. However, their general capabilities as models are not well-tracked or understood. In this project, we will gather all possible benchmarks for a leaderboard, score all existing models, and evaluate patterns and shortcomings in the current capabilities evaluation landscape.","prereq":"Required:\n\n- High proficiency in Python. You will be reading and refactoring other people's research code, not writing scripts from scratch.\n- Comfortable with PyTorch and the Hugging Face stack (transformers, datasets). You have loaded a pretrained transformer, run inference, and pulled hidden states out of it, in any domain. Toy projects and tutorials are fine.\n- Comfortable with git, virtual environments, and running jobs on a remote machine or a rented cloud GPU. You will be expected to make your runs reproducible by someone else.\n- Able to read the methods section of an ML paper and say precisely what its train/test split does and does not control for. This is the core skill the project exercises.\n- Roughly 10 hours per week, sustained, across Sep 14 to Dec 14. Much of this work is careful, methodical verification, and it goes considerably better with steady effort than in bursts.\n\nNot required:\n\n- A genomics or biology background. Several of the people I work best with came from ML and picked up the sequence biology as they went. You will need to be willing to learn it: expect to spend the first two weeks reading about taxonomy, sequence identity, and what a metagenomic read is. The biosecurity analysis in the second half of the project leans on that material most.\n- Prior biosecurity experience, or publications.\nUseful but optional: experience building evaluation harnesses or reproducing a published result; familiarity with sequence-clustering tools such as MMseqs2 or CD-HIT; having been the person who found out why a benchmark number was wrong.","group":"BIO","sub":"BIO_1","i":221,"hrsN":8,"gname":"Biosecurity & Bio-AI","sname":"Safeguards & evals for bio foundation models","url":"https://sparai.org/projects/f26/recyNgVIfl9BSrRFs/","inv":"Guidance","teamMax":3,"teamShort":"1-3","hoursShort":"8 hrs"},{"title":"Auditing Games for Debate: Can Models Learn Human Spot-Checking Patterns?","id":"recyQRpX2HbOZfHYp","mentors":"Jess Bergs (UK AISI), Konstantinos Voudouris (UK AISI; University of Cambridge)","areas":["Scalable oversight","AI control","Behavioral evaluation of LLMs"],"hours":"15 hrs/week","team":"Team size: 2-3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"Human oversight of AI systems relies on spot-checks, whose value rests on their unpredictability. However, decades of cognitive science research show that humans are poor at behaving randomly. Building on Konstantinos' work on judge hacking (Voudouris, Witte & Akata 2026, https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7046698), mentees will test in an auditing game whether models can learn humans' spot-checking patterns.","prereq":"- Strong Python\n- Experience with LLM APIs and evaluation (Inspect a plus)\n- Experience with human data collection through platforms like Prolific\n- Statistics sufficient for sequence and correlation analysis\n- Interest in scalable oversight or judgement, decision-making and game theory welcome, not required.\n- Able and willing to quickly and autonomously figure out how to use new tools\n- Willingness and ability to collaborate with others where needed\n- Understanding of the bigger picture, and helping with prioritisation of tasks","group":"CONTROL","sub":"CONTROL_1","i":222,"hrsN":15,"gname":"AI Control & Scalable Oversight","sname":"Debate, auditing games & automated auditors","url":"https://sparai.org/projects/f26/recyQRpX2HbOZfHYp/","inv":"Detailed","teamMax":3,"teamShort":"2-3","hoursShort":"15 hrs"},{"title":"Global AI Risk Observatory","id":"reczaHd4bPIK3kciC","mentors":"Bart Jaworski (MATS)","areas":["AI strategy","Societal impacts","National policy"],"hours":"20 hrs/week","team":"Team size: 2-4 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"The Global AI Risk Observatory analyses corporate disclosures at scale (~1M documents: annual reports, earnings calls, investor presentations) using LLM auto-graders to track how companies worldwide report AI adoption, risks, and dependencies. Building on a UK AISI-funded pilot of 9,821 UK annual reports, we're expanding to global coverage and translating disclosure trends into policy-relevant findings for AI governance and societal resilience.","prereq":"Technical fellow (LLM data-analysis pipeline):\n\nHighly proficient in Python\nHas built at least one non-trivial LLM application using model APIs (e.g. classification, extraction, or evaluation pipeline \u2014 personal projects are fine)\nComfortable with prompt engineering and structured outputs (e.g. JSON mode, schema-constrained generation)\nBasic applied statistics: can compute and interpret agreement metrics and sanity-check results at scale\n\nGovernance & policy fellow:\n\nStrong analytical writing, demonstrated by a writing sample\nWorking familiarity with at least one AI regulatory regime (e.g. EU AI Act, UK framework, US SEC disclosure rules)\nComfortable reading quantitative results and reasoning carefully from data to policy implications\nNo coding required, but must be willing to work hands-on with data outputs (spreadsheets, dashboards)","group":"GOV_POLICY","sub":"GOV_POLICY_4","i":223,"hrsN":20,"gname":"Policy, Law & Institutions","sname":"State capacity & oversight architecture","url":"https://sparai.org/projects/f26/reczaHd4bPIK3kciC/","inv":"Detailed","teamMax":4,"teamShort":"2-4","hoursShort":"20 hrs"},{"title":"Characterizing Attention Heads via Program Synthesis: Toward Scalable Mechanistic Interpretability","id":"reczIQbtiiK3dRBZs","mentors":"David Bau (Northeastern University)","areas":["Mechanistic interpretability"],"hours":"40 hrs/week","team":"Team size: 3 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"Can we translate a transformer's internal computations into human-readable Python programs? Building on recent program-synthesis approaches to interpretability, this project will strengthen the existing pipeline for QK circuits and tackle the open problem of grounding OV circuits in an interpretable basis, aiming for a full characterization of attention heads across open-source models.","prereq":"- Highly proficient in Python and PyTorch; you'll be implementing and debugging your own experiments fairly independently.\n- Completed at least one hands-on mechanistic interpretability investigation using a library such as nnsight, TransformerLens, or pyvene (self-directed projects, paper replications, and ARENA-style coursework all count).\n- Familiar with common mechanistic interpretability methods such as the logit lens, activation patching, and distributed alignment search (DAS).\n- Experience building LLM pipelines (prompting, API calls, evaluation harnesses).\n- Nice to have: Familiarity with Tracr.","group":"INTERP_CIRCUITS","sub":"INTERP_CIRCUITS_1","i":224,"hrsN":40,"gname":"Interpretability \u2014 Circuits & Representations","sname":"Model diffing & representation structure","url":"https://sparai.org/projects/f26/reczIQbtiiK3dRBZs/","inv":"Detailed","teamMax":3,"teamShort":"3","hoursShort":"40 hrs"},{"title":"Verification Evidence for Compute Governance: What Inspection Regimes Actually Detect","id":"reczlfToH8JjTEb9f","mentors":"Joel Christoph (Research Associate, Graduate Programme on Existential Risks to Humanity), Jonas Kgomo (Equiano Institute)","areas":["Compute governance","Technical governance","International governance"],"hours":"10 hrs/week","team":"Team size: 4-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Compute governance proposals assume detection probabilities that nobody has estimated. This project will build a systematic evidence base on what inspection instruments can actually detect, using existing safeguard records as comparison cases, and evaluate which compute enforcement architectures are technically viable and which are not.","prereq":"One of the two profiles below is enough. You do not need both.\n\n\n1. **Evidence track**. You can read technical or legal source material at length and pull structured claims out of it. You have written at least one substantial researched piece where you had to weigh conflicting sources and say which you believed. Comfort with treaty text, inspection protocols or regulatory documents helps. No prior nuclear knowledge is needed; the reading list is provided and the first three weeks are shared orientation.\n2. **Simulation track**. You can read and extend someone else's Python codebase without hand-holding, and you have taken microeconomic theory, game theory or mechanism design at an advanced undergraduate level or beyond. You should be able to state what a Nash equilibrium of a simple audit game is and compute one.\n\n\nAcross both: you write well in English, you finish what you start, and you can commit ten hours a week for twelve weeks. We would rather have three people at ten reliable hours than five at fifteen intended ones.","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_0","i":225,"hrsN":10,"gname":"Compute Governance & Geopolitics","sname":"Compute verification & inspection regimes","url":"https://sparai.org/projects/f26/reczlfToH8JjTEb9f/","inv":"Guidance","teamMax":6,"teamShort":"4-6","hoursShort":"10 hrs"},{"title":"De-risk a technical crux of retrofittable AI datacenter workload verification systems","id":"reczmfG0zKvPKqGN3","mentors":"Naci Cankaya (Machine Intelligence Research Institute)","areas":["Compute governance","US-China governance","AI security"],"hours":"15 hrs/week","team":"Team size: 2 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee)","summary":"There is a range of problems to resolve in order to make verification of international AI agreements work. Among current technical bets (network monitoring, analog sensors, verifiable resource exhaustion, memory pinging, ...) some have technical cruxes that need more investigation.","prereq":"- Strong STEM generalist. \n- Ability to learn quickly and reason from first principles. \n- High agency and initiative.\n- Over-communicates, but keeps signal-to-noise ratio high.\n\nBonus:\n- Security experience. Cyber or physical.\n- Conducted research in a STEM field, e.g. computer science, physics, etc.\n- Coding proficiency.\n- Strong writing skills, demonstrable through prior work","group":"GOV_COMPUTE","sub":"GOV_COMPUTE_1","i":226,"hrsN":15,"gname":"Compute Governance & Geopolitics","sname":"China, Taiwan & the semiconductor chain","url":"https://sparai.org/projects/f26/reczmfG0zKvPKqGN3/","inv":"Detailed","teamMax":2,"teamShort":"2","hoursShort":"15 hrs"},{"title":"Update the AI Safety Fieldmap","id":"recZsgXKqhr2PMoJW","mentors":"Joseph Kostousov (TAISI), Harry Waterman (Generator Residency)","areas":["Generalist","AI strategy"],"hours":"8 hrs/week","team":"Team size: 2-3 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"Update the AI Safety Fieldmap with accurate information on organizations, FTEs, budgets, funding, and data gaps as of September 2026.","prereq":"Context on the AI safety field and different organizations. Completing a BlueDot course is sufficient. Mentees should also be comfortable using coding agents or willing to learn.","group":"FIELD","sub":"FIELD_3","i":227,"hrsN":8,"gname":"Field-building, Comms & Meta-Research","sname":"Meta-research & automating safety research","url":"https://sparai.org/projects/f26/recZsgXKqhr2PMoJW/","inv":"Guidance","teamMax":3,"teamShort":"2-3","hoursShort":"8 hrs"},{"title":"Evals Synthesis using Interpretability","id":"recZVph3ensijHuz7","mentors":"Isabelle Lee (USC)","areas":["Mechanistic interpretability","Evaluations","Scalable oversight"],"hours":"20 hrs/week","team":"Team size: 3-5 mentees","involvement":"Detailed Guidance (2+ hr/week/mentee), Guidance (1+ hr/week/mentee)","summary":"We craft evaluations of LLMs from human intuitions on a problem and possible failure cases, but what if we don't know the problem themselves well (i.e. the evaluative objectives are unclear)? Can we automatically detect evaluation failures simply from model internals?","prereq":"- proficient with Python and standard ML programming (pytorch, huggingface, etc.)\n- have done interpretability work with model internals: attention, circuits, activation steering etc. (at least 50 hours, preferrably 100 hours)\n- proficient knowledge of math would be a plus! but not necessary.","group":"EVALS","sub":"EVALS_2","i":228,"hrsN":20,"gname":"Evaluation Science & Eval Awareness","sname":"Interpretability-grounded eval design","url":"https://sparai.org/projects/f26/recZVph3ensijHuz7/","inv":"Detailed","teamMax":5,"teamShort":"3-5","hoursShort":"20 hrs"},{"title":"Self-Explanation Faithfulness: Metrics and Training","id":"reczVs5EOjiyFWw1B","mentors":"Harry Mayne (University of Oxford)","areas":["Chain of thought","Scalable oversight","Behavioral evaluation of LLMs"],"hours":"10 hrs/week","team":"Team size: 5-6 mentees","involvement":"Guidance (1+ hr/week/mentee)","summary":"How can we measure whether an LLM\u2019s self-explanation (CoT or post-hoc) corresponds to the real reasons behind its decision? This project will build on metrics introduced in the last year to develop a reliable and scalable measure of self-explanation faithfulness.","prereq":"- High proficiency with Python and the ability to rapidly iterate on experiments.\n- Comfortable with LLM inference both locally and through APIs.\n- Excited about working on a team.\n- [Bonuses] Prior research and publishing experience. Good knowledge of statistical methods.","group":"COT","sub":"COT_2","i":229,"hrsN":10,"gname":"Chain of Thought \u2014 Faithfulness & Monitorability","sname":"Measuring CoT / self-explanation faithfulness","url":"https://sparai.org/projects/f26/reczVs5EOjiyFWw1B/","inv":"Guidance","teamMax":6,"teamShort":"5-6","hoursShort":"10 hrs"}],"edges":[{"s":0,"t":142,"w":0.23},{"s":0,"t":206,"w":0.206},{"s":0,"t":1,"w":0.203},{"s":0,"t":67,"w":0.2},{"s":0,"t":56,"w":0.198},{"s":0,"t":38,"w":0.19},{"s":1,"t":97,"w":0.394},{"s":1,"t":2,"w":0.285},{"s":1,"t":216,"w":0.279},{"s":1,"t":112,"w":0.211},{"s":1,"t":67,"w":0.207},{"s":2,"t":153,"w":0.283},{"s":2,"t":11,"w":0.265},{"s":2,"t":129,"w":0.231},{"s":2,"t":59,"w":0.173},{"s":2,"t":204,"w":0.172},{"s":3,"t":64,"w":0.226},{"s":3,"t":96,"w":0.205},{"s":3,"t":192,"w":0.203},{"s":3,"t":100,"w":0.195},{"s":3,"t":123,"w":0.185},{"s":3,"t":143,"w":0.174},{"s":4,"t":80,"w":0.172},{"s":4,"t":67,"w":0.137},{"s":4,"t":6,"w":0.13},{"s":4,"t":220,"w":0.114},{"s":4,"t":41,"w":0.113},{"s":4,"t":181,"w":0.111},{"s":5,"t":36,"w":0.359},{"s":5,"t":22,"w":0.213},{"s":5,"t":228,"w":0.171},{"s":5,"t":177,"w":0.17},{"s":5,"t":60,"w":0.132},{"s":5,"t":209,"w":0.131},{"s":6,"t":13,"w":0.363},{"s":6,"t":67,"w":0.34},{"s":6,"t":127,"w":0.334},{"s":6,"t":70,"w":0.22},{"s":6,"t":97,"w":0.193},{"s":6,"t":41,"w":0.186},{"s":7,"t":225,"w":0.239},{"s":7,"t":169,"w":0.192},{"s":7,"t":32,"w":0.189},{"s":7,"t":106,"w":0.176},{"s":7,"t":24,"w":0.174},{"s":7,"t":50,"w":0.171},{"s":8,"t":211,"w":0.434},{"s":8,"t":79,"w":0.259},{"s":8,"t":190,"w":0.226},{"s":8,"t":10,"w":0.216},{"s":8,"t":101,"w":0.15},{"s":8,"t":108,"w":0.149},{"s":9,"t":114,"w":0.398},{"s":9,"t":85,"w":0.228},{"s":9,"t":86,"w":0.207},{"s":9,"t":53,"w":0.202},{"s":9,"t":91,"w":0.186},{"s":9,"t":124,"w":0.179},{"s":10,"t":217,"w":0.468},{"s":10,"t":26,"w":0.256},{"s":10,"t":56,"w":0.172},{"s":10,"t":94,"w":0.162},{"s":10,"t":162,"w":0.161},{"s":11,"t":204,"w":0.369},{"s":11,"t":59,"w":0.346 <script>
(function(){
"use strict";
var RAW = JSON.parse(document.getElementById('atlas-data').textContent);
var GROUPS = RAW.groups, SUBS = RAW.subs, nodes = RAW.projects;
var GORDER = ['INTERP_CIRCUITS','INTERP_PROBES','COT','PERSONA','WELFARE','ALIGN_TRAIN','EVALS','CONTROL','MULTIAGENT','SECURITY','BIO','SOCIETAL','GOV_POLICY','GOV_COMPUTE','FIELD'];

/* ---- index ---- */
var byGroup = {}, bySub = {}, subOrder = [];
GORDER.forEach(function(g){ byGroup[g] = []; });
nodes.forEach(function(n){
  n.r = 4.6 + Math.min(n.hrsN, 40) * 0.115;
  byGroup[n.group].push(n);
  if(!bySub[n.sub]){ bySub[n.sub] = []; subOrder.push(n.sub); }
  bySub[n.sub].push(n);
  n.hay = (n.title + ' ' + n.mentors + ' ' + (n.areas||[]).join(' ') + ' ' + n.summary + ' ' + n.gname + ' ' + n.sname).toLowerCase();
});
subOrder.sort(function(a,b){ return GORDER.indexOf(a.replace(/_\d+$/,'')) - GORDER.indexOf(b.replace(/_\d+$/,'')) || a.localeCompare(b); });
var links = RAW.edges.map(function(e){ return { source:e.s, target:e.t, w:e.w }; });
var adj = {};
nodes.forEach(function(n){ adj[n.i] = []; });
RAW.edges.forEach(function(e){ adj[e.s].push([e.t,e.w]); adj[e.t].push([e.s,e.w]); });
Object.keys(adj).forEach(function(k){ adj[k].sort(function(a,b){ return b[1]-a[1]; }); });

/* ---- mentors: split "Name (Org), Name (Org)" into names ---- */
function mentorNames(s){
  if(!s) return [];
  var out = [], re = /([^,()]+?)\s*\(([^)]*)\)/g, m, found = false;
  while((m = re.exec(s))){ out.push(m[1].trim()); found = true; }
  if(!found) out = String(s).split(',').map(function(x){ return x.trim(); });
  return out.filter(Boolean);
}
var mentorIndex = {};
nodes.forEach(function(n){
  n.mnames = mentorNames(n.mentors);
  n.mnames.forEach(function(m){ (mentorIndex[m] = mentorIndex[m] || []).push(n); });
});

/* ---- group anchors: a ring in hue order ---- */
var anchor = {};
GORDER.forEach(function(g,k){
  var a = (k / GORDER.length) * Math.PI * 2 - Math.PI/2;
  anchor[g] = { x: CX + Math.cos(a)*390, y: CY + Math.sin(a)*300 };
});

/* ---- layout A: force web ---- */
var sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(function(d){ return d.i; })
      .distance(function(d){ return 26 + (1-d.w)*46; })
      .strength(function(d){ return 0.14 + d.w*0.5; }))
  .force('charge', d3.forceManyBody().strength(-62).distanceMax(340))
  .force('x', d3.forceX(function(d){ return anchor[d.group].x; }).strength(0.055))
  .force('y', d3.forceY(function(d){ return anchor[d.group].y; }).strength(0.055))
  .force('collide', d3.forceCollide(function(d){ return d.r + 3.2; }).iterations(2))
  .stop();
for(var t=0; t<340; t++) sim.tick();
nodes.forEach(function(n){ n.wx = n.x; n.wy = n.y; });

/* ---- layout B: circle pack (theme > cluster > project) ---- */
(function(){
  var root = { key:'root', children: GORDER.map(function(g){
    return { key:g, children: subOrder.filter(function(s){ return s.indexOf(g+'_')===0; }).map(function(s){
      return { key:s, children: bySub[s].map(function(n){ return { key:n.i, node:n, value: n.r*n.r }; }) };
    }) };
  }) };
  var h = d3.hierarchy(root).sum(function(d){ return d.value || 0; });
  var pack = d3.pack().size([W-90, H-90]).padding(function(d){ return d.depth===0 ? 22 : d.depth===1 ? 13 : 5; });
  pack(h);
  h.each(function(d){ if(d.data.node){ d.data.node.px = d.x+45; d.data.node.py = d.y+45; } });
})();

/* ---- svg scaffolding ---- */
var svgEl = document.getElementById('graph');
var svg = d3.select(svgEl).attr('viewBox', '0 0 ' + W + ' ' + H).attr('preserveAspectRatio','xMidYMid meet');
var view = svg.append('g');
var gHull = view.append('g'), gEdge = view.append('g').attr('class','edges'),
    gNode = view.append('g'), gSLab = view.append('g'), gGLab = view.append('g');

var hullSel = gHull.selectAll('path').data(subOrder).join('path')
  .attr('class', function(s){ return 'hull c-' + s.replace(/_\d+$/,''); });
var slabSel = gSLab.selectAll('text').data(subOrder).join('text')
  .attr('class','slabel').text(function(s){ return SUBS[s]; });
var glabSel = gGLab.selectAll('text').data(GORDER).join('text')
  .attr('class','glabel').text(function(g){ return GROUPS[g].split(' — ')[0]; });
var edgeSel = gEdge.selectAll('line').data(links).join('line')
  .attr('class', function(d){ return d.source.group === d.target.group ? 'same c-' + d.source.group : ''; });
var nodeSel = gNode.selectAll('g').data(nodes).join('g')
  .attr('class', function(d){ return 'node c-' + d.group; });
nodeSel.append('circle').attr('class','halo').attr('r', function(d){ return d.r + 3.6; });
nodeSel.append('circle').attr('r', function(d){ return d.r; });
nodeSel.append('text').attr('class','pcount').attr('y', function(d){ return -d.r - 6; });
nodeSel.append('title').text(function(d){ return d.title; });

/* ---- zoom ---- */
/* ---- globe ---- */
var gGlobe = view.append('g').attr('class','globe').style('display','none');
var gSphere = gGlobe.append('path').attr('class','sphere');
var gGrat   = gGlobe.append('path').attr('class','grat');
var gLand   = gGlobe.append('path').attr('class','land');
var gPins   = gGlobe.append('g');
var gPinLab = gGlobe.append('g');
var proj = d3.geoOrthographic().scale(390).translate([W/2, H/2]).rotate([0, -18]).clipAngle(90);
var geoPath = d3.geoPath(proj);
var GRAT = d3.geoGraticule10();

function visiblePlaces(){
  var r = proj.rotate(), c = [-r[0], -r[1]];
  return Object.keys(places).map(function(k){ return places[k]; })
    .filter(function(pl){ return d3.geoDistance([pl.lon, pl.lat], c) < Math.PI/2 - 0.02; })
    .sort(function(a,b){ return a.lat - b.lat; });
}
function pinR(pl){ return 6 + Math.min(pl.people.length, 9) * 1.3; }

function drawGlobe(){
  gSphere.attr('d', geoPath({ type:'Sphere' }));
  gGrat.attr('d', geoPath(GRAT));
  gLand.attr('d', geoPath(LAND));
  var vis = visiblePlaces();
  var pin = gPins.selectAll('g.pin').data(vis, function(pl){ return pl.label; });
  pin.exit().remove();
  var ent = pin.enter().append('g').attr('class', 'pin');
  ent.append('circle'); ent.append('text');
  var all = ent.merge(pin);
  all.attr('transform', function(pl){ var xy = proj([pl.lon, pl.lat]); return 'translate(' + xy[0].toFixed(1) + ',' + xy[1].toFixed(1) + ')'; })
     .classed('sel', function(pl){ return selPlace === pl.label; })
     .on('click', function(ev, pl){ ev.stopPropagation(); showPlace(pl); });
  all.select('circle').attr('r', pinR);
  all.select('text').text(function(pl){ return pl.people.length; });
  var lab = gPinLab.selectAll('text').data(vis, function(pl){ return pl.label; });
  lab.exit().remove();
  lab.enter().append('text').attr('class', 'pinlab').merge(lab)
     .attr('x', function(pl){ return proj([pl.lon, pl.lat])[0].toFixed(1); })
     .attr('y', function(pl){ return (proj([pl.lon, pl.lat])[1] - pinR(pl) - 5).toFixed(1); })
     .text(function(pl){ return pl.label.split(',')[0]; });
  var total = Object.keys(places).reduce(function(a, k){ return a + places[k].people.length; }, 0);
  document.getElementById('count').textContent = total
    ? total + ' placed in ' + Object.keys(places).length + (Object.keys(places).length === 1 ? ' place' : ' places') +
      (unplaced ? ' \u00b7 ' + unplaced + ' unrecognised' : '')
    : 'No locations yet \u2014 drag to spin';
}

gGlobe.call(d3.drag()
  .on('start', function(ev){ this.__r0 = proj.rotate(); this.__p0 = [ev.x, ev.y]; gGlobe.classed('spinning', true); })
  .on('drag', function(ev){
    var k = 74 / proj.scale(), r0 = this.__r0, p0 = this.__p0;
    proj.rotate([ r0[0] + (ev.x - p0[0]) * k,
                  Math.max(-89, Math.min(89, r0[1] - (ev.y - p0[1]) * k)) ]);
    drawGlobe();
  })
  .on('end', function(){ gGlobe.classed('spinning', false); }));

function globeZoom(f){
  proj.scale(Math.max(150, Math.min(1400, proj.scale() * f)));
  drawGlobe();
}
function globeReset(){ proj.scale(390).rotate([0, -18]); drawGlobe(); }

var zoom = d3.zoom().scaleExtent([0.35, 7]).on('zoom', function(ev){ view.attr('transform', ev.transform); });
svg.call(zoom);
svg.on('dblclick.zoom', null);
function fit(dur){
  var b = { x0:1e9, y0:1e9, x1:-1e9, y1:-1e9 }, any = false;
  nodes.forEach(function(n){ if(n._off) return; any = true;
    b.x0 = Math.min(b.x0, n.x-n.r); b.y0 = Math.min(b.y0, n.y-n.r);
    b.x1 = Math.max(b.x1, n.x+n.r); b.y1 = Math.max(b.y1, n.y+n.r); });
  if(!any) return;
  var pw = b.x1-b.x0+130, ph = b.y1-b.y0+130;
  var k = Math.min(W/pw, H/ph, 6);
  var tx = W/2 - k*(b.x0+b.x1)/2, ty = H/2 - k*(b.y0+b.y1)/2;
  svg.transition().duration(dur||600).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(k));
}

/* ---- drawing ---- */
function hullPath(pts){
  var pad = 17;
  if(pts.length > 2){
    var h = d3.polygonHull(pts);
    if(h && h.length > 2){
      var c = d3.polygonCentroid(h);
      var ex = h.map(function(p){
        var dx = p[0]-c[0], dy = p[1]-c[1], l = Math.hypot(dx,dy) || 1;
        return [p[0]+dx/l*pad, p[1]+dy/l*pad];
      });
      return d3.line().curve(d3.curveCatmullRomClosed.alpha(0.7))(ex);
    }
  }
  var cx = d3.mean(pts, function(p){ return p[0]; }), cy = d3.mean(pts, function(p){ return p[1]; });
  var rad = d3.max(pts, function(p){ return Math.hypot(p[0]-cx, p[1]-cy); }) + pad;
  var ring = d3.range(10).map(function(i){ var a = i/10*Math.PI*2; return [cx+Math.cos(a)*rad, cy+Math.sin(a)*rad]; });
  return d3.line().curve(d3.curveCatmullRomClosed.alpha(0.7))(ring);
}
function draw(){
  nodeSel.attr('transform', function(d){ return 'translate(' + d.x.toFixed(1) + ',' + d.y.toFixed(1) + ')'; });
  edgeSel.attr('x1', function(d){ return d.source.x; }).attr('y1', function(d){ return d.source.y; })
         .attr('x2', function(d){ return d.target.x; }).attr('y2', function(d){ return d.target.y; });
  hullSel.attr('d', function(s){
    var pts = bySub[s].filter(function(n){ return !n._off; }).map(function(n){ return [n.x, n.y]; });
    return pts.length ? hullPath(pts) : null;
  });
  slabSel.each(function(s){
    var pts = bySub[s].filter(function(n){ return !n._off; });
    if(!pts.length){ this.setAttribute('x',-9999); return; }
    var cx = d3.mean(pts, function(n){ return n.x; });
    var y0 = d3.min(pts, function(n){ return n.y - n.r; });
    this.setAttribute('x', cx.toFixed(1)); this.setAttribute('y', (y0-22).toFixed(1));
  });
  var placed = [];
  glabSel.each(function(g){
    var pts = byGroup[g].filter(function(n){ return !n._off; });
    if(!pts.length){ this.setAttribute('x',-9999); return; }
    var cx = d3.mean(pts, function(n){ return n.x; });
    var cy = d3.mean(pts, function(n){ return n.y; });
    var hw = (this.textContent.length * 6.9) / 2 + 6;
    for(var pass = 0; pass < 7; pass++){
      var clash = placed.some(function(r){ return Math.abs(r.x-cx) < r.hw+hw && Math.abs(r.y-cy) < 16; });
      if(!clash) break;
      cy += 17;
    }
    placed.push({ x:cx, y:cy, hw:hw });
    this.setAttribute('x', cx.toFixed(1)); this.setAttribute('y', cy.toFixed(1));
  });
}

/* ---- mode switching ---- */
var mode = 'web', anim = null;
function goto(target, done){
  if(anim) cancelAnimationFrame(anim);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var start = nodes.map(function(n){ return [n.x, n.y]; });
  var end = nodes.map(target);
  if(reduce){ nodes.forEach(function(n,i){ n.x = end[i][0]; n.y = end[i][1]; n.fx = n.x; n.fy = n.y; }); draw(); if(done) done(); return; }
  var t0 = performance.now(), dur = 780;
  (function step(now){
    var p = Math.min(1, (now-t0)/dur), e = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    nodes.forEach(function(n,i){
      n.x = start[i][0] + (end[i][0]-start[i][0])*e;
      n.y = start[i][1] + (end[i][1]-start[i][1])*e;
      n.fx = n.x; n.fy = n.y;
    });
    draw();
    if(p < 1) anim = requestAnimationFrame(step); else { anim = null; if(done) done(); }
  })(t0);
}

function setMode(m){

}

    (mentorIndex[m] || []).forEach(function(n){ if(n !== d && shared.indexOf(n) === -1) shared.push(n); });
  });
