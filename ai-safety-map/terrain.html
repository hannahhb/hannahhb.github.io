<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500&display=swap">
<style>
:root{
  --ground:#07090C; --surface:#10151A; --surface-2:#161D24; --ink:#EAF1F4;
  --ink-2:#B4C3CA; --muted:#7C8B93; --faint:#57646B; --hairline:#1E282F; --link:#6FD2C6;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.5);
  --sans:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --disp:"Familjen Grotesk","Public Sans",system-ui,sans-serif;
  --panel:326px; --top:52px; --scrub:52px;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:3px}
.app{display:grid;grid-template-columns:minmax(0,1fr) var(--panel);grid-template-rows:var(--top) minmax(0,1fr) var(--scrub);height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 13px;background:var(--surface);border-bottom:1px solid var(--hairline);z-index:6}
.brand b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-left:8px}
.sep{width:1px;height:20px;background:var(--hairline)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:4px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--link);font-weight:600}
.tb{border:1px solid var(--hairline);background:var(--surface-2);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--ink-2);cursor:pointer;text-decoration:none;white-space:nowrap}
.spacer{flex:1}
.flt{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;padding:3px 9px}
.flt span{font-family:var(--mono);font-size:10.5px;color:var(--link);min-width:34px;text-align:right}
.flt input{width:74px;accent-color:var(--link)}
.who{background:var(--surface-2);border:1px solid var(--hairline);border-radius:6px;padding:5px 9px;font-size:12px;width:168px}
.who.on{border-color:var(--link);color:var(--link)}
.hint{font-family:var(--mono);font-size:10px;color:var(--faint)}
.canvas{grid-row:2;position:relative;overflow:hidden;background:var(--ground)}
#c{display:block;width:100%;height:100%;cursor:grab}
#c.drag{cursor:grabbing}
.crumb{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:3}
.crumb button{border:1px solid var(--hairline);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;box-shadow:var(--shadow);font-size:11.5px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--hairline);border-radius:7px;box-shadow:var(--shadow);padding:7px 9px;font-size:12px;opacity:0;transition:opacity .1s;z-index:5;max-width:280px}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px;line-height:1.3}
.tip span{color:var(--muted);font-size:11px}
.lod{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10px;color:var(--faint);background:color-mix(in oklab,var(--surface) 82%,transparent);padding:4px 8px;border-radius:5px;z-index:3}
.scrub{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 15px;background:var(--surface);border-top:1px solid var(--hairline);z-index:5}
.scrub button{border:1px solid var(--hairline);background:var(--surface-2);border-radius:6px;width:30px;height:27px;cursor:pointer;display:grid;place-items:center;color:var(--link)}
.scrub input[type=range]{flex:1;accent-color:var(--link)}
.qlab{font-family:var(--mono);font-size:12.5px;min-width:70px;color:var(--link)}
.qsub{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:170px;text-align:right}
.panel{grid-row:2;overflow-y:auto;background:var(--surface);border-left:1px solid var(--hairline)}
.pad{padding:15px 15px 30px}
h1.pt{font-family:var(--disp);font-weight:700;font-size:17.5px;line-height:1.24;letter-spacing:-.02em;margin:0 0 9px;text-wrap:balance}
h2.ps{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:15px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--hairline)}
.prose{font-size:12.6px;line-height:1.6;color:var(--ink-2)}
.prose.s{font-size:12px}
.wl{display:flex;flex-direction:column;gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:7px;overflow:hidden}
.wl button,.wl a{display:flex;gap:8px;background:var(--surface);padding:6px 9px;color:var(--ink-2);font-size:12px;border:0;text-align:left;cursor:pointer;width:100%;text-decoration:none;line-height:1.35}
.wl button:hover,.wl a:hover{background:var(--surface-2);color:var(--ink)}
.wl .cc{font-family:var(--mono);font-size:10px;color:var(--link);min-width:48px;text-align:right;flex:none}
.sw{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
.warn{background:var(--surface-2);border:1px solid var(--hairline);border-left:3px solid var(--link);border-radius:6px;padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--ink-2);margin:10px 0 0}
@media (max-width:900px){.app{grid-template-columns:1fr}.panel{display:none}.hint,.qsub{display:none}}
</style>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>AI Safety Terrain</b><span id="sub"></span></div>
    <div class="sep"></div>
    <div class="seg" role="group" aria-label="Measure">
      <button id="mCum" aria-pressed="true">Cumulative</button>
      <button id="mTrail" aria-pressed="false">Recent activity</button>
    </div>
    <div class="seg" role="group" aria-label="Camera angle">
      <button id="vTop">Top</button>
      <button id="vTilt" aria-pressed="true">Tilted</button>
      <button id="vLow">Low</button>
    </div>
    <button class="tb" id="wkBtn" aria-pressed="false">Works</button>
    <label class="flt" title="Hide works below this many citations">
      <span id="fltLab">all</span>
      <input type="range" id="flt" min="0" max="6" step="1" value="0">
    </label>
    <input id="who" class="who" type="search" placeholder="Highlight a researcher…" autocomplete="off">
    <button class="tb" id="labBtn" aria-pressed="true">Labels</button>
    <a class="tb" href="index.html">Overlap map &rarr;</a>
    <a class="tb" href="wave.html">Flat map &rarr;</a>
    <a class="tb" href="figures/index.html">Analysis &rarr;</a>
    <div class="spacer"></div>
    <span class="hint">Drag to orbit · scroll to zoom · click a label to descend</span>
  </header>
  <main class="canvas" id="canvas">
    <canvas id="c"></canvas>
    <div class="crumb" id="crumb" hidden></div>
    <div class="lod" id="lod"></div>
    <div class="tip" id="tip"></div>
  </main>
  <aside class="panel"><div class="pad" id="pb"></div></aside>
  <div class="scrub">
    <button id="play">&#9654;</button>
    <span class="qlab" id="qlab"></span>
    <input type="range" id="qr" min="0" max="14" value="14" step="0.02">
    <span class="qsub" id="qsub"></span>
  </div>
</div>

<script>
(function(){

AREAS.forEach(function(a,i){a.hue=Math.round(i*(360/AREAS.length));a.i=i;});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---- the view window over the world; zooming shrinks it ---- */
var full={cx:0,cy:0,half:660};
var win={cx:0,cy:0,half:660}, target=null, focusArea=null;
var R=84;
var SMOOTH=1.95;        // kernel width in cells; higher = smoother massifs
var minCites=0;         // impact floor, set by the toolbar slider
var hiName='', hiSet=null;                       // grid cells per side, constant - detail comes
                                // from the window shrinking, not more cells
var measure='cumulative', t=QS.length-1, showWorks=false, showLab=true, playing=null;
var cam={az:-0.55,el:0.62,dist:1500};

var cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
var DPR=Math.min(2,devicePixelRatio||1), CW=0, CH=0;
function resize(){
  var r=cvs.parentNode.getBoundingClientRect();
  CW=r.width;CH=r.height;cvs.width=CW*DPR;cvs.height=CH*DPR;
  cvs.style.width=CW+'px';cvs.style.height=CH+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  rebuild();
}
function project(x,y,z){
  var ca=Math.cos(cam.az),sa=Math.sin(cam.az);
  var X=x*ca-y*sa, Y=x*sa+y*ca;
  var ce=Math.cos(cam.el),se=Math.sin(cam.el);
  var Y2=-(Y*se+z*ce), Z2=Y*ce-z*se;
  var f=cam.dist/(cam.dist+Z2*0.8+620);
  return [CW/2+X*f*1.1, CH/2+Y2*f*1.1+70*f, Z2, f];
}

/* ---- the terrain, summed fresh for whatever window we are looking at ---- */
var H=[], OWN=[], peak=1, sigmaNow=0, cellNow=0;
function rebuild(){
  var step=(win.half*2)/(R-1);
  // Smooth at the scale we can actually draw: any narrower and the surface
  // aliases into spikes between samples. So zooming in sharpens the kernel,
  // and structure that was one smooth hill resolves into its parts.
  var sigma=Math.max(8, step*SMOOTH);
  sigmaNow=sigma; cellNow=step;
  var inv=1/(2*sigma*sigma), reach=sigma*2.7;
  var qi=Math.round(t);
  for(var y=0;y<R;y++){ H[y]=H[y]||new Float32Array(R); H[y].fill(0);
    OWN[y]=OWN[y]||new Int16Array(R); OWN[y].fill(-1); }
  var per={};
  for(var i=0;i<DEP.length;i++){
    var d=DEP[i];
    if(d[3]>qi) continue;
    if(measure==='trailing' && d[3]<=qi-TRAIL) continue;
    if(minCites>0 && (META[i].c||0)<minCites) continue;
    var lx=d[0]-win.cx+win.half, ly=d[1]-win.cy+win.half;
    if(lx<-reach||lx>win.half*2+reach||ly<-reach||ly>win.half*2+reach) continue;
    var gx0=Math.max(0,Math.floor((lx-reach)/step)), gx1=Math.min(R-1,Math.ceil((lx+reach)/step));
    var gy0=Math.max(0,Math.floor((ly-reach)/step)), gy1=Math.min(R-1,Math.ceil((ly+reach)/step));
    var ai=d[4], pa=per[ai]||(per[ai]=[]);

      for(var gy=gy0;gy<=gy1;gy++){
        var dy=gy*step-ly;
        var k=d[2]*Math.exp(-(dx*dx+dy*dy)*inv);
        if(k<1e-4) continue;
        H[gy][gx]+=k;
        var row=pa[gy]||(pa[gy]=new Float32Array(R));
        row[gx]+=k;
      }
    }
  }

  for(var y2=0;y2<R;y2++) for(var x2=0;x2<R;x2++) if(H[y2][x2]>peak) peak=H[y2][x2];
  if(peak<=0) peak=1;
  for(var y3=0;y3<R;y3++) for(var x3=0;x3<R;x3++){
    var best=0,bi=-1;
    for(var a in per){ var rr=per[a][y3]; if(!rr) continue;
      var v=rr[x3]; if(v>best){best=v;bi=+a;} }
    OWN[y3][x3]=bi;
  }
  draw();
}
function worldOf(gx,gy){
  var step=(win.half*2)/(R-1);
  return [win.cx-win.half+gx*step, win.cy-win.half+gy*step];
}
function oklch(L,C,h){
  var hr=h*Math.PI/180, a=C*Math.cos(hr), b=C*Math.sin(hr);
  var l_=L+0.3963377774*a+0.2158037573*b, m_=L-0.1055613458*a-0.0638541728*b, s_=L-0.0894841775*a-1.2914855480*b;
  var l=l_*l_*l_, m=m_*m_*m_, s=s_*s_*s_;
  function g(v){v=v<=0.0031308?12.92*v:1.055*Math.pow(Math.max(v,0),1/2.4)-0.055;
    return Math.max(0,Math.min(255,Math.round(v*255)));}
  return 'rgb('+g(4.0767416621*l-3.3077115913*m+0.2309699292*s)+','+
    g(-1.2684380046*l+2.6097574011*m-0.3413193965*s)+','+
    g(-0.0041960863*l-0.7034186147*m+1.7076147010*s)+')';
}

var quadHits=[];
function draw(){
  ctx.clearRect(0,0,CW,CH);
  var HS=Math.min(520, win.half*0.9);
  var sc=760/win.half;               // keep the window filling the frame
  var quads=[];
  for(var gy=0;gy<R-1;gy++){
    for(var gx=0;gx<R-1;gx++){
      var h00=H[gy][gx]/peak, h10=H[gy][gx+1]/peak, h01=H[gy+1][gx]/peak, h11=H[gy+1][gx+1]/peak;
      var hm=(h00+h10+h01+h11)/4;
      var w0=worldOf(gx,gy), w1=worldOf(gx+1,gy), w2=worldOf(gx+1,gy+1), w3=worldOf(gx,gy+1);
      function P(w,h){return project((w[0]-win.cx)*sc,(w[1]-win.cy)*sc,Math.pow(h,0.62)*HS);}
      var p00=P(w0,h00),p10=P(w1,h10),p11=P(w2,h11),p01=P(w3,h01);
      var dzdx=(h10-h00+h11-h01)*0.5, dzdy=(h01-h00+h11-h10)*0.5;
      var nl=Math.hypot(-dzdx*9,-dzdy*9,1)||1;
      var dot=Math.max(0.06,(-dzdx*9*0.40+-dzdy*9*(-0.36)+0.84)/nl);
      quads.push({d:(p00[2]+p10[2]+p11[2]+p01[2])/4,p:[p00,p10,p11,p01],h:hm,dot:dot,
        own:OWN[gy][gx],gx:gx,gy:gy});
    }
  }
  quads.sort(function(a,b){return b.d-a.d;});
  quadHits=quads;
  quads.forEach(function(q){
    var A=AREAS[q.own]||AREAS[0];
    var e=Math.pow(q.h,0.7);
    // solid ground: opaque fill, lit by slope, so it reads as land not gauze
    var L=0.10+e*0.52+q.dot*0.26;
    var C=0.020+e*0.115;
    ctx.fillStyle=oklch(L,C,A.hue);
    ctx.beginPath();ctx.moveTo(q.p[0][0],q.p[0][1]);
    for(var i=1;i<4;i++) ctx.lineTo(q.p[i][0],q.p[i][1]);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=0.7;ctx.stroke();  // seal the seams
  });
  if(showWorks) drawWorks(HS,sc);
  if(showLab) labels(HS,sc);
  document.getElementById('lod').textContent=
    'window '+Math.round(win.half*2)+' · cell '+cellNow.toFixed(1)+' · smoothing '+sigmaNow.toFixed(1);
  document.getElementById('qlab').textContent=QS[Math.round(t)];
  var n=DEP.filter(function(d){return d[3]<=Math.round(t);}).length;
  document.getElementById('qsub').textContent=n.toLocaleString()+' works · peak '+peak.toFixed(1);
}
function heightAt(wx,wy){
  var step=(win.half*2)/(R-1);
  var fx=(wx-win.cx+win.half)/step, fy=(wy-win.cy+win.half)/step;
  var x0=Math.max(0,Math.min(R-1,Math.floor(fx))), y0=Math.max(0,Math.min(R-1,Math.floor(fy)));
  var x1=Math.min(R-1,x0+1), y1=Math.min(R-1,y0+1), tx=fx-x0, ty=fy-y0;
  var a=H[y0][x0]*(1-tx)+H[y0][x1]*tx, b=H[y1][x0]*(1-tx)+H[y1][x1]*tx;
  return (a*(1-ty)+b*ty)/peak;
}
var workHits=[];
var MAXC=1; for(var _i=0;_i<META.length;_i++) MAXC=Math.max(MAXC,META[_i].c||0);
function drawWorks(HS,sc){
  workHits.length=0;
  var qi=Math.round(t);
  var pts=[];
  for(var i=0;i<DEP.length;i++){
    var d=DEP[i];
    if(d[3]>qi) continue;
    if(measure==='trailing' && d[3]<=qi-TRAIL) continue;
    if(Math.abs(d[0]-win.cx)>win.half||Math.abs(d[1]-win.cy)>win.half) continue;
    var m=META[i], c=m.c||0;
    if(minCites>0 && c<minCites) continue;
    var mine=hiSet?hiSet.has(i):false;
    if(hiSet && !mine) continue;
    var ground=Math.pow(heightAt(d[0],d[1]),0.62)*HS;
    // A work's OWN citations lift it off the ground it stands on. Previously a
    // dot sat flush on the terrain, so a barely-cited paper on the flank of a
    // tall hill appeared just as high as an influential one - the height it was
    // showing belonged to its neighbourhood, not to it.
    var lift=(Math.log10(1+c)/Math.log10(1+MAXC))*HS*0.42;
    var base=project((d[0]-win.cx)*sc,(d[1]-win.cy)*sc,ground+3);
    var top=project((d[0]-win.cx)*sc,(d[1]-win.cy)*sc,ground+3+lift);
    pts.push({base:base,top:top,c:c,i:i,d:top[2],lift:lift,mine:mine});
  }
  pts.sort(function(a,b){return b.d-a.d;});
  pts.forEach(function(o){
    var strength=Math.log10(1+o.c)/Math.log10(1+MAXC);
    if(o.lift>2){
      ctx.strokeStyle='rgba(255,255,255,'+(0.10+strength*0.42).toFixed(3)+')';
      ctx.lineWidth=Math.max(0.5,1.1*o.top[3]);
      ctx.beginPath();ctx.moveTo(o.base[0],o.base[1]);ctx.lineTo(o.top[0],o.top[1]);ctx.stroke();
    }
    var r=Math.max(0.9,(0.9+strength*3.4)*o.top[3])*(o.mine?1.9:1);
    ctx.fillStyle=o.mine?'rgba(122,226,255,0.96)'
      :'rgba(255,255,255,'+(0.34+strength*0.62).toFixed(3)+')';
    ctx.beginPath();ctx.arc(o.top[0],o.top[1],r,0,6.283);ctx.fill();
    workHits.push({x:o.top[0],y:o.top[1],r:Math.max(5,r+3),i:o.i});
  });
}
var labHits=[];
function labels(HS,sc){
  labHits.length=0;
  AREAS.forEach(function(A){
    if(Math.abs(A.x-win.cx)>win.half*1.05||Math.abs(A.y-win.cy)>win.half*1.05) return;
    var h=heightAt(A.x,A.y);
    var p=project((A.x-win.cx)*sc,(A.y-win.cy)*sc,Math.pow(h,0.62)*HS+26);
    var size=Math.max(10,12.5*p[3]);
    ctx.font='600 '+size+'px "Familjen Grotesk", sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    var w=ctx.measureText(A.name).width;
    ctx.fillStyle='rgba(7,9,12,.66)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(p[0]-w/2-5,p[1]-size/2-3,w+10,size+6,4); else ctx.rect(p[0]-w/2-5,p[1]-size/2-3,w+10,size+6);
    ctx.fill();
    ctx.fillStyle=oklch(0.88,0.09,A.hue);
    ctx.fillText(A.name,p[0],p[1]);
    labHits.push({x:p[0],y:p[1],w:w/2+6,h:size/2+4,A:A});
    ctx.textBaseline='alphabetic';
  });
}

/* ---- descending into an area ---- */
function flyTo(cx,cy,half,area){
  var from={cx:win.cx,cy:win.cy,half:win.half}, t0=performance.now();
  focusArea=area||null;
  (function step(now){
    var p=Math.min(1,(now-t0)/620), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    win.cx=from.cx+(cx-from.cx)*e; win.cy=from.cy+(cy-from.cy)*e;
    win.half=from.half+(half-from.half)*e;
    rebuild();
    if(p<1) requestAnimationFrame(step); else { crumbs(); panel(); }
  })(t0);
}
function crumbs(){
  var el=document.getElementById('crumb');
  if(win.half>=full.half-1){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML='<button id="up">&larr; Whole field</button>';
  document.getElementById('up').addEventListener('click',function(){
    focusArea=null; flyTo(full.cx,full.cy,full.half,null);});
}

/* ---- interaction ---- */
var drag=null, hoverWork=null;
cvs.addEventListener('pointerdown',function(e){
  drag={x:e.clientX,y:e.clientY,az:cam.az,el:cam.el,moved:false};
  cvs.classList.add('drag');cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',function(e){
  if(drag){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>3) drag.moved=true;
    cam.az=drag.az+(e.clientX-drag.x)*0.006;
    cam.el=Math.max(0.34,Math.min(1.5533,drag.el+(e.clientY-drag.y)*0.005));
    draw();return;}
  var r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var tip=document.getElementById('tip'), best=null,bd=1e9;
  for(var i=workHits.length-1;i>=0;i--){var W=workHits[i],d2=Math.hypot(W.x-mx,W.y-my);
    if(d2<W.r&&d2<bd){bd=d2;best=W;}}
  if(best){
    hoverWork=META[best.i]; cvs.style.cursor='pointer';
    var m=hoverWork;
    tip.innerHTML='<b>'+esc(m.t)+'</b><span>'+esc((m.au||[]).join(', ')||'author not matched')+
      '<br>'+(m.c||0).toLocaleString()+' citations · height above ground is its own citations</span>';
    tip.style.left=Math.min(CW-290,mx+14)+'px';tip.style.top=Math.max(4,my-52)+'px';
    tip.classList.add('on');return;}
  hoverWork=null;cvs.style.cursor='grab';
  var hit=null;
  labHits.forEach(function(L){if(Math.abs(L.x-mx)<L.w&&Math.abs(L.y-my)<L.h) hit=L;});
  if(hit){
    tip.innerHTML='<b>'+esc(hit.A.name)+'</b><span>'+hit.A.works+' works · click to descend</span>';
    tip.style.left=Math.min(CW-250,mx+14)+'px';tip.style.top=Math.max(4,my-46)+'px';tip.classList.add('on');
  } else tip.classList.remove('on');});
addEventListener('pointerup',function(){drag=null;cvs.classList.remove('drag');});
cvs.addEventListener('click',function(e){
  if(drag&&drag.moved) return;
  if(hoverWork&&hoverWork.u){window.open(hoverWork.u,'_blank','noopener');return;}
  var r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,hit=null;
  labHits.forEach(function(L){if(Math.abs(L.x-mx)<L.w&&Math.abs(L.y-my)<L.h) hit=L;});
  if(hit){ flyTo(hit.A.x,hit.A.y,Math.max(150,hit.A.spread*2.1),hit.A); }});
cvs.addEventListener('mouseleave',function(){document.getElementById('tip').classList.remove('on');});
cvs.addEventListener('wheel',function(e){
  e.preventDefault();
  win.half=Math.max(90,Math.min(full.half,win.half*(1+Math.sign(e.deltaY)*0.14)));
  if(win.half>=full.half-1){win.cx=full.cx;win.cy=full.cy;focusArea=null;}
  rebuild();crumbs();},{passive:false});

/* ---- panel ---- */
function panel(){
  var pb=document.getElementById('pb'), qi=Math.round(t);
  if(focusArea){
    var inside=[];
    for(var i=0;i<DEP.length;i++){
      var d=DEP[i];
      if(d[4]!==focusArea.i||d[3]>qi) continue;
      if(Math.abs(d[0]-focusArea.x)>win.half||Math.abs(d[1]-focusArea.y)>win.half) continue;
      inside.push({m:META[i]});
    }
    inside.sort(function(a,b){return (b.m.c||0)-(a.m.c||0);});
    pb.innerHTML='<h1 class="pt">'+esc(focusArea.name)+'</h1>'+
      '<p class="prose">'+esc(focusArea.blurb)+'</p>'+
      '<p class="prose s" style="color:var(--muted)">'+focusArea.works+' works · '+
      Math.round(focusArea.mass[qi]||0).toLocaleString()+' citation mass by '+QS[qi]+'</p>'+
      '<div class="warn">You are inside this area now. The terrain is being summed at this '+
      'scale, so the bumps you see are its own works &mdash; not a magnified picture of the hill '+
      'you clicked.</div>'+
      '<h2 class="ps">Most cited here</h2><div class="wl">'+
      inside.slice(0,16).map(function(o){
        return '<a href="'+esc(o.m.u)+'" target="_blank" rel="noopener"><span class="cc">'+
          (o.m.c||0).toLocaleString()+'</span><span>'+esc(o.m.t)+'</span></a>';}).join('')+'</div>';
    return;
  }
  var ranked=AREAS.slice().sort(function(a,b){return (b.mass[qi]||0)-(a.mass[qi]||0);});
  pb.innerHTML='<h1 class="pt">The field as ground you can walk into</h1>'+
    '<p class="prose">Every work sits where its <b>content</b> puts it &mdash; positions come from the papers&rsquo; own embeddings, so two works land together when they are about the same thing, whatever their citation counts. Summed, they make hills: height is citation mass, colour is the area that owns that ground.</p>'+
    '<h2 class="ps">Two different heights</h2>'+
    '<p class="prose s">The <b>ground</b> is aggregate citation mass &mdash; how much impact has piled up in that '+
    'neighbourhood. A work standing on a tall hill is not itself well cited; it just has well-cited neighbours. '+
    'So each work is drawn on a stem whose <b>length is its own citations</b>. Low-cited papers hug the ground, '+
    'influential ones rise clear of it.</p>'+
    '<h2 class="ps">Filters</h2>'+
    '<p class="prose s">The slider hides works below a citation threshold, so you can watch the '+
    'terrain reduce to only what has actually landed. Typing a name lights that researcher&rsquo;s '+
    'works in blue across the whole map.</p>'+
    '<p class="prose s"><b>Click an area label to descend into it.</b> The terrain is recomputed at '+
    'whatever scale you are viewing, so a hill that looks smooth from up here breaks into its own '+
    'ridges and hollows once you are inside it. Scroll to zoom, drag to orbit.</p>'+
    '<h2 class="ps">Areas by citation mass</h2><div class="wl">'+
    ranked.map(function(A){
      return '<button data-a="'+A.i+'"><span class="cc">'+Math.round(A.mass[qi]||0).toLocaleString()+
        '</span><span class="sw" style="background:'+oklch(0.70,0.15,A.hue)+'"></span>'+
        '<span>'+esc(A.name)+'</span></button>';}).join('')+'</div>'+
    '<div class="warn">Citations are a present-day count. Moving the slider changes which works exist '+
    'yet, not how cited they were at the time.</div>';
  pb.querySelectorAll('[data-a]').forEach(function(b){
    b.addEventListener('click',function(){
      var A=AREAS[+b.dataset.a];
      flyTo(A.x,A.y,Math.max(150,A.spread*2.1),A);});});
}

/* ---- filters ---- */
// A log ladder, because citation counts are: most works sit in single digits
// and the interesting thresholds are order-of-magnitude steps.
var STEPS=[0,1,5,10,50,100,500];
document.getElementById('flt').addEventListener('input',function(){
  minCites=STEPS[+this.value];
  document.getElementById('fltLab').textContent=minCites?('\u2265'+minCites):'all';
  rebuild();});
document.getElementById('who').addEventListener('input',function(){
  hiName=this.value.trim().toLowerCase();
  this.classList.toggle('on',!!hiName);
  if(!hiName){hiSet=null;}
  else{
    hiSet=new Set();
    for(var i=0;i<META.length;i++){
      var au=(META[i].au||[]).join(' ').toLowerCase();
      if(au.indexOf(hiName)>-1) hiSet.add(i);
    }
    if(!hiSet.size) hiSet=null;
    if(hiSet && !showWorks){showWorks=true;
      document.getElementById('wkBtn').setAttribute('aria-pressed','true');}
  }
  draw(); personPanel();});

function personPanel(){
  if(!hiSet){ panel(); return; }
  var rows=[];
  hiSet.forEach(function(i){rows.push({m:META[i],a:DEP[i][4],q:DEP[i][3]});});
  rows.sort(function(a,b){return (b.m.c||0)-(a.m.c||0);});
  var byArea={};
  rows.forEach(function(r){byArea[r.a]=(byArea[r.a]||0)+1;});
  var name=rows.length?(rows[0].m.au||[]).filter(function(n){
    return n.toLowerCase().indexOf(hiName)>-1;})[0]||hiName:hiName;
  document.getElementById('pb').innerHTML=
    '<h1 class="pt">'+esc(name)+'</h1>'+
    '<p class="prose s" style="color:var(--muted)">'+rows.length+' works on this terrain · '+
    rows.reduce(function(s2,r){return s2+(r.m.c||0);},0).toLocaleString()+' citations</p>'+
    '<div class="warn">Their works are lit in blue on the terrain. Only the first three authors '+
    'of each paper are recorded, so later positions will be missing.</div>'+
    '<h2 class="ps">Where they work</h2><div class="wl">'+
    Object.keys(byArea).sort(function(a,b){return byArea[b]-byArea[a];}).map(function(ai){
      var A=AREAS[ai];
      return '<button data-a="'+ai+'"><span class="cc">'+byArea[ai]+'</span>'+
        '<span class="sw" style="background:'+oklch(0.70,0.15,A.hue)+'"></span>'+
        '<span>'+esc(A.name)+'</span></button>';}).join('')+'</div>'+
    '<h2 class="ps">Most cited</h2><div class="wl">'+
    rows.slice(0,12).map(function(r){
      return '<a href="'+esc(r.m.u)+'" target="_blank" rel="noopener"><span class="cc">'+
        (r.m.c||0).toLocaleString()+'</span><span>'+esc(r.m.t)+'</span></a>';}).join('')+'</div>';
  document.getElementById('pb').querySelectorAll('[data-a]').forEach(function(b){
    b.addEventListener('click',function(){
      var A=AREAS[+b.dataset.a];
      flyTo(A.x,A.y,Math.max(150,(A.scatter||120)*1.9),A);});});
}

/* ---- chrome ---- */
var qr=document.getElementById('qr');
qr.max=QS.length-1;qr.value=QS.length-1;
qr.addEventListener('input',function(){t=+this.value;rebuild();});
document.getElementById('play').addEventListener('click',function(){
  var b=this;
  if(playing){cancelAnimationFrame(playing);playing=null;b.innerHTML='&#9654;';return;}
  if(t>=QS.length-1)t=0;
  b.innerHTML='&#10073;&#10073;';
  var last=performance.now();
  (function step(now){
    var dt=(now-last)/1000;last=now;
    t=Math.min(QS.length-1,t+dt*1.1);qr.value=t;rebuild();
    if(t>=QS.length-1){playing=null;b.innerHTML='&#9654;';return;}
    playing=requestAnimationFrame(step);})(last);});
function setMeasure(m){measure=m;
  document.getElementById('mCum').setAttribute('aria-pressed',m==='cumulative');
  document.getElementById('mTrail').setAttribute('aria-pressed',m==='trailing');rebuild();}
document.getElementById('mCum').addEventListener('click',function(){setMeasure('cumulative');});
document.getElementById('mTrail').addEventListener('click',function(){setMeasure('trailing');});
function glide(el){
  var from=cam.el, t0=performance.now();
  (function step(now){
    var p=Math.min(1,(now-t0)/420), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    cam.el=from+(el-from)*e; draw();
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function markAngle(id){
  ['vTop','vTilt','vLow'].forEach(function(k){
    document.getElementById(k).setAttribute('aria-pressed',k===id);});
}
// 89 degrees rather than a flat 90: straight down loses every height cue,
// and a degree of lean keeps the hills readable as hills
document.getElementById('vTop').addEventListener('click',function(){glide(1.5533);markAngle('vTop');});
document.getElementById('vTilt').addEventListener('click',function(){glide(0.62);markAngle('vTilt');});
document.getElementById('vLow').addEventListener('click',function(){glide(0.36);markAngle('vLow');});
document.getElementById('wkBtn').addEventListener('click',function(){
  showWorks=!showWorks;this.setAttribute('aria-pressed',showWorks);draw();});
document.getElementById('labBtn').addEventListener('click',function(){
  showLab=!showLab;this.setAttribute('aria-pressed',showLab);draw();});
document.getElementById('sub').textContent=DEP.length.toLocaleString()+' works · '+AREAS.length+' areas';
addEventListener('resize',resize);
panel(); resize();
})();
</script>
