<h1>AI Safety Corpus — descriptive analysis</h1>
<p>4,521 works across 18 research areas, classified by SPECTER2 embeddings. Citations are a present-day snapshot from Semantic Scholar. <a href='../terrain.html'>Back to the terrain</a>.</p>
<figure><h2>Citation distribution</h2><img src='01_citation_distribution.png' alt='Citation distribution'><figcaption>3,385 works with at least one citation (1,136 with none). Median 7, 90th percentile 92, 99th 792 — the top 1% of works hold 41% of all citations.</figcaption></figure>
<figure><h2>Citations by area</h2><img src='02_citations_by_area.png' alt='Citations by area'><figcaption>Box shows the interquartile range, line the median, count in brackets. Areas differ far more in volume than in typical per-work impact.</figcaption></figure>
<figure><h2>Distinctive vocabulary</h2><img src='03_area_vocabulary.png' alt='Distinctive vocabulary'><figcaption>Log-odds of each word appearing in this area versus the rest of the corpus. High bars are terms of art; their absence would mean an area is not distinctive.</figcaption></figure>
<figure><h2>Growth over time</h2><img src='04_growth.png' alt='Growth over time'><figcaption>Counted by publication quarter. The dip in the most recent quarters is indexing lag, not a decline — very recent work has not all been picked up yet.</figcaption></figure>
<figure><h2>Impact concentration</h2><img src='05_concentration.png' alt='Impact concentration'><figcaption>Lorenz curve of citations. Gini 0.89 — a value near 1 means a handful of works account for almost everything, which is the normal shape for citation data.</figcaption></figure>
<figure><h2>Area overlap</h2><img src='06_overlap_matrix.png' alt='Area overlap'><figcaption>Jaccard overlap on the soft area assignments. Ordered by size; the diagonal is blanked.</figcaption></figure>
<figure><h2>Citations by publication quarter</h2><img src='07_citations_by_age.png' alt='Citations by publication quarter'><figcaption>Older work has had longer to accumulate, so the downward slope is age, not quality. This is the curve that any 'most cited' ranking is quietly fighting.</figcaption></figure>
<figure><h2>Venue mix by area</h2><img src='08_venue_mix.png' alt='Venue mix by area'><figcaption>Areas are in the same order as the previous chart. The grey bar on the left is work that exists only as an arXiv preprint; areas dominated by it are moving faster than peer review, or are not aimed at it.</figcaption></figure>
<figure><h2>Researchers: output vs reach</h2><img src='09_people_output_impact.png' alt='Researchers: output vs reach'><figcaption>Both axes are logarithmic. Citations and karma are summed only to place people on one chart — they are not comparable units. Affiliation is missing for most people, so the grey cloud is not a finding about independents.</figcaption></figure>
<figure><h2>Entry cohorts</h2><img src='10_entry_cohorts.png' alt='Entry cohorts'><figcaption>Half of the 2,936 people in this dataset published their first AI-safety work in 2024 or later — it measures entry into safety, not the start of a research career. 2026 is not a full year and 2025 dips against its neighbours; treat the last three bars as one plateau rather than reading a trend into them.</figcaption></figure>
<figure><h2>Papers vs forum posts</h2><img src='11_two_literatures.png' alt='Papers vs forum posts'><figcaption>Each dot is one person; the axis floor is 'none'. Only 67 of 2,936 people write in both registers. The terrain map is built from papers alone, because Semantic Scholar does not index forum posts — this chart is the size of what that omits.</figcaption></figure>
